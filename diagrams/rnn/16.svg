<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="固定窗口的限制。上下文长度写死，位置使用不同权重"><title>固定窗口的限制</title><desc>上下文长度写死，位置使用不同权重。扩大窗口仍不能覆盖任意长度历史，也会增加输入与参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">固定窗口的限制</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">上下文长度写死，位置使用不同权重</text><text x="65" y="111" fill="#263f35" font-size="15" font-weight="650" text-anchor="start" font-family="sans-serif">固定窗口 n = 3</text><rect x="65" y="134" width="92" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="111" y="160" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">x_(t−2)</text><rect x="167" y="134" width="92" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="213" y="160" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">x_(t−1)</text><rect x="269" y="134" width="92" height="42" rx="5" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="315" y="160" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">x_t</text><path d="M361 155 L470 155" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="490" y="116" width="170" height="80" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="575" y="149" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">前馈网络</text><text x="575" y="174" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">位置各自连接</text><path d="M660 155 L750 155" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="770" y="134" width="112" height="42" rx="5" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="826" y="160" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">x_(t+1)</text><path d="M65 238 L882 238" fill="none" stroke="#a8c2b4" stroke-width="2" stroke-dasharray="5 7"/><text x="480" y="274" fill="#a75d52" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">更早历史 x_(t−3), x_(t−4), … 完全不可见</text><rect x="225" y="315" width="510" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="346" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">窗口扩大仍是有限上下文。</text></g></svg>
