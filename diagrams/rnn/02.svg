<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="本讲路线。表示 → 递归 → 门控 → 生成"><title>本讲路线</title><desc>表示 → 递归 → 门控 → 生成。四部分依次回答：输入如何编码、历史如何传递、长期信息如何保留、完整序列如何生成。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">本讲路线</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">表示 → 递归 → 门控 → 生成</text><rect x="50" y="135" width="204.5" height="112" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="152.25" y="184" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">01 表示</text><text x="152.25" y="209" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">Word2Vec</text><path d="M254.5 191 L265.5 191" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="268.5" y="135" width="204.5" height="112" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="370.75" y="184" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">02 递归</text><text x="370.75" y="209" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">RNN / BPTT</text><path d="M473 191 L484 191" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="487" y="135" width="204.5" height="112" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="589.25" y="184" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">03 门控</text><text x="589.25" y="209" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">LSTM / GRU</text><path d="M691.5 191 L702.5 191" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="705.5" y="135" width="204.5" height="112" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="807.75" y="184" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">04 生成</text><text x="807.75" y="209" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">Seq2Seq / Attention</text><text x="480" y="306" fill="#667f72" font-size="17" font-weight="400" text-anchor="middle" font-family="sans-serif">每一步都在回答：当前计算需要从过去取回什么？</text></g></svg>
