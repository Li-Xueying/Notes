<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="加入缩放，得到标准公式"><title>加入缩放，得到标准公式</title><desc>在理解打分和汇总之后，引入 √dₖ 缩放，控制点积尺度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">加入缩放，得到标准公式</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">Attention(Q,K,V) = softmax(QKᵀ/√dₖ)V</text><rect x="46" y="161" width="193" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="142.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">点积分数</text><text x="142.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">QKᵀ</text><path d="M239 207 L259 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="263" y="161" width="193" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="359.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">控制尺度</text><text x="359.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">除以 √dₖ</text><path d="M456 207 L476 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="161" width="193" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="576.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">逐行归一化</text><text x="576.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">Softmax</text><path d="M673 207 L693 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="697" y="161" width="193" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="793.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">汇总内容</text><text x="793.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">乘 V</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">序列长 N：权重 N × N，输出 N × dᵥ</text></g></svg>
