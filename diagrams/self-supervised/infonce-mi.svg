<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">互信息下界需要抽样条件</title><desc id="desc">标准推导中正样本来自联合关系，负样本独立从边缘分布抽样；下界是 log N 减损失，损失本身不是互信息下界。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">互信息下界需要抽样条件</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="141" y="137" width="678" height="83" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="480" y="172.5" font-size="18" fill="#263f35" text-anchor="middle">I(f(x); f(x⁺)) ≥ log N − 𝓛N</text><text x="480" y="198.5" font-size="14" fill="#5d7469" text-anchor="middle">下界由候选数量和预测损失共同确定</text><rect x="141" y="272" width="678" height="65" rx="4" fill="#fcf3df" stroke="#a8c2b4"/><text x="480" y="310.5" font-size="18" fill="#263f35" text-anchor="middle">正样本：联合关系；负样本：独立边缘抽样</text></g></svg>
