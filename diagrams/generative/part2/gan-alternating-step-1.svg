<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">冻结一方，更新另一方</title><desc id="desc">冻结生成器，沿判别目标更新 a、b</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">冻结一方，更新另一方</text><path d="M42 63 H918" stroke="#ccdbd2"/><text x="480" y="102" font-size="18" fill="#283b34" text-anchor="middle">结构算例：真实 x=1，噪声 z=1，学习率 0.2</text><rect x="42" y="142" width="260" height="110" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172" y="171" font-size="18" fill="#283b34" text-anchor="middle">G(z)=g z</text><text x="172" y="196" font-size="14" fill="#63766c" text-anchor="middle">g=0.2000</text><text x="172" y="218" font-size="14" fill="#63766c" text-anchor="middle">假样本=0.2000</text><path d="M306 197 L347 197" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="351" y="142" width="310" height="110" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="506" y="171" font-size="18" fill="#283b34" text-anchor="middle">D(u)=sigmoid(a u+b)</text><text x="506" y="196" font-size="14" fill="#63766c" text-anchor="middle">a=1.0318</text><text x="506" y="218" font-size="14" fill="#63766c" text-anchor="middle">b=-0.0562</text><path d="M665 197 L706 197" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="710" y="142" width="208" height="110" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="814" y="171" font-size="18" fill="#283b34" text-anchor="middle">当前分数</text><text x="814" y="196" font-size="14" fill="#63766c" text-anchor="middle">D(真)=0.7262</text><text x="814" y="218" font-size="14" fill="#63766c" text-anchor="middle">D(假)=0.5375</text><rect x="157" y="309" width="646" height="65" rx="4" fill="#f9e7e3" stroke="#ccdbd2"/><text x="480" y="338" font-size="18" fill="#283b34" text-anchor="middle">冻结 G，更新 D</text><text x="480" y="363" font-size="14" fill="#63766c" text-anchor="middle">同一步更新只改变一方的参数</text><text x="480" y="421" font-size="17" fill="#63766c" text-anchor="middle">分数由当前参数重算；G 使用非饱和损失</text></g></svg>
