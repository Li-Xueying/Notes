<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">负对数概率就是交叉熵</title><desc id="desc">InfoNCE（信息噪声对比估计损失）把识别正样本写为 N 路分类，目标类别是正样本在列表中的位置，来自视图配对关系。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">负对数概率就是交叉熵</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="48" y="115" width="185" height="87" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="140.5" y="152.5" font-size="18" fill="#263f35" text-anchor="middle">正候选</text><text x="140.5" y="178.5" font-size="14" fill="#5d7469" text-anchor="middle">分数 2</text><text x="139" y="236" font-size="18" fill="#263f35" text-anchor="middle">exp = 7.389</text><text x="139" y="292" font-size="19" fill="#263f35" text-anchor="middle">p = 0.644</text><rect x="276" y="115" width="185" height="87" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="368.5" y="152.5" font-size="18" fill="#263f35" text-anchor="middle">负候选 1</text><text x="368.5" y="178.5" font-size="14" fill="#5d7469" text-anchor="middle">分数 1</text><text x="367" y="236" font-size="18" fill="#263f35" text-anchor="middle">exp = 2.718</text><text x="367" y="292" font-size="19" fill="#263f35" text-anchor="middle">p = 0.237</text><rect x="504" y="115" width="185" height="87" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="596.5" y="152.5" font-size="18" fill="#263f35" text-anchor="middle">负候选 2</text><text x="596.5" y="178.5" font-size="14" fill="#5d7469" text-anchor="middle">分数 0</text><text x="595" y="236" font-size="18" fill="#263f35" text-anchor="middle">exp = 1.000</text><text x="595" y="292" font-size="19" fill="#263f35" text-anchor="middle">p = 0.087</text><rect x="732" y="115" width="185" height="87" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="824.5" y="152.5" font-size="18" fill="#263f35" text-anchor="middle">负候选 3</text><text x="824.5" y="178.5" font-size="14" fill="#5d7469" text-anchor="middle">分数 -1</text><text x="823" y="236" font-size="18" fill="#263f35" text-anchor="middle">exp = 0.368</text><text x="823" y="292" font-size="19" fill="#263f35" text-anchor="middle">p = 0.032</text><rect x="42" y="362" width="876" height="48" rx="4" fill="#f5f9f6" stroke="#d7e5dc"/><text x="480" y="393" font-size="18" fill="#176653" text-anchor="middle">结构算例：−log p+ = 0.440</text></g></svg>
