<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="三种解码策略。贪心、穷举与束搜索"><title>三种解码策略</title><desc>贪心、穷举与束搜索。搜索质量与计算成本之间存在明确权衡，束搜索仍不保证全局最优。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">三种解码策略</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">贪心、穷举与束搜索</text><rect x="55" y="115" width="260" height="180" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="185" y="198" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">贪心</text><text x="185" y="223" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">每步只保留 1 条</text><text x="185" y="238" fill="#a75d52" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">快 · 无法回退</text><rect x="350" y="115" width="260" height="180" rx="6" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.4"/><text x="480" y="198" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">穷举</text><text x="480" y="223" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">保留 |V|^T 条</text><text x="480" y="238" fill="#b47936" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">完整 · 成本不可承受</text><rect x="645" y="115" width="260" height="180" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="775" y="198" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">束搜索</text><text x="775" y="223" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">每步保留 k 条</text><text x="775" y="238" fill="#176653" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">近似 · 可控折中</text></g></svg>
