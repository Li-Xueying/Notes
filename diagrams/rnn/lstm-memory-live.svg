<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="保留项和写入项怎样改变记忆"><title>保留项和写入项怎样改变记忆</title><desc>补充数值例子固定门值，隔离计算关系；实际门值由网络学习。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">保留项和写入项怎样改变记忆</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">依次执行四个计算步骤</text><text x="480" y="113" font-size="16" fill="#263f35" text-anchor="middle" font-weight="400">固定 f = [0.75, 0.25]，i = [0.5, 0.8]，c̃ = [0.2, 0.3]，o = [0.5, 0.8]</text><g data-memory-node="0"><rect x="38" y="162" width="166" height="106" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="121" y="208" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">旧细胞 cₜ₋₁</text><text x="121" y="236" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">[0.8, −0.4]</text></g><g data-memory-node="1" visibility="hidden"><rect x="220" y="162" width="166" height="106" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="303" y="208" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">保留 f ⊙ c</text><text x="303" y="236" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">[0.6, −0.1]</text><path d="M204 215 L218 215" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/></g><g data-memory-node="2" visibility="hidden"><rect x="402" y="162" width="166" height="106" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="485" y="208" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">写入 i ⊙ c̃</text><text x="485" y="236" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">[0.1, 0.24]</text><path d="M386 215 L400 215" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/></g><g data-memory-node="3" visibility="hidden"><rect x="584" y="162" width="166" height="106" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="667" y="208" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">新细胞 cₜ</text><text x="667" y="236" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">[0.7, 0.14]</text><path d="M568 215 L582 215" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/></g><g data-memory-node="4" visibility="hidden"><rect x="766" y="162" width="166" height="106" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="849" y="208" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">隐藏状态 hₜ</text><text x="849" y="236" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">[0.302, 0.111]</text><path d="M750 215 L764 215" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/></g><rect x="48" y="320" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="352" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">cₜ = f ⊙ cₜ₋₁ + i ⊙ c̃      hₜ = o ⊙ tanh(cₜ)</text></g></svg>
