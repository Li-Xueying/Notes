<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="从预测误差到参数更新"><title>从预测误差到参数更新</title><desc>前向传播产生预测，损失函数衡量误差，反向传播计算调整方向，优化器更新权重。</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.7"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.7"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start"><tspan x="48" dy="0">训练过程概览</tspan></text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="48" dy="0">先预测并衡量误差，再把调整方向反馈给模型</tspan></text><rect x="50" y="125" width="145" height="88" rx="8" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.6"/><text x="122.5" y="156" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="122.5" dy="0">输入样本</tspan></text><text x="122.5" y="183" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="122.5" dy="0">图像与标签</tspan></text><rect x="235" y="125" width="145" height="88" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="307.5" y="156" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="307.5" dy="0">模型</tspan></text><text x="307.5" y="183" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="307.5" dy="0">可学习参数</tspan></text><rect x="420" y="125" width="145" height="88" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="492.5" y="156" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="492.5" dy="0">预测结果</tspan></text><text x="492.5" y="183" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="492.5" dy="0">前向传播</tspan></text><rect x="605" y="125" width="145" height="88" rx="8" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.6"/><text x="677.5" y="156" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="677.5" dy="0">预测误差</tspan></text><text x="677.5" y="183" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="677.5" dy="0">与标签比较</tspan></text><rect x="790" y="125" width="120" height="88" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="850" y="156" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="850" dy="0">调整方向</tspan></text><text x="850" y="183" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="850" dy="0">反向传播</tspan></text><path d="M195 169 L232 169" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><path d="M380 169 L417 169" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><path d="M565 169 L602 169" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><path d="M750 169 L787 169" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><path d="M850 216 L850 289 L308 289 L308 216" stroke="#b47936" stroke-width="2.4" fill="none" marker-end="url(#arrow-orange)"/><text x="579" y="278" fill="#b47936" font-size="16" font-weight="600" text-anchor="middle"><tspan x="579" dy="0">优化器更新权重，进入下一轮</tspan></text><text x="480" y="351" fill="#667f72" font-size="16" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">训练反复进行，预测误差逐步反馈到模型参数。</tspan></text></g></svg>
