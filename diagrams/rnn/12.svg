<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="负采样目标。拉近真实词对，推远少量噪声词对"><title>负采样目标</title><desc>拉近真实词对，推远少量噪声词对。注意负样本项中内积前的负号，以及 3/4 次幂对抽样分布的平滑。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">负采样目标</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">拉近真实词对，推远少量噪声词对</text><rect x="65" y="145" width="110" height="42" rx="5" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="120" y="171" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">banking</text><path d="M175 166 L300 120" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><text x="237.5" y="135" fill="#176653" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">真实词对</text><rect x="300" y="99" width="100" height="42" rx="5" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="350" y="125" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">crises</text><path d="M175 166 L300 212" fill="none" stroke="#b47936" stroke-width="2.1" marker-end="url(#arrow-amber)"/><text x="237.5" y="181" fill="#b47936" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">噪声词对</text><rect x="300" y="191" width="100" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="350" y="217" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">banana</text><path d="M175 166 L300 277" fill="none" stroke="#b47936" stroke-width="2.1" marker-end="url(#arrow-amber)"/><rect x="300" y="256" width="100" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="350" y="282" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">violin</text><rect x="520" y="104" width="370" height="180" rx="6" fill="#f6faf7" stroke="#a8c2b4" stroke-width="1.4"/><text x="705" y="187" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">二分类目标</text><text x="705" y="212" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">真实词对分数上升；噪声词对分数下降</text><text x="705" y="203" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, serif">−log σ(uₒᵀv꜀)</text><text x="705" y="240" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, serif">−Σ log σ(−uₖᵀv꜀)</text><rect x="110" y="324" width="740" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="355" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">负样本项中的 −uₖᵀv꜀ 决定“推远”方向。</text></g></svg>
