<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="门决定擦除、写入和读出多少"><title>门决定擦除、写入和读出多少</title><desc>门是向量，输出在 0 与 1 之间；不同维度可以采取不同保留比例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">门决定擦除、写入和读出多少</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">各分量随当前上下文动态计算</text><text x="80" y="137" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">f：保留多少旧记忆；i：写入多少候选内容；o：输出多少记忆</text><text x="80" y="184" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">每一道门都是向量，由 [hₜ₋₁;xₜ] 的当前上下文计算</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">σ(·) ∈ (0,1)；逐元素控制，而非整层的单一开关</text></g></svg>
