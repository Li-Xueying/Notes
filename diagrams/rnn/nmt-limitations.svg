<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="统一模型也有新的限制"><title>统一模型也有新的限制</title><desc>复杂翻译规则和安全约束仍需额外考虑。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">统一模型也有新的限制</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">解释、调试与显式控制较难</text><rect x="48" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="180" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">解释与调试</text><text x="180" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">错误较难定位</text><path d="M312 200 L332 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="336" y="154" width="264" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="468" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">显式控制</text><text x="468" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">规则不易指定</text><path d="M600 200 L620 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="756" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">可靠性</text><text x="756" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">仍需评估约束</text></g></svg>
