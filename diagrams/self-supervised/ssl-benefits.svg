<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">自动构造目标，扩大可用数据</title><desc id="desc">监督目标来自外部人工标签，自监督目标从数据生成。自动构造目标降低标签收集成本，使更大规模未标注数据可参与训练。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">自动构造目标，扩大可用数据</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="42" y="134" width="410" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="247" y="169" font-size="18" fill="#263f35" text-anchor="middle">监督学习</text><text x="247" y="195" font-size="14" fill="#5d7469" text-anchor="middle">图像 + 人工标签</text><path d="M452 175 L474 175" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="134" width="410" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="685" y="169" font-size="18" fill="#263f35" text-anchor="middle">目标误差</text><text x="685" y="195" font-size="14" fill="#5d7469" text-anchor="middle">更新模型</text><rect x="42" y="279" width="410" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="247" y="314" font-size="18" fill="#263f35" text-anchor="middle">自监督学习</text><text x="247" y="340" font-size="14" fill="#5d7469" text-anchor="middle">由数据构造目标</text><path d="M452 320 L474 320" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="279" width="410" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="685" y="314" font-size="18" fill="#263f35" text-anchor="middle">代理误差</text><text x="685" y="340" font-size="14" fill="#5d7469" text-anchor="middle">更新编码器</text></g></svg>
