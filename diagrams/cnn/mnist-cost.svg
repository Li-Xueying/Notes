<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="同一 MNIST 任务的参数量"><title>同一 MNIST 任务的参数量</title><desc>按输入通道、输出通道与偏置完整计算</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">同一 MNIST 任务的参数量</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">按输入通道、输出通道与偏置完整计算</text><rect x="60" y="111" width="390" height="186" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="255" y="197" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">全连接：784 → 128 → 10</text><text x="255" y="223" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">约 101.8k 参数</text><text x="255" y="247" fill="#b47936" font-size="16" font-weight="400" text-anchor="middle" font-family="sans-serif">(784+1)×128 + (128+1)×10</text><rect x="510" y="111" width="390" height="186" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="705" y="197" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">CNN：两个卷积阶段 + 分类头</text><text x="705" y="223" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">8490 参数，约 8.5k</text><text x="705" y="247" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="sans-serif">260 + 5020 + 3210</text><rect x="85" y="319" width="790" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="353" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">相同输入与输出；局部连接与共享权重减少参数。</text></g></svg>
