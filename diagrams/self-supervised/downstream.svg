<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">下游任务：复用编码器，换输出头</title><desc id="desc">下游任务（downstream task）是实际关心的应用。预训练后保留编码器，替换代理头，用目标数据训练类别、检测或分割输出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">下游任务：复用编码器，换输出头</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="42" y="160" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="174" y="195" font-size="18" fill="#263f35" text-anchor="middle">目标图像</text><text x="174" y="221" font-size="14" fill="#5d7469" text-anchor="middle">少量应用标签</text><path d="M306 201 L328 201" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="160" width="264" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="466" y="195" font-size="18" fill="#263f35" text-anchor="middle">已学编码器</text><text x="466" y="221" font-size="14" fill="#5d7469" text-anchor="middle">保留表征</text><path d="M598 201 L620 201" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="626" y="160" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="758" y="195" font-size="18" fill="#263f35" text-anchor="middle">新任务头</text><text x="758" y="221" font-size="14" fill="#5d7469" text-anchor="middle">类别 / 框 / 区域</text><rect x="42" y="362" width="876" height="48" rx="4" fill="#f5f9f6" stroke="#d7e5dc"/><text x="480" y="393" font-size="18" fill="#176653" text-anchor="middle">代理头被替换；编码器冻结或微调</text></g></svg>
