<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="BERT、T5 与 GPT"><title>BERT、T5 与 GPT</title><desc>编码器、编码器—解码器与仅解码器的对照 结构差异需要与可见上下文和训练目标一起理解。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="60" y="141" width="143" height="82" fill="#e9f3ee"/><text x="72" y="188" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="72" dy="0">模型</tspan></text><rect x="203" y="141" width="239" height="82" fill="#e9f3ee"/><text x="215" y="188" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="215" dy="0">结构</tspan></text><rect x="442" y="141" width="458" height="82" fill="#e9f3ee"/><text x="454" y="188" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="454" dy="0">可见信息 / 目标</tspan></text><rect x="60" y="223" width="143" height="82" fill="#f7faf8"/><text x="72" y="270" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="72" dy="0">BERT</tspan></text><rect x="203" y="223" width="239" height="82" fill="#f7faf8"/><text x="215" y="270" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="215" dy="0">仅编码器</tspan></text><rect x="442" y="223" width="458" height="82" fill="#f7faf8"/><text x="454" y="270" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="454" dy="0">双向上下文；掩码预测</tspan></text><rect x="60" y="305" width="143" height="82" fill="#ffffff"/><text x="72" y="352" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="72" dy="0">T5</tspan></text><rect x="203" y="305" width="239" height="82" fill="#ffffff"/><text x="215" y="352" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="215" dy="0">编码器—解码器</tspan></text><rect x="442" y="305" width="458" height="82" fill="#ffffff"/><text x="454" y="352" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="454" dy="0">源序列编码；生成目标</