<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="一个完整 CNN 如何分类"><title>一个完整 CNN 如何分类</title><desc>空间尺寸降低，通道与语义层级逐步提升</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">一个完整 CNN 如何分类</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">空间尺寸降低，通道与语义层级逐步提升</text><rect x="40" y="135" width="166.4" height="108" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="123.2" y="182" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">图像</text><text x="123.2" y="208" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">H×W×3</text><path d="M206.4 189 L215.4 189" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="218.4" y="135" width="166.4" height="108" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="301.6" y="182" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">卷积块 1</text><text x="301.6" y="208" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">边缘 / 颜色</text><path d="M384.8 189 L393.8 189" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="396.8" y="135" width="166.4" height="108" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="480" y="182" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">卷积块 2</text><text x="480" y="208" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">纹理 / 形状</text><path d="M563.2 189 L572.2 189" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="575.2" y="135" width="166.4" height="108" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="658.4000000000001" y="182" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">深层特征</text><text x="658.4000000000001" y="208" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">部件 / 类别</text><path d="M741.6 189 L750.6 189" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="753.6" y="135" width="166.4" height="108" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="836.8000000000001" y="182" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">分类头</text><text x="836.8000000000001" y="208" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">logits</text><rect x="110" y="299" width="740" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="333" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">image → [conv → activation → downsample]ᴸ → classifier</text></g></svg>
