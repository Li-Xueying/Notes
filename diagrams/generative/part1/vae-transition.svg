<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">从显式条件乘积转向潜变量</title><desc id="desc">PixelRNN、PixelCNN 一类自回归模型直接给出条件概率乘积。VAE 用未观测潜变量构造生成模型，边缘似然通常难以精确求值，因此转而优化可计算的对数似然下界。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">从显式条件乘积转向潜变量</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="57" y="135" width="394" height="112" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="254" y="165" font-size="18" fill="#283b34" text-anchor="middle">自回归</text><text x="254" y="190" font-size="14" fill="#63766c" text-anchor="middle">直接分解 pθ(x)</text><text x="254" y="213" font-size="14" fill="#63766c" text-anchor="middle">条件概率可求值</text><rect x="508" y="135" width="394" height="112" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="705" y="165" font-size="18" fill="#283b34" text-anchor="middle">潜变量模型</text><text x="705" y="190" font-size="14" fill="#63766c" text-anchor="middle">对 z 边缘化</text><text x="705" y="213" font-size="14" fill="#63766c" text-anchor="middle">似然通常难精确求值</text><path d="M455 190 L504 190" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="405" font-size="17" fill="#63766c" text-anchor="middle">从表征与重建出发，逐步建立可采样的潜变量模型</text></g></svg>
