<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">联合最大化证据下界</title><desc id="desc">证据下界（Evidence Lower Bound，ELBO）是观测数据对数似然的可训练下界。编码器与解码器通过同一个目标共同学习。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">联合最大化证据下界</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="86" y="124" width="786" height="93" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="479" y="154" font-size="18" fill="#283b34" text-anchor="middle">ELBO = 期望重建对数似然 − 先验 KL</text><text x="479" y="179" font-size="14" fill="#63766c" text-anchor="middle">最大化：同时训练编码器 φ 与解码器 θ</text><path d="M480 222 L480 277" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="173" y="283" width="614" height="76" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="313" font-size="18" fill="#283b34" text-anchor="middle">log pθ(x) ≥ ELBO</text><text x="480" y="338" font-size="14" fill="#63766c" text-anchor="middle">真实后验 KL 构成非负差距</text></g></svg>
