<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">自监督学习：由数据产生训练信号</title><desc id="desc">自监督学习（Self-supervised Learning，SSL）利用数据自身的结构、变换或不同视图构造目标，学习可复用的表征（representation）。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">自监督学习：由数据产生训练信号</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="42" y="170" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="174" y="205" font-size="18" fill="#263f35" text-anchor="middle">动机与评估</text><text x="174" y="231" font-size="14" fill="#5d7469" text-anchor="middle">标注、表征与迁移</text><path d="M306 211 L328 211" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="170" width="264" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="466" y="205" font-size="18" fill="#263f35" text-anchor="middle">传统代理任务</text><text x="466" y="231" font-size="14" fill="#5d7469" text-anchor="middle">空间、变换与重建</text><path d="M598 211 L620 211" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="626" y="170" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="758" y="205" font-size="18" fill="#263f35" text-anchor="middle">现代方法</text><text x="758" y="231" font-size="14" fill="#5d7469" text-anchor="middle">对比、队列与蒸馏</text><rect x="42" y="362" width="876" height="48" rx="4" fill="#f5f9f6" stroke="#d7e5dc"/><text x="480" y="393" font-size="18" fill="#176653" text-anchor="middle">先看目标从哪里来，再看表征是否有用</text></g></svg>
