<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="语言模型。用链式法则分解整段序列概率"><title>语言模型</title><desc>用链式法则分解整段序列概率。每个时间步根据已经出现的前缀预测下一个词。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">语言模型</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">用链式法则分解整段序列概率</text><rect x="92" y="126" width="80" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="132" y="152" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">x₁</text><rect x="237" y="126" width="80" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="277" y="152" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">x₂</text><rect x="382" y="126" width="80" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="422" y="152" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">x₃</text><rect x="527" y="126" width="80" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="567" y="152" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">…</text><rect x="672" y="126" width="80" height="42" rx="5" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="712" y="152" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">xₜ</text><rect x="72" y="220" width="145" height="32" rx="16" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="144.5" y="241" fill="#176653" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">P(x₁)</text><rect x="238" y="220" width="145" height="32" rx="16" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="310.5" y="241" fill="#176653" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">P(x₂|x₁)</text><rect x="404" y="220" width="145" height="32" rx="16" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="476.5" y="241" fill="#176653" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">P(x₃|x≤2)</text><rect x="570" y="220" width="145" height="32" rx="16" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="642.5" y="241" fill="#176653" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">…</text><rect x="736" y="220" width="145" height="32" rx="16" fill="#176653" stroke="#176653" stroke-width="1.4"/><text x="808.5" y="241" fill="#ffffff" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">P(xₜ|x&lt;t)</text><rect x="140" y="315" width="680" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="346" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">P(x₁,…,x_T) = Π_t P(x_t | x₁,…,x_(t−1))</text></g></svg>
