<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">数据预测、噪声预测与 VP v 预测</title><desc id="desc">x-prediction 直接回归干净数据；ε-prediction 回归标准噪声 z。对于 a²+b²=1 的 VP 路径，常用 v=a z−b x，将数据和噪声旋转组合。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">数据预测、噪声预测与 VP v 预测</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">x 预测</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">干净数据</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">ε 预测</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">标准高斯噪声 z</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">VP v 预测</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">a z−b x</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">相同输入可配不同目标；先声明路径和时间约定</text></g></svg>
