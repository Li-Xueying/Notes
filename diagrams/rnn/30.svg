<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="从 SMT 到 NMT。分立概率模块走向端到端条件模型"><title>从 SMT 到 NMT</title><desc>分立概率模块走向端到端条件模型。统计机器翻译的忠实度、流畅度和搜索背景解释了神经序列模型要同时解决的问题。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">从 SMT 到 NMT</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">分立概率模块走向端到端条件模型</text><path d="M80 208 L880 208" fill="none" stroke="#a8c2b4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="110" cy="208" r="10" fill="#ffffff" stroke="#a8c2b4" stroke-width="2"/><text x="110" y="168" fill="#667f72" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">1950s</text><text x="110" y="245" fill="#263f35" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">规则 + 双语词典</text><circle cx="360" cy="208" r="10" fill="#ffffff" stroke="#a8c2b4" stroke-width="2"/><text x="360" y="168" fill="#667f72" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">1990s–2010s</text><text x="360" y="245" fill="#263f35" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">SMT 概率模块</text><circle cx="620" cy="208" r="10" fill="#e9f3ee" stroke="#176653" stroke-width="2"/><text x="620" y="168" fill="#176653" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">2014</text><text x="620" y="245" fill="#263f35" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">Seq2Seq</text><circle cx="830" cy="208" r="10" fill="#e9f3ee" stroke="#176653" stroke-width="2"/><text x="830" y="168" fill="#176653" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">2016</text><text x="830" y="245" fill="#263f35" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">NMT 大规模采用</text><rect x="120" y="315" width="720" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="346" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">分立翻译模型 + 语言模型 → 端到端 P(y|x)</text></g></svg>
