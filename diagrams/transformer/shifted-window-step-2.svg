<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="移位后，原窗口的 token 能相遇"><title>移位后，原窗口的 token 能相遇</title><desc>数字是区域编号，每格才是一个 token；同区域可互读。查询区域 8 时，绕回的 6、2、0 必须遮挡。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">移位后，原窗口的 token 能相遇</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">循环移位 → 分组 → 遮罩 → 逆移位</text><text x="218" y="110" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">移位后的区域编号</text><text x="218" y="130" font-size="13" fill="#667f72" text-anchor="middle" font-weight="400">每格一个 token；粗线为 2×2 计算窗口</text><rect x="108" y="148" width="54" height="42" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="135" y="176" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">4</text><rect x="163" y="148" width="54" height="42" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="190" y="176" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">4</text><rect x="218" y="148" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="245" y="176" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">5</text><rect x="273" y="148" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="300" y="176" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">3</text><rect x="108" y="191" width="54" height="42" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="135" y="219" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">4</text><rect x="163" y="191" width="54" height="42" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="190" y="219" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">4</text><rect x="218" y="191" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="245" y="219" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">5</text><rect x="273" y="191" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="300" y="219" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">3</text><rect x="108" y="234" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="135" y="262" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">7</text><rect x="163" y="234" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="190" y="262" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">7</text><rect x="218" y="234" width="54" height="42" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="245" y="262" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">8</text><rect x="273" y="234" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="300" y="262" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">6</text><rect x="108" y="277" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="135" y="305" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">1</text><rect x="163" y="277" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="190" y="305" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">1</text><rect x="218" y="277" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="245" y="305" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">2</text><rect x="273" y="277" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="300" y="305" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">0</text><path d="M108 148 H328 V320 H108 Z M218 148 V320 M108 234 H328" fill="none" stroke="#547a8a" stroke-width="2.5"/><path d="M361 222 L473 222" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="696" y="112" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">右下计算窗口的区域编号</text><rect x="496" y="146" width="96" height="48" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="544" y="176" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">K：8</text><rect x="600" y="146" width="96" height="48" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="648" y="176" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">K：6</text><rect x="704" y="146" width="96" height="48" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="752" y="176" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">K：2</text><rect x="808" y="146" width="96" height="48" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="856" y="176" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">K：0</text><rect x="502" y="224" width="116" height="61" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="560" y="260.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Q：8</text><path d="M619 254 L669 254" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="671" y="223" width="242" height="64" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="792" y="248" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">加遮罩</text><text x="792" y="276" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">[0, −∞, −∞, −∞]</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">区域 4 的四个 token 可互读；右下窗口的四个区域彼此屏蔽</text></g></svg>
