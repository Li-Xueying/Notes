<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="从似然到损失。提高所有真实上下文词的条件概率"><title>从似然到损失</title><desc>提高所有真实上下文词的条件概率。概率乘积转为平均负对数似然后，优化变成可加的损失。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">从似然到损失</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">提高所有真实上下文词的条件概率</text><rect x="50" y="127" width="204.5" height="94" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="152.25" y="167" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">语料位置 t</text><text x="152.25" y="192" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">中心词 w_t</text><path d="M254.5 174 L265.5 174" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="268.5" y="127" width="204.5" height="94" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="370.75" y="167" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">窗口偏移 j</text><text x="370.75" y="192" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">上下文 w_(t+j)</text><path d="M473 174 L484 174" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="487" y="127" width="204.5" height="94" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="589.25" y="167" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">条件概率</text><text x="589.25" y="192" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">P(w_(t+j)|w_t)</text><path d="M691.5 174 L702.5 174" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="705.5" y="127" width="204.5" height="94" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="807.75" y="167" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">负对数</text><text x="807.75" y="192" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">可加损失</text><rect x="55" y="310" width="850" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="341" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">J(θ) = −(1/T) Σ_t Σ_(−m≤j≤m,j≠0) log P(w_(t+j)|w_t;θ)</text></g></svg>
