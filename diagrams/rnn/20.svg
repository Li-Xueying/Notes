<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="时间反向传播。共享参数的梯度来自所有时间步"><title>时间反向传播</title><desc>共享参数的梯度来自所有时间步。展开图中的多个单元复用同一组参数，最终梯度必须求和。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">时间反向传播</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">共享参数的梯度来自所有时间步</text><rect x="90" y="154" width="118" height="74" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="149" y="184" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">h_1</text><text x="149" y="209" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">W_h</text><path d="M208 191 L295 191" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="295" y="154" width="118" height="74" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="354" y="184" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">h_2</text><text x="354" y="209" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">W_h</text><path d="M413 191 L500 191" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="500" y="154" width="118" height="74" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="559" y="184" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">h_3</text><text x="559" y="209" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">W_h</text><path d="M618 191 L705 191" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="705" y="154" width="118" height="74" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="764" y="184" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">h_4</text><text x="764" y="209" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">W_h</text><path d="M802 246 C710 319 405 319 145 246" fill="none" stroke="#b47936" stroke-width="3" marker-end="url(#arrow-amber)"/><text x="480" y="300" fill="#b47936" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">反向：t → … → 1</text><path d="M125 110 L790 110" fill="none" stroke="#176653" stroke-width="2" stroke-dasharray="5 5"/><text x="458" y="101" fill="#176653" font-size="13" font-weight="650" text-anchor="middle" font-family="sans-serif">同一 W_h 被使用 4 次</text><rect x="190" y="325" width="580" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="356" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">∂L/∂W_h = Σ_t (∂L/∂W_h)|_t</text></g></svg>
