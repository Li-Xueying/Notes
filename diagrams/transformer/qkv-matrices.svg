<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="把所有投影写成矩阵"><title>把所有投影写成矩阵</title><desc>统一采用每个位置占一行的记法，投影参数在各位置共享。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">把所有投影写成矩阵</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">X → Q、K、V</text><rect x="65" y="184" width="195" height="76" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="162.5" y="215" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">X</text><text x="162.5" y="243" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">N × D</text><path d="M260 222 L446 121" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="448" y="88" width="370" height="66" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="633" y="114" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Q = XWQ</text><text x="633" y="142" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">N × dₖ</text><path d="M260 222 L446 221" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="448" y="188" width="370" height="66" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="633" y="214" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">K = XWK</text><text x="633" y="242" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">N × dₖ</text><path d="M260 222 L446 321" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="448" y="288" width="370" height="66" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="633" y="314" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">V = XWV</text><text x="633" y="342" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">N × dᵥ</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">WQ / WK：D × dₖ；WV：D × dᵥ</text></g></svg>
