<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="1976–1982 · 第一次低谷"><title>1976–1982 · 第一次低谷</title><desc>计算能力、计算复杂度和工程实现难度共同限制了早期神经网络。</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.7"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.7"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start"><tspan x="48" dy="0">1976–1982 · 第一次低谷</tspan></text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="48" dy="0">能力设想与现实条件之间仍有明显落差</tspan></text>
  <rect x="90" y="112" width="220" height="124" rx="8" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.6"/><text x="200" y="143" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="200" dy="0">计算能力不足</tspan></text><text x="200" y="170" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="200" dy="0">硬件规模有限</tspan><tspan x="200" dy="20">训练耗时过长</tspan></text>
  <rect x="370" y="112" width="220" height="124" rx="8" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.6"/><text x="480" y="143" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="480" dy="0">计算复杂度高</tspan></text><text x="480" y="170" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">多层模型难训练</tspan><tspan x="480" dy="20">方法尚不成熟</tspan></text>
  <rect x="650" y="112" width="220" height="124" rx="8" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.6"/><text x="760" y="143" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="760" dy="0">实现难度大</tspan></text><text x="760" y="170" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="760" dy="0">数据和工具有限</tspan><tspan x="760" dy="20">效果未达预期</tspan></text>
  <text x="480" y="280" fill="#667f72" font-size="15" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">研究投入与关注下降，神经网络进入第一次低谷。</tspan></text><text x="240" y="316" fill="#b47936" font-size="12" font-weight="650" text-anchor="middle"><tspan x="240" dy="0">第一次低谷</tspan></text><path d="M42 340 H930" stroke="#a8c2b4" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/><circle cx="50" cy="340" r="5" fill="#176653" stroke="#176653" stroke-width="2"/><text x="50" y="369" fill="#667f72" font-size="10" font-weight="400" text-anchor="middle"><tspan x="50" dy="0">1943</tspan></text><circle cx="145" cy="340" r="5" fill="#176653" stroke="#176653" stroke-width="2"/><text x="145" y="369" fill="#667f72" font-size="10" font-weight="400" text-anchor="middle"><tspan x="145" dy="0">1958–69</tspan></text><circle cx="240" cy="340" r="8" fill="#b47936" stroke="#b47936" stroke-width="2"/><text x="240" y="369" fill="#b47936" font-size="10" font-weight="650" text-anchor="middle"><tspan x="240" dy="0">1976–82</tspan></text><circle cx="335" cy="340" r="5" fill="#ffffff" stroke="#176653" stroke-width="2"/><text x="335" y="369" fill="#667f72" font-size="10" font-weight="400" text-anchor="middle"><tspan x="335" dy="0">1986</tspan></text><circle cx="430" cy="340" r="5" fill="#ffffff" stroke="#176653" stroke-width="2"/><text x="430" y="369" fill="#667f72" font-size="10" font-weight="400" text-anchor="middle"><tspan x="430" dy="0">1990s</tspan></text><circle cx="525" cy="340" r="5" fill="#ffffff" stroke="#176653" stroke-width="2"/><text x="525" y="369" fill="#667f72" font-size="10" font-weight="400" text-anchor="middle"><tspan x="525" dy="0">2006</tspan></text><circle cx="620" cy="340" r="5" fill="#ffffff" stroke="#176653" stroke-width="2"/><text x="620" y="369" fill="#667f72" font-size="10" font-weight="400" text-anchor="middle"><tspan x="620" dy="0">2012</tspan></text><circle cx="715" cy="340" r="5" fill="#ffffff" stroke="#176653" stroke-width="2"/><text x="715" y="369" fill="#667f72" font-size="10" font-weight="400" text-anchor="middle"><tspan x="715" dy="0">2014–18</tspan></text><circle cx="810" cy="340" r="5" fill="#ffffff" stroke="#176653" stroke-width="2"/><text x="810" y="369" fill="#667f72" font-size="10" font-weight="400" text-anchor="middle"><tspan x="810" dy="0">2019–24</tspan></text><circle cx="905" cy="340" r="5" fill="#ffffff" stroke="#176653" stroke-width="2"/><text x="905" y="369" fill="#667f72" font-size="10" font-weight="400" text-anchor="middle"><tspan x="905" dy="0">未来</tspan></text></g></svg>
