<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="把注意力子层补成完整块"><title>把注意力子层补成完整块</title><desc>两个子层分别有残差和归一化；LayerNorm 对当前向量的特征统计，并有可学习缩放与偏移。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">把注意力子层补成完整块</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">Self-attention → Add &amp; Norm → FFN → Add &amp; Norm</text><rect x="46" y="169" width="149.6" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="120.8" y="208" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">X</text><text x="120.8" y="236" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">输入</text><path d="M195.6 215 L215.6 215" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="219.6" y="169" width="149.6" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="294.4" y="208" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">自注意力</text><text x="294.4" y="236" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">位置间交换</text><path d="M369.2 215 L389.2 215" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="393.2" y="169" width="149.6" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="468" y="208" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Add &amp; Norm</text><text x="468" y="236" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">得到 U</text><path d="M542.8 215 L562.8 215" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="566.8" y="169" width="149.6" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="641.5999999999999" y="208" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">FFN</text><text x="641.5999999999999" y="236" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">逐位置变换</text><path d="M716.4 215 L736.4 215" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="740.4" y="169" width="149.6" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="815.1999999999999" y="208" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Add &amp; Norm</text><text x="815.1999999999999" y="236" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">输出 H</text><path d="M121 169 V126 H468 V169" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="294" y="113" font-size="16" fill="#176653" text-anchor="middle" font-weight="400">保留 X</text><path d="M468 261 V309 H815 V261" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="642" y="333" font-size="16" fill="#176653" text-anchor="middle" font-weight="400">保留 U</text><rect x="46" y="356" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="387" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">U = LN(X + SelfAttn(X))；H = LN(U + FFN(U))</text></g></svg>
