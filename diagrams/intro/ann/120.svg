<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="初始化与信号尺度"><title>初始化与信号尺度</title><desc>过小或过大的初始尺度会随层数累积 随机化打破神经元对称性；方差控制帮助稳定前向与反向信号。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="190" y="131" fill="#263f35" font-size="20" font-weight="400" text-anchor="middle"><tspan x="190" dy="0">尺度过小</tspan></text><rect x="95" y="284" width="32" height="70" rx="3" fill="#b47936"/><text x="111" y="379" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="111" dy="0">L1</tspan></text><rect x="148" y="317.6" width="32" height="36.4" rx="3" fill="#b47936"/><text x="164" y="379" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="164" dy="0">L2</tspan></text><rect x="201" y="335.072" width="32" height="18.928" rx="3" fill="#b47936"/><text x="217" y="379" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="217" dy="0">L3</tspan></text><rect x="254" y="344.15744" width="32" height="9.84256" rx="3" fill="#b47936"/><text x="270" y="379" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="270" dy="0">L4</tspan></text><path d="M85 354 L317 354" stroke="#a8c2b4" stroke-width="2" fill="none"/><text x="500" y="131" fill="#263f35" font-size="20" font-weight="400" text-anchor="middle"><tspan x="500" dy="0">尺度合适</tspan></text><rect x="405" y="289" width="32" height="65" rx="3" fill="#176653"/><text x="421" y="379" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="421" dy="0">L1</tspan></text><rect x="458" y="289" width="32" height="65" rx="3" fill="#176653"/><text x="474" y="379" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="474" dy="0">L2</tspan></text><rect x="511" y="289" width="32" height="65" rx="3" fill="#176653"/><text x="527" y="379" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="527" dy="0">L3</tspan></text><rect x="564" y="289" width="32" height="65" rx="3" fill="#176653"/><text x="580" y="379" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="580" dy="0">L4</tspan></text><path d="M395 354 L627 354" stroke="#a8c2b4" stroke-width="2" fill="none"/><text x="810" y="131" fill="#263f35" font-size="20" font-weight="400" text-anchor="middle"><tspan x="810" dy="0">尺度过大</tspan></text><rect x="715" y="324" width="32" height="30" rx="3" fill="#b47936"/><text x="731" y="379" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="731" dy="0">L1</tspan></text><rect x="768" y="307.5" width="32" height="46.5" rx="3" fill="#b47936"/><text x="784" y="379" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="784" dy="0">L2</tspan></text><rect x="821" y="281.925" width="32" height="72.075" rx="3" fill="#b47936"/><text x="837" y="379" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="837" dy="0">L3</tspan></text><rect x="874" y="242.28375" width="32" height="111.71625000000002" rx="3" fill="#b47936"/><text x="890" y="379" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="890" dy="0">L4</tspan></text><path d="M705 354 L937 354" stroke="#a8c2b4" stroke-width="2" fill="none"/><text x="480" y="441" fill="#667f72" font-size="18" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">层间数值尺度的示意；不是实际训练测量</tspan></text></g></svg>