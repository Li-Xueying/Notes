  <rect x="355" y="112" width="250" height="128" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="480" y="143" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="480" dy="0">计算能力提升</tspan></text><text x="480" y="170" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">更强硬件</tspan><tspan x="480" dy="20">更大训练规模</tspan></text>
