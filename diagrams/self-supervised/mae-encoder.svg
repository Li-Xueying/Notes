<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">大编码器只处理可见块</title><desc id="desc">可见块展平、线性投影并加入原位置编码，形成约 N/4 个 token 的序列进入编码器；编码器不接收 mask token。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">大编码器只处理可见块</text><path d="M42 63 H918" stroke="#d7e5dc"/><text x="150" y="112" font-size="16" fill="#263f35" text-anchor="middle">原始位置：4×4 结构示例</text><rect x="42" y="130" width="47" height="40" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="65" y="157" font-size="17" fill="#426f91" text-anchor="middle">1</text><rect x="94" y="130" width="47" height="40" rx="4" fill="#f0f0ef" stroke="#a8c2b4"/><text x="117" y="157" font-size="17" fill="#5d7469" text-anchor="middle">×</text><rect x="146" y="130" width="47" height="40" rx="4" fill="#f0f0ef" stroke="#a8c2b4"/><text x="169" y="157" font-size="17" fill="#5d7469" text-anchor="middle">×</text><rect x="198" y="130" width="47" height="40" rx="4" fill="#f0f0ef" stroke="#a8c2b4"/><text x="221" y="157" font-size="17" fill="#5d7469" text-anchor="middle">×</text><rect x="42" y="175" width="47" height="40" rx="4" fill="#f0f0ef" stroke="#a8c2b4"/><text x="65" y="202" font-size="17" fill="#5d7469" text-anchor="middle">×</text><rect x="94" y="175" width="47" height="40" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="117" y="202" font-size="17" fill="#426f91" text-anchor="middle">6</text><rect x="146" y="175" width="47" height="40" rx="4" fill="#f0f0ef" stroke="#a8c2b4"/><text x="169" y="202" font-size="17" fill="#5d7469" text-anchor="middle">×</text><rect x="198" y="175" width="47" height="40" rx="4" fill="#f0f0ef" stroke="#a8c2b4"/