<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="加入噪声，再保留 Top-k 分数"><title>加入噪声，再保留 Top-k 分数</title><desc>固定一次示例噪声以便核算；实际噪声用于探索，未选 logits 设为负无穷。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">加入噪声，再保留 Top-k 分数</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">未选项置为 −∞，Softmax 后权重为 0</text><text x="72" y="141" font-size="16" fill="#263f35" text-anchor="start" font-weight="400">加噪后分数</text><rect x="243" y="109" width="155.5" height="52" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="320.75" y="141" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">2.5</text><rect x="410.5" y="109" width="155.5" height="52" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="488.25" y="141" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">1.4</text><rect x="578" y="109" width="155.5" height="52" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="655.75" y="141" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">0.5</text><rect x="745.5" y="109" width="155.5" height="52" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="823.25" y="141" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">-0.4</text><text x="72" y="219" font-size="16" fill="#263f35" text-anchor="start" font-weight="400">KeepTop2</text><rect x="243" y="187" width="155.5" height="52" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="320.75" y="219" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">2.5</text><rect x="410.5" y="187" width="155.5" height="52" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="488.25" y="219" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">1.4</text><rect x="578" y="187" width="155.5" height="52" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="655.75" y="219" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">−∞</text><rect x="745.5" y="187" width="155.5" height="52" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="823.25" y="219" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">−∞</text></g></svg>
