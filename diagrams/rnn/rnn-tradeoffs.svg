<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="RNN 的优势与限制"><title>RNN 的优势与限制</title><desc>能够利用任意长度前缀，不等于可靠保存所有历史信息；时间步之间还有计算依赖。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">RNN 的优势与限制</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">变长与共享；串行与长期遗忘</text><text x="80" y="137" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">优势：输入可变长；同一规则处理各位置；参数量不随长度增加</text><text x="80" y="184" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">限制：计算沿时间串行；早期信息可能在多次更新中丢失</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">可访问任意长度的历史 ≠ 能可靠保存全部历史</text></g></svg>
