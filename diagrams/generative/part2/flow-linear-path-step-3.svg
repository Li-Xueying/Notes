<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">沿直线构造 xₜ，导数给出目标速度</title><desc id="desc">t=0.75，xₜ=(-0.25, 1.25)；目标速度始终为 (−3, 3)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">沿直线构造 xₜ，导数给出目标速度</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="117" width="396" height="95" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="240" y="146" font-size="18" fill="#283b34" text-anchor="middle">固定数据 x=(2,−1)</text><text x="240" y="171" font-size="14" fill="#63766c" text-anchor="middle">固定噪声 z=(−1,2)</text><rect x="42" y="242" width="396" height="96" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="240" y="271" font-size="18" fill="#283b34" text-anchor="middle">t=0.75，xₜ=(-0.25, 1.25)</text><text x="240" y="296" font-size="14" fill="#63766c" text-anchor="middle">v=z−x=(−3,3)</text><path d="M800 315 L575 120" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><circle cx="800" cy="315" r="7" fill="#ab4d42"/><circle cx="575" cy="120" r="7" fill="#306b87"/><circle cx="631.25" cy="168.75" r="10" fill="#2f7253"/><text x="800" y="346" font-size="16" fill="#ab4d42" text-anchor="middle">x：数据端点</text><text x="575" y="95" font-size="16" fill="#306b87" text-anchor="middle">z：噪声端点</text><text x="657.25" y="175.75" font-size="17" fill="#2f7253" text-anchor="middle">xₜ</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">绿色箭头：时间增加方向；生成时沿负时间方向移动</text></g></svg>
