<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">转换目标时检查系数与端点</title><desc id="desc">VP 组合满足 xt=a x+b z、v=−b x+a z，因此可反解 x=a xt−b v、z=b xt+a v。若只预测噪声，则恢复 x 需要除以 a，a=0 的端点不可直接使用该除法。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">转换目标时检查系数与端点</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="64" y="130" width="386" height="117" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="257" y="159" font-size="18" fill="#283b34" text-anchor="middle">已知状态与 VP v</text><text x="257" y="184" font-size="14" fill="#63766c" text-anchor="middle">xₜ=a x+b z</text><text x="257" y="206" font-size="14" fill="#63766c" text-anchor="middle">v=−b x+a z</text><path d="M455 188 L508 188" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="513" y="130" width="385" height="117" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="705.5" y="159" font-size="18" fill="#283b34" text-anchor="middle">反解数据与噪声</text><text x="705.5" y="184" font-size="14" fill="#63766c" text-anchor="middle">x=a xₜ−b v</text><text x="705.5" y="206" font-size="14" fill="#63766c" text-anchor="middle">z=b xₜ+a v</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">a²+b²=1；RF 的 z−x 不直接代入这组旋转公式</text></g></svg>
