<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">贝叶斯公式连接三类分布</title><desc id="desc">同一个联合分布可以写为 p(x,y)=p(y|x)p(x)，也可以写为 p(x|y)p(y)。因此，当标签先验为正时，可以把条件生成分布写成其他三项的组合。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">贝叶斯公式连接三类分布</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="342" y="99" width="275" height="67" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="479.5" y="129" font-size="18" fill="#283b34" text-anchor="middle">联合分布 p(x,y)</text><text x="479.5" y="154" font-size="14" fill="#63766c" text-anchor="middle">同一个数据与标签空间</text><path d="M343 134 H207 V221" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><path d="M619 134 H757 V221" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="63" y="226" width="287" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="206.5" y="256" font-size="18" fill="#283b34" text-anchor="middle">p(y|x) × p(x)</text><text x="206.5" y="281" font-size="14" fill="#63766c" text-anchor="middle">判别项 × 数据分布</text><rect x="612" y="226" width="287" height="90" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="755.5" y="256" font-size="18" fill="#283b34" text-anchor="middle">p(x|y) × p(y)</text><text x="755.5" y="281" font-size="14" fill="#63766c" text-anchor="middle">条件生成 × 标签先验</text><text x="480" y="280" font-size="29" fill="#283b34" text-anchor="middle">=</text><text x="480" y="405" font-size="17" fill="#63766c" text-anchor="middle">由同一个联合分布的两种分解得到贝叶斯联系</text></g></svg>
