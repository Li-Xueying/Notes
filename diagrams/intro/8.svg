<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="不同领域对应不同任务"><title>不同领域对应不同任务</title><desc>四类人工智能应用分别接收领域数据，学习特定映射，并输出结构、环境、动作或文本结果。</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.7"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.7"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start"><tspan x="48" dy="0">从应用名称落到具体任务</tspan></text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="48" dy="0">先明确输入和输出，才能选择数据、模型与评价方法</tspan></text>
  <text x="75" y="111" fill="#667f72" font-size="14" font-weight="600" text-anchor="start"><tspan x="75" dy="0">领域</tspan></text><text x="255" y="111" fill="#667f72" font-size="14" font-weight="600" text-anchor="start"><tspan x="255" dy="0">输入</tspan></text><text x="505" y="111" fill="#667f72" font-size="14" font-weight="600" text-anchor="start"><tspan x="505" dy="0">核心任务</tspan></text><text x="770" y="111" fill="#667f72" font-size="14" font-weight="600" text-anchor="start"><tspan x="770" dy="0">输出</tspan></text>
  <rect x="50" y="139" width="860" height="49" rx="5" fill="#e9f3ee" stroke="#a8c2b4"/><text x="75" y="169" fill="#263f35" font-size="15" font-weight="600" text-anchor="start"><tspan x="75" dy="0">生物制药</tspan></text><text x="255" y="169" fill="#667f72" font-size="14" font-weight="400" text-anchor="start"><tspan x="255" dy="0">序列与分子信息</tspan></text><text x="505" y="169" fill="#176653" font-size="14" font-weight="600" text-anchor="start"><tspan x="505" dy="0">结构预测</tspan></text><text x="770" y="169" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="770" dy="0">三维结构或候选评分</tspan></text><rect x="50" y="200" width="860" height="49" rx="5" fill="#ffffff" stroke="#a8c2b4"/><text x="75" y="230" fill="#263f35" font-size="15" font-weight="600" text-anchor="start"><tspan x="75" dy="0">自动驾驶</tspan></text><text x="255" y="230" fill="#667f72" font-size="14" font-weight="400" text-anchor="start"><tspan x="255" dy="0">摄像头与雷达数据</tspan></text><text x="505" y="230" fill="#176653" font-size="14" font-weight="600" text-anchor="start"><tspan x="505" dy="0">检测、分割与规划</tspan></text><text x="770" y="230" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="770" dy="0">环境表示或行驶动作</tspan></text><rect x="50" y="261" width="860" height="49" rx="5" fill="#e9f3ee" stroke="#a8c2b4"/><text x="75" y="291" fill="#263f35" font-size="15" font-weight="600" text-anchor="start"><tspan x="75" dy="0">人形机器人</tspan></text><text x="255" y="291" fill="#667f72" font-size="14" font-weight="400" text-anchor="start"><tspan x="255" dy="0">传感器与关节状态</tspan></text><text x="505" y="291" fill="#176653" font-size="14" font-weight="600" text-anchor="start"><tspan x="505" dy="0">状态估计与控制</tspan></text><text x="770" y="291" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="770" dy="0">稳定姿态或运动指令</tspan></text><rect x="50" y="322" width="860" height="49" rx="5" fill="#ffffff" stroke="#a8c2b4"/><text x="75" y="352" fill="#263f35" font-size="15" font-weight="600" text-anchor="start"><tspan x="75" dy="0">大语言模型</tspan></text><text x="255" y="352" fill="#667f72" font-size="14" font-weight="400" text-anchor="start"><tspan x="255" dy="0">文本与对话上下文</tspan></text><text x="505" y="352" fill="#176653" font-size="14" font-weight="600" text-anchor="start"><tspan x="505" dy="0">语言建模</tspan></text><text x="770" y="352" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="770" dy="0">回答、摘要或代码</tspan></text></g></svg>
