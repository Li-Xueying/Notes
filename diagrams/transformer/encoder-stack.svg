<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="逐层叠加编码器块"><title>逐层叠加编码器块</title><desc>自注意力连接各位置，FFN 对每个位置应用同一变换；不同块通常具有各自参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">逐层叠加编码器块</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">每层先交换信息，再逐位置变换</text><rect x="222" y="282" width="516" height="59" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="480" y="304.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Block 1</text><text x="480" y="332.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">Self-attention + 逐位置 FFN</text><path d="M480 282 L480 261" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="222" y="202" width="516" height="59" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="480" y="237.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Block 2</text><path d="M480 202 L480 181" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="222" y="122" width="516" height="59" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="480" y="157.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Block 3</text><text x="480" y="384" font-size="17" fill="#263f35" text-anchor="middle" font-weight="400">x₁…xₙ</text><path d="M480 367 L480 341" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="97" font-size="17" fill="#263f35" text-anchor="middle" font-weight="400">h₁…hₙ</text></g></svg>
