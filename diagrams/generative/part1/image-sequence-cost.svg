<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">高分辨率使生成路径很长</title><desc id="desc">逐子像素生成一幅 1024×1024 的 RGB 图像，需要 1024×1024×3=3,145,728 次顺序决策。问题来自很长的生成路径；训练与生成的并行能力也不同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">高分辨率使生成路径很长</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="54" y="132" width="384" height="96" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="246" y="162" font-size="18" fill="#283b34" text-anchor="middle">1024×1024×3</text><text x="246" y="187" font-size="14" fill="#63766c" text-anchor="middle">3,145,728 个子像素</text><path d="M443 180 L512 180" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="517" y="132" width="390" height="96" rx="4" fill="#f9e7e3" stroke="#ccdbd2"/><text x="712" y="162" font-size="18" fill="#283b34" text-anchor="middle">逐子像素生成</text><text x="712" y="187" font-size="14" fill="#63766c" text-anchor="middle">超过三百万次顺序决策</text><rect x="168" y="292" width="624" height="79" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="322" font-size="18" fill="#283b34" text-anchor="middle">表示为块或视觉 token</text><text x="480" y="347" font-size="14" fill="#63766c" text-anchor="middle">需要定义编码与解码，才能缩短序列</text></g></svg>
