<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">用负号接上梯度下降</title><desc id="desc">负对数似然（negative log-likelihood，NLL）把最大化目标改成最小化目标。用小批量估计平均损失，沿负梯度方向更新参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">用负号接上梯度下降</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="156" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="171.33333333333334" y="186" font-size="18" fill="#283b34" text-anchor="middle">对数似然</text><text x="171.33333333333334" y="211" font-size="14" fill="#63766c" text-anchor="middle">最大化</text><path d="M304.6666666666667 199 L346.6666666666667 199" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350.6666666666667" y="156" width="258.6666666666667" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="186" font-size="18" fill="#283b34" text-anchor="middle">取负并平均</text><text x="480" y="211" font-size="14" fill="#63766c" text-anchor="middle">得到 NLL</text><path d="M613.3333333333334 199 L655.3333333333334 199" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="659.3333333333334" y="156" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="788.6666666666667" y="186" font-size="18" fill="#283b34" text-anchor="middle">梯度下降</text><text x="788.6666666666667" y="211" font-size="14" fill="#63766c" text-anchor="middle">最小化 NLL</text><rect x="189" y="301" width="582" height="63" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="331" font-size="18" fill="#283b34" text-anchor="middle">负号同时改变优化方向</text><text x="480" y="356" font-size="14" fill="#63766c" text-anchor="middle">符号一致，才能提高训练数据的似然</text></g></svg>
