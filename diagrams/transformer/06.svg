<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="自注意力的计算路径"><title>自注意力的计算路径</title><desc>由输入生成 Q、K、V，再计算内容相关的汇总 </desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="42" y="220" width="118" height="78" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="101" y="266" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="101" dy="0">输入 X</tspan></text><path d="M165 259 L225 163" stroke="#a8c2b4" stroke-width="2" fill="none"/><path d="M224.2933342994054 171.97221397357436 L225 163 L217.2447510610926 167.56684944962885" fill="none" stroke="#a8c2b4" stroke-width="2"/><rect x="231" y="138" width="107" height="56" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="284.5" y="173" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="284.5" dy="0">Q</tspan></text><path d="M165 259 L225 273" stroke="#a8c2b4" stroke-width="2" fill="none"/><path d="M216.2815009813121 275.2333326803541 L225 273 L218.1702392632722 267.1387400433822" fill="none" stroke="#a8c2b4" stroke-width="2"/><rect x="231" y="248" width="107" height="56" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="284.5" y="283" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="284.5" dy="0">K</tspan></text><path d="M165 259 L225 383" stroke="#a8c2b4" stroke-width="2" fill="none"/><path d="M217.78186384112198 377.6242665252174 L225 383 L225.26401018666647 374.00387313221205" fill="none" stroke="#a8c2b4" stroke-width="2"/><rect x="231" y="358" width="107" height="56" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="284.5" y="393" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="284.5" dy="0">V</tspan></text><path d="M342 164 L413 220" stroke="#176653" stroke-width="2" fill="none"/><path d="M404.1582986327349 218.31942958133197 L413 220 L409.30581667189824 211.79311206739274" fill="none" stroke="#176653" stroke-width="2"/><path d="M342 275 L413 248" stroke="#176653" stroke-width="2" fill="none"/><path d="M407.01560916668444 254.72213257487005 L413 248 L404.06111792628974 246.95291486864681" fill="none" stroke="#176653" stroke-width="2"/><rect x="418" y="207" width="179" height="78" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="507.5" y="235" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="507.5" dy="0">QK<tspan baseline-shift="super" font-size="72%">T</tspan> / √d<tspan baseline-shift="sub" font-size="72%">k</tspan></tspan></text><text x="507.5" y="264" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="507.5" dy="0">N × N 分数</tspan></text><path d="M602 246 L652 246" stroke="#176653" stroke-width="2" fill="none"/><path d="M644.0170456949865 250.15601257987333 L652 246 L644.0170456949865 241.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="657" y="206" width="238" height="79" rx="9" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="776" y="234" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="776" dy="0">softmax（每行）</tspan></text><text x="776" y="263" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="776" dy="0">归一化注意力 A</tspan></text><path d="M285 415 V430 H777 V384" fill="none" stroke="#497b98" stroke-width="2"/><text x="505" y="420" fill="#497b98" font-size="16" font-weight="400" text-anchor="middle"><tspan x="505" dy="0">V：被汇总的信息</tspan></text><path d="M777 288 L777 323" stroke="#176653" stroke-width="2" fill="none"/><path d="M772.8439874201266 315.01704569498645 L777 323 L781.1560125798734 315.01704569498645" fill="none" stroke="#176653" stroke-width="2"/><rect x="669" y="328" width="216" height="59" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="777" y="364.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="777" dy="0">输出 = AV</tspan></text><rect x="354" y="114" width="270" height="30" rx="15" fill="#176653" fill-opacity=".09"/><text x="489" y="135" fill="#176653" font-size="14" font-weight="400" text-anchor="middle"><tspan x="489" dy="0">按行归一化</tspan></text><text x="480" y="456" fill="#176653" font-size="18" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">Attention(Q,K,V) = softmax(QK<tspan baseline-shift="super" font-size="72%">T</tspan> / √d<tspan baseline-shift="sub" font-size="72%">k</tspan>)V</tspan></text></g></svg>