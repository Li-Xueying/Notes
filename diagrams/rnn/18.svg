<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="RNN 的能力与代价。变长输入、串行计算、长期访问困难"><title>RNN 的能力与代价</title><desc>变长输入、串行计算、长期访问困难。参数量不随长度增长，但时间依赖限制并行，也不保证远处信息能够保留。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">RNN 的能力与代价</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">变长输入、串行计算、长期访问困难</text><rect x="55" y="112" width="400" height="202" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="255" y="218" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">能力</text><text x="95" y="173" fill="#176653" font-size="16" font-weight="400" text-anchor="start" font-family="sans-serif">✓ 处理变长输入</text><text x="95" y="211" fill="#176653" font-size="16" font-weight="400" text-anchor="start" font-family="sans-serif">✓ 参数量不随长度增长</text><text x="95" y="249" fill="#176653" font-size="16" font-weight="400" text-anchor="start" font-family="sans-serif">✓ 同一规则处理每个位置</text><rect x="505" y="112" width="400" height="202" rx="6" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.4"/><text x="705" y="218" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">代价</text><text x="545" y="173" fill="#b47936" font-size="16" font-weight="400" text-anchor="start" font-family="sans-serif">△ 时间步存在串行依赖</text><text x="545" y="211" fill="#b47936" font-size="16" font-weight="400" text-anchor="start" font-family="sans-serif">△ 远处信息可能逐步丢失</text><text x="545" y="249" fill="#b47936" font-size="16" font-weight="400" text-anchor="start" font-family="sans-serif">△ 长路径使训练更困难</text></g></svg>
