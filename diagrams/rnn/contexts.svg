<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="观察 banking 的上下文"><title>观察 banking 的上下文</title><desc>不同句子中的邻近词共同约束 banking 的表示。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">观察 banking 的上下文</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">debt、crises、regulation、system 提供线索</text><text x="80" y="137" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">… government debt problems turning into banking crises …</text><text x="80" y="184" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">… Europe needs unified banking regulation …</text><text x="80" y="231" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">… India has just given its banking system a shot in the arm …</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">共同出现的上下文，构成表示学习的训练信号</text></g></svg>
