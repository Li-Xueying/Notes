<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">移动以后，重新计算速度</title><desc id="desc">从 x₁=(−1,2) 开始，计算 v₁=(0,3)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">移动以后，重新计算速度</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="120" width="403" height="102" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="243.5" y="149" font-size="18" fill="#283b34" text-anchor="middle">三步 Euler：当前 t=1</text><text x="243.5" y="174" font-size="14" fill="#63766c" text-anchor="middle">当前状态 (-1, 2)</text><rect x="42" y="255" width="403" height="96" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="243.5" y="284" font-size="18" fill="#283b34" text-anchor="middle">当前位置的速度 (0, 3)</text><text x="243.5" y="309" font-size="14" fill="#63766c" text-anchor="middle">下一步 x ← x−v/3</text><path d="M553 366 L902 366" fill="none" stroke="#63766c" stroke-width="2" marker-end="url(#arrow)"/><path d="M833 366 L833 88" fill="none" stroke="#63766c" stroke-width="2" marker-end="url(#arrow)"/><text x="911" y="372" font-size="15" fill="#283b34" text-anchor="middle">u₁</text><text x="823" y="88" font-size="15" fill="#283b34" text-anchor="middle">u₂</text><text x="823" y="386" font-size="14" fill="#63766c" text-anchor="middle">0</text><circle cx="688" cy="156" r="7" fill="#ab4d42"/><text x="718" y="161" font-size="16" fill="#283b34" text-anchor="middle">x₁</text><path d="M688 156 L688 261" fill="none" stroke="#9a701c" stroke-width="2" marker-end="url(#arrow)"/><text x="758" y="208.5" font-size="15" fill="#9a701c" text-anchor="middle">−v/3</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">结构场 f(u,t)=(u₁+t,2u₂−t)；每次移动后重新求值</text></g></svg>
