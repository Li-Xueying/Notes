<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="解码器预测下一个 token"><title>解码器预测下一个 token</title><desc>输入条件 + 已有前缀 → 词表分布。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">解码器预测下一个 token</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">输入条件 + 已有前缀 → 词表分布</text><rect x="46" y="161" width="193" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="142.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">源输入 x</text><text x="142.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">完整可用</text><path d="M239 207 L259 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="263" y="161" width="193" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="359.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Encoder</text><text x="359.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">源表示 Henc</text><path d="M456 207 L476 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="161" width="193" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="576.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Decoder</text><text x="576.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">已有目标前缀</text><path d="M673 207 L693 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="697" y="161" width="193" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="793.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">输出分布</text><text x="793.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">预测下一词</text><path d="M585 255 V298 H856 V255" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="703" y="328" font-size="16" fill="#b47936" text-anchor="middle" font-weight="400">已生成 token 反馈为下步输入</text></g></svg>
