<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="路由训练与负载调节"><title>路由训练与负载调节</title><desc>比较辅助损失、偏置调节和随机性等策略 辅助损失、专家偏置与随机路由使用不同的负载调节机制。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="55" y="201" width="190" height="104" rx="9" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="150" y="260" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="150" dy="0">路由分数</tspan></text><path d="M247 253 L272 253" stroke="#176653" stroke-width="2" fill="none"/><path d="M264.01704569498645 257.15601257987333 L272 253 L264.01704569498645 248.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="275" y="201" width="190" height="104" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="370" y="260" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="370" dy="0">选择与容量</tspan></text><path d="M467 253 L492 253" stroke="#176653" stroke-width="2" fill="none"/><path d="M484.01704569498645 257.15601257987333 L492 253 L484.01704569498645 248.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="495" y="201" width="190" height="104" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="590" y="260" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="590" dy="0">负载统计</tspan></text><path d="M687 253 L712 253" stroke="#176653" stroke-width="2" fill="none"/><path d="M704.0170456949865 257.15601257987333 L712 253 L704.0170456949865 248.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="715" y="201" width="190" height="104" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="810" y="260" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="810" dy="0">训练 / 偏置调节</tspan></text><path d="M785 387 L346 387" stroke="#b47936" stroke-width="2" fill="none"/><path d="M353.98295430501355 382.84398742012667 L346 387 L353.98295430501355 391.15601257987333" fill="none" stroke="#b47936" stroke-width="2"/><text x="565.5" y="378" fill="#b47936" font-size="14" font-weight="400" text-anchor="middle"><tspan x="565.5" dy="0">依据负载反馈调整路由</tspan></text><text x="480" y="457" fill="#667f72" font-size="18" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">优化任务目标，同时考虑路由负载</tspan></text></g></svg>