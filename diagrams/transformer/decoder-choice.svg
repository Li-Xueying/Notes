<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="统一序列建模与 KV cache"><title>统一序列建模与 KV cache</title><desc>缓存历史 K、V 减少重复投影；当前查询仍读取可见历史，缓存也占用显存。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">统一序列建模与 KV cache</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">训练目标、参数复用与推理缓存</text><rect x="46" y="161" width="193" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="142.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">提示 + 已生成前缀</text><text x="142.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">同一序列</text><path d="M239 207 L259 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="263" y="161" width="193" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="359.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">缓存历史 K、V</text><text x="359.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">各层复用</text><path d="M456 207 L476 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="161" width="193" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="576.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">计算当前 Q、K、V</text><text x="576.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">读取历史缓存</text><path d="M673 207 L693 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="697" y="161" width="193" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="793.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">预测下一词</text><text x="793.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">追加到前缀</text><path d="M797 254 V305 H152 V254" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">统一任务格式；缓存随长度与批大小占用空间</text></g></svg>
