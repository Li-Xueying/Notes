<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="ResNet"><title>ResNet</title><desc>学习残差，保留恒等或投影捷径</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">ResNet</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">学习残差，保留恒等或投影捷径</text><rect x="62" y="164" width="125" height="80" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="124.5" y="210" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">输入 x</text><path d="M187 204 L290 204" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="305" y="137" width="245" height="134" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="427.5" y="197" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">残差分支 F(x)</text><text x="427.5" y="223" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">Conv → Act → Conv</text><path d="M550 204 L670 204" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="705" cy="204" r="25" fill="#e9f3ee" stroke="#176653" stroke-width="2"/><text x="705" y="212" fill="#176653" font-size="25" font-weight="650" text-anchor="middle" font-family="sans-serif">+</text><path d="M730 204 L865 204" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M125 164 L125 102" stroke="#b47936" stroke-width="2" fill="none"/><path d="M125 102 L705 102" stroke="#b47936" stroke-width="2" fill="none"/><path d="M705 102 L705 177" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><text x="415" y="91" fill="#b47936" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">恒等 x；形状变化时使用 Ws x</text><rect x="170" y="309" width="620" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="343" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">y = F(x) + x      或      y = F(x) + Ws x</text></g></svg>
