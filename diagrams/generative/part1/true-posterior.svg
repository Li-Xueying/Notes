<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">贝叶斯改写仍需真实后验</title><desc id="desc">真实后验（posterior）pθ(z|x) 描述观察到 x 后，对潜变量的更新认识。把边缘似然用贝叶斯公式改写，分母恰好是这个通常难算的后验。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">贝叶斯改写仍需真实后验</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="157" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="171.33333333333334" y="187" font-size="18" fill="#283b34" text-anchor="middle">先验 p(z)</text><text x="171.33333333333334" y="212" font-size="14" fill="#63766c" text-anchor="middle">生成前的潜变量分布</text><path d="M304.6666666666667 200 L346.6666666666667 200" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350.6666666666667" y="157" width="258.6666666666667" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="187" font-size="18" fill="#283b34" text-anchor="middle">观察输入 x</text><text x="480" y="212" font-size="14" fill="#63766c" text-anchor="middle">贝叶斯更新</text><path d="M613.3333333333334 200 L655.3333333333334 200" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="659.3333333333334" y="157" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="788.6666666666667" y="187" font-size="18" fill="#283b34" text-anchor="middle">真实后验 pθ(z|x)</text><text x="788.6666666666667" y="212" font-size="14" fill="#63766c" text-anchor="middle">依赖难算的 pθ(x)</text><rect x="177" y="301" width="606" height="65" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="331" font-size="18" fill="#283b34" text-anchor="middle">改写贝叶斯公式，没有移除归一化困难</text><text x="480" y="356" font-size="14" fill="#63766c" text-anchor="middle">引入可计算的近似推断分布</text></g></svg>
