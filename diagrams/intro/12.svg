<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="重复提问中的上下文"><title>重复提问中的上下文</title><desc>两组回答都符合语法，但只有一组对重复提问作出变化，显示其利用了对话历史。</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.7"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.7"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start"><tspan x="48" dy="0">同一句问题连续出现三次</tspan></text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="48" dy="0">比较“固定映射”与“利用上下文”</tspan></text><rect x="45" y="104" width="405" height="226" rx="8" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.6"/><text x="247.5" y="135" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="247.5" dy="0">回答 A：机械重复</tspan></text><text x="247.5" y="162" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="247.5" dy="0">问：你会下国际象棋吗？</tspan><tspan x="247.5" dy="20">答：是的。</tspan><tspan x="247.5" dy="20"></tspan><tspan x="247.5" dy="20">问：你会下国际象棋吗？</tspan><tspan x="247.5" dy="20">答：是的。</tspan><tspan x="247.5" dy="20"></tspan><tspan x="247.5" dy="20">问：你会下国际象棋吗？</tspan><tspan x="247.5" dy="20">答：是的。</tspan></text><rect x="510" y="104" width="405" height="226" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="712.5" y="135" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="712.5" dy="0">回答 B：感知重复</tspan></text><text x="712.5" y="162" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="712.5" dy="0">问：你会下国际象棋吗？</tspan><tspan x="712.5" dy="20">答：是的。</tspan><tspan x="712.5" dy="20"></tspan><tspan x="712.5" dy="20">问：你会下国际象棋吗？</tspan><tspan x="712.5" dy="20">答：我刚才已经回答过。</tspan><tspan x="712.5" dy="20"></tspan><tspan x="712.5" dy="20">问：为什么又问同一个问题？</tspan></text><rect x="73" y="348" width="160" height="38" rx="19" fill="#ffffff" stroke="#a8c2b4"/><text x="153" y="373" fill="#176653" font-size="14" text-anchor="middle">固定规则输出</text><rect x="254" y="348" width="160" height="38" rx="19" fill="#ffffff" stroke="#a8c2b4"/><text x="334" y="373" fill="#176653" font-size="14" text-anchor="middle">忽略对话历史</text><rect x="538" y="348" width="160" height="38" rx="19" fill="#176653" stroke="#176653"/><text x="618" y="373" fill="#ffffff" font-size="14" text-anchor="middle">使用上下文</text><rect x="719" y="348" width="160" height="38" rx="19" fill="#176653" stroke="#176653"/><text x="799" y="373" fill="#ffffff" font-size="14" text-anchor="middle">调整回答</text></g></svg>
