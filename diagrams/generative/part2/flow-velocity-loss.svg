<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">回归速度，最小化平方误差</title><desc id="desc">网络 fθ 接收 xt 与 t，输出同形状的速度预测。已知构造它的 x,z，所以可以直接用 z−x 作监督，以平方误差训练。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">回归速度，最小化平方误差</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">已知 x,z,t</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">构造 xₜ</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">模型预测</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">fθ(xₜ,t)</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">监督目标</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">z−x</text><rect x="203" y="311" width="554" height="65" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="340" font-size="18" fill="#283b34" text-anchor="middle">平方误差连接预测与已知目标</text><text x="480" y="365" font-size="14" fill="#63766c" text-anchor="middle">随机抽时刻并行训练</text></g></svg>
