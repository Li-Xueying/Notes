<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="经典架构路线"><title>经典架构路线</title><desc>深度、宽度、连接和通道</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">经典架构路线</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">深度、宽度、连接和通道</text><path d="M75 205 L885 205" stroke="#a8c2b4" stroke-width="2" fill="none"/><circle cx="80" cy="205" r="8" fill="#176653"/><text x="80" y="169" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">LeNet</text><text x="80" y="238" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">基本骨架</text><circle cx="214" cy="205" r="8" fill="#176653"/><text x="214" y="169" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">AlexNet</text><text x="214" y="238" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">大规模训练</text><circle cx="348" cy="205" r="8" fill="#176653"/><text x="348" y="169" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">VGG</text><text x="348" y="238" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">小核堆叠</text><circle cx="482" cy="205" r="8" fill="#176653"/><text x="482" y="169" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">GoogLeNet</text><text x="482" y="238" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">多尺度分支</text><circle cx="616" cy="205" r="8" fill="#b47936"/><text x="616" y="169" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">ResNet</text><text x="616" y="238" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">残差连接</text><circle cx="750" cy="205" r="8" fill="#b47936"/><text x="750" y="169" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">DenseNet</text><text x="750" y="238" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">特征复用</text><circle cx="884" cy="205" r="8" fill="#b47936"/><text x="884" y="169" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">SENet</text><text x="884" y="238" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">通道重标定</text><rect x="70" y="299" width="820" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="333" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">统一比较：分辨率、通道、核、融合方式、参数量与可训练性。</text></g></svg>
