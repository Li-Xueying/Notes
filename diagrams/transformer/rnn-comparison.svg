<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="串行递推与并行交互"><title>串行递推与并行交互</title><desc>RNN 沿时间串行传递，注意力直接访问远处位置；自回归生成依然依赖已有输出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">串行递推与并行交互</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">RNN 沿时间传递；注意力直接连接远处位置</text><rect x="93" y="108" width="133" height="59" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="159.5" y="143.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">h1</text><text x="159" y="217" font-size="17" fill="#263f35" text-anchor="middle" font-weight="400">x1</text><path d="M159 198 L159 168" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="307" y="108" width="133" height="59" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="373.5" y="143.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">h2</text><path d="M226 138 L307 138" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="373" y="217" font-size="17" fill="#263f35" text-anchor="middle" font-weight="400">x2</text><path d="M373 198 L373 168" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="521" y="108" width="133" height="59" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="587.5" y="143.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">h3</text><path d="M440 138 L521 138" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="587" y="217" font-size="17" fill="#263f35" text-anchor="middle" font-weight="400">x3</te