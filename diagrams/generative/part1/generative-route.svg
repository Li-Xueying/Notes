<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">本讲路线：Part I 与 Part II</title><desc id="desc">本讲分为两部分，按模型获得训练信号和生成样本的路径来划分。Part I 从概率建模出发，依次覆盖生成建模基础、最大似然与自回归、VAE；Part II 转向 GAN、Rectified Flow 与扩散、条件生成与 CFG，并以图像、视频和世界模型为应用实例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">本讲路线：Part I 与 Part II</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="82" width="876" height="63" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="480" y="112" font-size="18" fill="#283b34" text-anchor="middle">Part I · 概率建模与潜变量</text><text x="480" y="137" font-size="14" fill="#63766c" text-anchor="middle">分布建模 → 最大似然 / 自回归 → VAE</text><rect x="42" y="160" width="276" height="63" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="180" y="190" font-size="18" fill="#283b34" text-anchor="middle">生成建模基础</text><text x="180" y="215" font-size="14" fill="#63766c" text-anchor="middle">分布、条件与一对多</text><rect x="342" y="160" width="276" height="63" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="190" font-size="18" fill="#283b34" text-anchor="middle">最大似然与自回归</text><text x="480" y="215" font-size="14" fill="#63766c" text-anchor="middle">条件分解、顺序采样</text><rect x="642" y="160" width="276" height="63" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="780" y="190" font-size="18" fill="#283b34" text-anchor="middle">VAE</text><text x="780" y="215" font-size="14" fill="#63766c" text-anchor="middle">潜变量、ELBO 与采样</text><rect x="42" y="248" width="876" height="63" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="278" font-size="18" fill="#283b34" text-anchor="middle">Part II · 对抗、连续与条件生成</text><text x="480" y="303" font-size="14" fill="#63766c" text-anchor="middle">GAN → Rectified Flow / 扩散 → 条件生成与应用</text><rect x="42" y="326" width="276" height="63" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="180" y="356" font-size="18" fill="#283b34" text-anchor="middle">GAN</text><text x="180" y="381" font-size="14" fill="#63766c" text-anchor="middle">对抗学习、生成器采样</text><rect x="342" y="326" width="276" height="63" rx="4" fill="#f9e7e3" stroke="#ccdbd2"/><text x="480" y="356" font-size="18" fill="#283b34" text-anchor="middle">Rectified Flow 与扩散</text><text x="480" y="381" font-size="14" fill="#63766c" text-anchor="middle">速度 / 去噪、逐步采样</text><rect x="642" y="326" width="276" height="63" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="780" y="356" font-size="18" fill="#283b34" text-anchor="middle">条件生成与应用</text><text x="780" y="381" font-size="14" fill="#63766c" text-anchor="middle">CFG；图像、视频、世界模型</text><text x="480" y="423" font-size="17" fill="#63766c" text-anchor="middle">同一组问题：怎样学习分布？怎样从模型生成样本？</text></g></svg>
