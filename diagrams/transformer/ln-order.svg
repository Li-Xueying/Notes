<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="归一化放在模块之前还是之后"><title>归一化放在模块之前还是之后</title><desc>沿主残差路径观察：Pre-LN 先处理模块输入，Post-LN 在相加之后归一化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">归一化放在模块之前还是之后</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">Post-LN: LN(x+F(x))；Pre-LN: x+F(LN(x))</text><text x="249" y="104" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Post-LN</text><rect x="133" y="126" width="230" height="60" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="248" y="149" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">F</text><text x="248" y="177" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">模块分支</text><path d="M248 186 L248 227" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="133" y="229" width="230" height="52" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="248" y="261" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">+ x</text><path d="M248 126 V113 H93 V256 H133" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><path d="M248 281 L248 297" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="133" y="298" width="230" height="50" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="248" y="329" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">LN → 输出</text><text x="702" y="104" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Pre-LN</text><rect x="586" y="126" width="230" height="60" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="701" y="149" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">LN → F</text><text x="701" y="177" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">模块分支</text><path d="M701 186 L701 227" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="586" y="229" width="230" height="52" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="701" y="261" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">+ x</text><path d="M701 126 V113 H546 V256 H586" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><path d="M701 281 L701 297" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="586" y="298" width="230" height="50" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="701" y="329" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">输出</text><rect x="46" y="360" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="391" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">布局改变梯度路径；训练表现还依赖深度与训练配置</text></g></svg>
