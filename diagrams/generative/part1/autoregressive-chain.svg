<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">由条件概率逐步累积联合概率</title><desc id="desc">自回归模型（autoregressive model）把 x=(x₁,…,xT) 的联合分布按概率链式法则分解。每一项只以之前的元素为条件，乘起来得到整个序列的似然。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">由条件概率逐步累积联合概率</text><path d="M42 63 H918" stroke="#ccdbd2"/><text x="480" y="109" font-size="19" fill="#283b34" text-anchor="middle">固定前缀，选择当前事件，再将概率相乘</text><rect x="55" y="156" width="235" height="89" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.5" y="186" font-size="18" fill="#283b34" text-anchor="middle">x₁ 已选</text><text x="172.5" y="211" font-size="14" fill="#63766c" text-anchor="middle">条件概率 0.6</text><path d="M294 201 L355 201" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><text x="172" y="280" font-size="16" fill="#2f7253" text-anchor="middle">前缀：x₁</text><rect x="362" y="156" width="235" height="89" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="479.5" y="186" font-size="18" fill="#283b34" text-anchor="middle">x₂ 已选</text><text x="479.5" y="211" font-size="14" fill="#63766c" text-anchor="middle">条件概率 0.5</text><path d="M601 201 L662 201" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><text x="479" y="280" font-size="16" fill="#2f7253" text-anchor="middle">前缀：x₁、x₂</text><rect x="669" y="156" width="235" height="89" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="786.5" y="186" font-size="18" fill="#283b34" text-anchor="middle">x₃ 已选</text><text x="786.5" y="211" font-size="14" fill="#63766c" text-anchor="middle">条件概率 0.2</text><text x="786" y="280" font-size="16" fill="#2f7253" text-anchor="middle">前缀：x₁、x₂、x₃</text><rect x="195" y="323" width="570" height="61" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="359.5" font-size="18" fill="#283b34" text-anchor="middle">当前累计路径概率 = 0.06</text></g></svg>
