<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">固定高斯观察方差对应平方误差</title><desc id="desc">对固定观察方差的高斯解码器，最大化固定 z 下的条件对数似然等价于最小化输入与预测均值的平方误差。它给出了重建项的概率解释。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">固定高斯观察方差对应平方误差</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="52" y="140" width="355" height="113" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="229.5" y="170" font-size="18" fill="#283b34" text-anchor="middle">高斯解码器</text><text x="229.5" y="195" font-size="14" fill="#63766c" text-anchor="middle">均值 μθ(z)</text><text x="229.5" y="218" font-size="14" fill="#63766c" text-anchor="middle">固定观察方差 τ²</text><path d="M411 197 L477 197" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="481" y="140" width="426" height="113" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="694" y="170" font-size="18" fill="#283b34" text-anchor="middle">条件对数似然</text><text x="694" y="195" font-size="14" fill="#63766c" text-anchor="middle">固定常数 − 缩放平方误差</text><text x="480" y="405" font-size="17" fill="#63766c" text-anchor="middle">观察方差若可学习，归一化项也必须参与优化</text></g></svg>
