<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="图灵与机器智能问题"><title>图灵与机器智能问题</title><desc>图灵的工作把可计算性、机器智能和可观察行为联系起来。</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.7"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.7"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start"><tspan x="48" dy="0">Alan Turing：把“能否思考”改写为可讨论的问题</tspan></text><text x="90" y="147" fill="#b47936" font-size="17" font-weight="600" text-anchor="middle"><tspan x="90" dy="0">1931</tspan></text><text x="90" y="179" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="90" dy="0">进入剑桥大学</tspan><tspan x="90" dy="21">学习数学</tspan></text><text x="250" y="147" fill="#176653" font-size="17" font-weight="600" text-anchor="middle"><tspan x="250" dy="0">1938</tspan></text><text x="250" y="179" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="250" dy="0">普林斯顿大学</tspan><tspan x="250" dy="21">获博士学位</tspan></text><text x="420" y="147" fill="#176653" font-size="17" font-weight="600" text-anchor="middle"><tspan x="420" dy="0">1939–1945</tspan></text><text x="420" y="179" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="420" dy="0">参与密码分析</tspan><tspan x="420" dy="21">推进计算实践</tspan></text><text x="590" y="147" fill="#176653" font-size="17" font-weight="600" text-anchor="middle"><tspan x="590" dy="0">1950</tspan></text><text x="590" y="179" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="590" dy="0">提出模仿游戏</tspan><tspan x="590" dy="21">讨论机器智能</tspan></text><path d="M90 115 L590 115" stroke="#a8c2b4" stroke-width="3"/><circle cx="90" cy="115" r="8" fill="#b47936"/><circle cx="250" cy="115" r="8" fill="#176653"/><circle cx="420" cy="115" r="8" fill="#176653"/><circle cx="590" cy="115" r="8" fill="#176653"/><rect x="720" y="99" width="185" height="145" rx="8" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.6"/><text x="812.5" y="130" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="812.5" dy="0">关键转变</tspan></text><text x="812.5" y="157" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="812.5" dy="0">不先定义“思考”</tspan><tspan x="812.5" dy="20">而考察可观察表现</tspan></text><text x="480" y="326" fill="#667f72" font-size="16" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">行为测试提供操作性标准，但不能单独回答意识或理解是否存在。</tspan></text></g></svg>
