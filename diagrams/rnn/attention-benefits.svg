<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="直接访问源状态带来什么"><title>直接访问源状态带来什么</title><desc>改善信息访问，让远处位置更直接地接收监督；不保证解决所有长期依赖。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">直接访问源状态带来什么</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">绕过瓶颈，缩短梯度路径</text><rect x="48" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="180" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">访问全部源状态</text><text x="180" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">绕过固定瓶颈</text><path d="M312 200 L332 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="336" y="154" width="264" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="468" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">当前词专属上下文</text><text x="468" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">每步重新选择</text><path d="M600 200 L620 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="756" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">更短监督路径</text><text x="756" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">辅助长期依赖学习</text></g></svg>
