<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">保留编码器，换成分类头</title><desc id="desc">训练后保留编码器，移除重建解码器，再接分类头，把 z 用于标签预测。分类阶段的目标 y 来自下游标注数据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">保留编码器，换成分类头</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="167" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="171.33333333333334" y="197" font-size="18" fill="#283b34" text-anchor="middle">目标数据 x</text><text x="171.33333333333334" y="222" font-size="14" fill="#63766c" text-anchor="middle">有标签 y</text><path d="M304.6666666666667 210 L346.6666666666667 210" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350.6666666666667" y="167" width="258.6666666666667" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="197" font-size="18" fill="#283b34" text-anchor="middle">预训练编码器</text><text x="480" y="222" font-size="14" fill="#63766c" text-anchor="middle">保留 z</text><path d="M613.3333333333334 210 L655.3333333333334 210" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="659.3333333333334" y="167" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="788.6666666666667" y="197" font-size="18" fill="#283b34" text-anchor="middle">分类头</text><text x="788.6666666666667" y="222" font-size="14" fill="#63766c" text-anchor="middle">预测标签 ŷ</text><rect x="183" y="301" width="594" height="63" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="331" font-size="18" fill="#283b34" text-anchor="middle">训练信号从重建误差变成分类误差</text><text x="480" y="356" font-size="14" fill="#63766c" text-anchor="middle">编码器可冻结，也可随下游任务微调</text></g></svg>
