<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="将输出反馈为下一步输入"><title>将输出反馈为下一步输入</title><desc>每个输出进入下一轮前缀；若生成“渡”，模型随后也会读取“渡”。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">将输出反馈为下一步输入</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">START → 深 → 度 → 学 → 习</text><rect x="45" y="194" width="122" height="68" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="106" y="221" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Decoder</text><text x="106" y="249" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">读取前缀</text><rect x="197" y="108" width="134" height="51" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="264" y="139.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">深</text><path d="M264 193 L264 160" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="197" y="194" width="134" height="67" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="264" y="220.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">第 1 步</text><text x="264" y="248.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">条件预测</text><rect x="197" y="299" width="134" height="46" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="264" y="328" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">BOS</text><path d="M264 299 L264 262" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="395" y="108" width="134" height="51" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="462" y="139.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">度</text><path d="M462 193 L462 160" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="395" y="194" width="134" height="67" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="462" y="220.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">第 2 步</text><text x="462" y="248.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">条件预测</text><rect x="395" y="299" width="134" height="46" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="462" y="328" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">深</text><path d="M462 299 L462 262" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><path d="M264 159 H348 V322 H395" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="593" y="108" width="134" height="51" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="660" y="139.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">学</text><path d="M660 193 L660 160" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="593" y="194" width="134" height="67" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="660" y="220.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">第 3 步</text><text x="660" y="248.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">条件预测</text><rect x="593" y="299" width="134" height="46" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="660" y="328" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">度</text><path d="M660 299 L660 262" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><path d="M462 159 H546 V322 H593" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
