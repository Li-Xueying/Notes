<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">中间噪声区域需要更多学习资源</title><desc id="desc">在中间噪声级别，数据结构与噪声混合，许多端点配对可能解释相同状态。对图像任务而言，网络常需在这里建立更复杂的语义判断。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">中间噪声区域需要更多学习资源</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">低噪声</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">数据身份较明确</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">中间噪声</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">多对端点的解释混合</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">高噪声</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">噪声端点较明确</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">具体难度依赖数据和参数化；引出训练时间的加权</text></g></svg>
