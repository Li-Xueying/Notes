<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="课程内容路线"><title>课程内容路线</title><desc>四个部分从问题定义逐步推进到模型、训练和应用。</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.7"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.7"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start"><tspan x="48" dy="0">课程内容路线</tspan></text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="48" dy="0">从问题到模型，再到可验证的应用</tspan></text><path d="M162 202 L315 202" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><path d="M392 202 L545 202" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><path d="M622 202 L775 202" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><rect x="75" y="153" width="170" height="98" rx="8" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.6"/><text x="160" y="184" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="160" dy="0">01 引言与概览</tspan></text><text x="160" y="211" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" dy="0">问题与边界</tspan></text><rect x="275" y="153" width="170" height="98" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="360" y="184" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="360" dy="0">02 多层感知机</tspan></text><text x="360" y="211" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="360" dy="0">结构与表示</tspan></text><rect x="475" y="153" width="170" height="98" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="560" y="184" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="560" dy="0">03 网络训练</tspan></text><text x="560" y="211" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="560" dy="0">损失与优化</tspan></text><rect x="675" y="153" width="210" height="98" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="780" y="184" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="780" dy="0">04 案例分析</tspan></text><text x="780" y="211" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="780" dy="0">评价与应用</tspan></text><text x="480" y="320" fill="#667f72" font-size="17" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">每一步都回答一个可检查的问题，而不是孤立罗列模型名称。</tspan></text></g></svg>
