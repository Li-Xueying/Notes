<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="模型参数与超参数"><title>模型参数与超参数</title><desc>区分从数据学到的量与训练前选定的设置 </desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="58" y="140" width="281.3333333333333" height="55" fill="#e9f3ee"/><text x="70" y="173.5" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="70" dy="0">类型</tspan></text><rect x="339.3333333333333" y="140" width="281.3333333333333" height="55" fill="#e9f3ee"/><text x="351.3333333333333" y="173.5" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="351.3333333333333" dy="0">典型对象</tspan></text><rect x="620.6666666666666" y="140" width="281.3333333333333" height="55" fill="#e9f3ee"/><text x="632.6666666666666" y="173.5" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="632.6666666666666" dy="0">如何确定</tspan></text><rect x="58" y="195" width="281.3333333333333" height="55" fill="#f7faf8"/><text x="70" y="228.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="70" dy="0">模型参数</tspan></text><rect x="339.3333333333333" y="195" width="281.3333333333333" height="55" fill="#f7faf8"/><text x="351.3333333333333" y="228.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="351.3333333333333" dy="0">权重、偏置</tspan></text><rect x="620.6666666666666" y="195" width="281.3333333333333" height="55" fill="#f7faf8"/><text x="632.6666666666666" y="228.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="632.6666666666666" dy="0">由训练优化</tspan></text><rect x="58" y="250" width="281.3333333333333" height="55" fill="#ffffff"/><text x="70" y="283.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="70" dy="0">超参数</tspan></text><rect x="339.3333333333333" y="250" width="281.3333333333333" height="55" fill="#ffffff"/><text x="351.3333333333333" y="283.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="351.3333333333333" dy="0">学习率、批量大小</tspan></text><rect x="620.6666666666666" y="250" width="281.3333333333333" height="55" fill="#ffffff"/><text x="632.6666666666666" y="283.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="632.6666666666666" dy="0">通过设置与验证选择</tspan></text></g></svg>