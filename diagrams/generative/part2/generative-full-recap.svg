<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">用训练信号与采样路径复习四类模型</title><desc id="desc">自回归学习条件似然并顺序生成；VAE 用潜变量和下界训练，先采潜变量再解码；GAN 通过真假博弈训练生成器；扩散与流把简单噪声经多步网络评估转成数据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">用训练信号与采样路径复习四类模型</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="91" width="876" height="65" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="63" y="131" font-size="19" fill="#283b34" text-anchor="start">自回归</text><text x="407" y="131" font-size="18" fill="#283b34" text-anchor="middle">条件似然</text><text x="744" y="131" font-size="18" fill="#283b34" text-anchor="middle">按前缀顺序采样</text><rect x="42" y="168" width="876" height="65" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="63" y="208" font-size="19" fill="#283b34" text-anchor="start">VAE</text><text x="407" y="208" font-size="18" fill="#283b34" text-anchor="middle">变分下界</text><text x="744" y="208" font-size="18" fill="#283b34" text-anchor="middle">先采潜变量，再解码</text><rect x="42" y="245" width="876" height="65" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="63" y="285" font-size="19" fill="#283b34" text-anchor="start">GAN</text><text x="407" y="285" font-size="18" fill="#283b34" text-anchor="middle">真假博弈</text><text x="744" y="285" font-size="18" fill="#283b34" text-anchor="middle">噪声经生成器</text><rect x="42" y="322" width="876" height="65" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="63" y="362" font-size="19" fill="#283b34" text-anchor="start">扩散 / 流</text><text x="407" y="362" font-size="18" fill="#283b34" text-anchor="middle">回归去噪等目标</text><text x="744" y="362" font-size="18" fill="#283b34" text-anchor="middle">从噪声迭代到数据</text></g></svg>
