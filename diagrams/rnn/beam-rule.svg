<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="束搜索保留 k 个高分前缀"><title>束搜索保留 k 个高分前缀</title><desc>累计对数分数通常为负，越大越好；更高效，但仍不保证全局最优。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">束搜索保留 k 个高分前缀</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">扩展 → 累加分数 → 全局取前 k 个</text><rect x="48" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="180" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">扩展活动束</text><text x="180" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">至多 k|V| 候选</text><path d="M312 200 L332 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="336" y="154" width="264" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="468" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">累加对数分数</text><text x="468" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">上一分数 + 当前 log P</text><path d="M600 200 L620 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="756" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">全局保留 k 个</text><text x="756" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">继续下一步</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">score(y₁:ₜ) = ∑ᵢ log P(y_i | y_&lt;i,x)</text></g></svg>
