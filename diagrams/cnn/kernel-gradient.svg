<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="共享核参数的梯度"><title>共享核参数的梯度</title><desc>K₀₀ 被四个输出使用，每条路径贡献一项</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">共享核参数的梯度</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">K₀₀ 被四个输出使用，每条路径贡献一项</text><rect x="58" y="123" width="42" height="42" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="79" y="149" fill="#263f35" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">x00</text><rect x="100" y="123" width="42" height="42" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="121" y="149" fill="#263f35" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">x01</text><rect x="142" y="123" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="163" y="149" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">x02</text><rect x="58" y="165" width="42" height="42" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="79" y="191" fill="#263f35" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">x10</text><rect x="100" y="165" width="42" height="42" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="121" y="191" fill="#263f35" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">x11</text><rect x="142" y="165" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x