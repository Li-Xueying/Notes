<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="机器翻译：源句到目标句"><title>机器翻译：源句到目标句</title><desc>保留源句意思，同时生成符合目标语言的表达；先看神经模型之前怎样做。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">机器翻译：源句到目标句</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">语言与长度都可以不同</text><text x="80" y="137" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">English: Machine Translation in natural language processing</text><text x="80" y="184" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">German: Maschinelle Übersetzung in der Verarbeitung natürlicher Sprache</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">源序列 x → 翻译系统 → 目标序列 y</text></g></svg>
