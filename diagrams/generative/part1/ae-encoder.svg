<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">编码器从输入中提取表示</title><desc id="desc">自编码器（autoencoder）的编码器将数据 x 映射为潜在表示 z，希望保留对象、外观或场景等有用信息。编码器可以采用 MLP、CNN 或 Transformer。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">编码器从输入中提取表示</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="166" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="171.33333333333334" y="196" font-size="18" fill="#283b34" text-anchor="middle">输入数据 x</text><text x="171.33333333333334" y="221" font-size="14" fill="#63766c" text-anchor="middle">无类别标签</text><path d="M304.6666666666667 209 L346.6666666666667 209" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350.6666666666667" y="166" width="258.6666666666667" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="196" font-size="18" fill="#283b34" text-anchor="middle">编码器 fφ</text><text x="480" y="221" font-size="14" fill="#63766c" text-anchor="middle">MLP / CNN / Transformer</text><path d="M613.3333333333334 209 L655.3333333333334 209" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="659.3333333333334" y="166" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="788.6666666666667" y="196" font-size="18" fill="#283b34" text-anchor="middle">潜表示 z</text><text x="788.6666666666667" y="221" font-size="14" fill="#63766c" text-anchor="middle">保留有用信息</text><text x="480" y="405" font-size="17" fill="#63766c" text-anchor="middle">先明确表示学习目的，再为编码器建立训练信号</text></g></svg>
