<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="从手工求导到自动微分"><title>从手工求导到自动微分</title><desc>计算图记录局部运算，反向按链式法则组合 </desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="115" y="170" width="223.33333333333334" height="92" rx="9" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="226.66666666666669" y="198" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="226.66666666666669" dy="0">x</tspan></text><text x="226.66666666666669" y="227" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="226.66666666666669" dy="0">输入或参数</tspan></text><path d="M340.33333333333337 216 L365.33333333333337 216" stroke="#176653" stroke-width="2" fill="none"/><path d="M357.3503790283198 220.15601257987333 L365.33333333333337 216 L357.3503790283198 211.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="368.33333333333337" y="170" width="223.33333333333334" height="92" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="480.00000000000006" y="198" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="480.00000000000006" dy="0">中间量 z</tspan></text><text x="480.00000000000006" y="227" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="480.00000000000006" dy="0">局部运算 g(x)</tspan></text><path d="M593.6666666666667 216 L618.6666666666667 216" stroke="#176653" stroke-width="2" fill="none"/><path d="M610.6837123616532 220.15601257987333 L618.6666666666667 216 L610.6837123616532 211.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="621.6666666666667" y="170" width="223.33333333333334" height="92" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="733.3333333333334" y="198" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="733.3333333333334" dy="0">损失 L</tspan></text><text x="733.3333333333334" y="227" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="733.3333333333334" dy="0">目标函数</tspan></text><path d="M805 330 L536 330" stroke="#b47936" stroke-width="2" fill="none"/><path d="M543.9829543050135 325.84398742012667 L536 330 L543.9829543050135 334.15601257987333" fill="none" stroke="#b47936" stroke-width="2"/><text x="670.5" y="321" fill="#b47936" font-size="14" font-weight="400" text-anchor="middle"><tspan x="670.5" dy="0">∂L / ∂z</tspan></text><path d="M421 330 L152 330" stroke="#b47936" stroke-width="2" fill="none"/><path d="M159.98295430501355 325.84398742012667 L152 330 L159.98295430501355 334.15601257987333" fill="none" stroke="#b47936" stroke-width="2"/><text x="286.5" y="321" fill="#b47936" font-size="14" font-weight="400" text-anchor="middle"><tspan x="286.5" dy="0">再乘 ∂z / ∂x</tspan></text><text x="480" y="432" fill="#176653" font-size="18" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">损失 → 上游梯度 × 局部导数 → 参数梯度</tspan></text></g></svg>