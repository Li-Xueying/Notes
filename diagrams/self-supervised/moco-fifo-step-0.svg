<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">先计算损失，再维护 FIFO 队列</title><desc id="desc">容量四：旧负键 K1、K2、K3、K4。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">先计算损失，再维护 FIFO 队列</text><path d="M42 63 H918" stroke="#d7e5dc"/><text x="145" y="142" font-size="16" fill="#ac4f53" text-anchor="middle">队首（最旧）</text><text x="705" y="142" font-size="16" fill="#176653" text-anchor="middle">队尾（最新）</text><rect x="65" y="160" width="159" height="77" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="144.5" y="204.5" font-size="18" fill="#263f35" text-anchor="middle">K1</text><rect x="251" y="160" width="159" height="77" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="330.5" y="204.5" font-size="18" fill="#263f35" text-anchor="middle">K2</text><rect x="437" y="160" width="159" height="77" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="516.5" y="204.5" font-size="18" fill="#263f35" text-anchor="middle">K3</text><rect x="623" y="160" width="159" height="77" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="702.5" y="204.5" font-size="18" fill="#263f35" text-anchor="middle">K4</text><text x="856" y="205" font-size="15" fill="#263f35" text-anchor="middle">固定容量 4</text><rect x="42" y="381" width="876" height="48" rx="4" fill="#f5f9f6" stroke="#d7e5dc"/><text x="480" y="412" font-size="18" fill="#176653" text-anchor="middle">历史键已保存，不保留反向传播激活</text></g></svg>
