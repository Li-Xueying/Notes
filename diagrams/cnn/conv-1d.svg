<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="卷积：让滤波器沿信号滑动"><title>卷积：让滤波器沿信号滑动</title><desc>先看输入、滤波器和输出之间的连线，再计算窗口。数学卷积会翻转核；深度学习常用不翻转的互相关，二者都复用同一组权重。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">卷积：让滤波器沿信号滑动</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">一个窗口经过加权求和，产生一个输出</text><rect x="80" y="122" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="109" y="156" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">1</text><rect x="138" y="122" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="167" y="156" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">1</text><rect x="196" y="122" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="225" y="156" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">2</text><rect x="254" y="122" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="283" y="156" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">-1</text><rect x="312" y="122" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="341" y="156" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">1</text><rect x="370" y="122" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="399" y="156" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">-3</text><rect x="428" y="122" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="457" y="156" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">1</text><text x="283" y="111" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">输入 x</text><g data-window="input" transform="translate(80 122)"><rect width="174" height="58" fill="none" stroke="#b47936" stroke-width="3"/></g><rect x="80" y="230" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="109" y="264" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">1</text><rect x="138" y="230" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="167" y="264" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">0</text><rect x="196" y="230" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="225" y="264" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">-1</text><text x="167" y="219" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">共享滤波器 w</text><path d="M278 256 L400 256" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><text x="339" y="247" fill="#176653" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">对应相乘、求和</text><rect x="435" y="230" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="convolution" data-index="0"><text x="464" y="264" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">-1</text></g><rect x="493" y="230" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="convolution" data-index="1"><text x="522" y="264" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">2</text></g><rect x="551" y="230" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="convolution" data-index="2"><text x="580" y="264" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">1</text></g><rect x="609" y="230" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="convolution" data-index="3"><text x="638" y="264" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">2</text></g><rect x="667" y="230" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="convolution" data-index="4"><text x="696" y="264" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">0</text></g><text x="580" y="219" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">输出 y：每格对应一个窗口</text><g data-window="output-convolution" transform="translate(435 230)"><rect width="58" height="58" fill="none" stroke="#b47936" stroke-width="3"/></g><g data-window-equation=""><rect x="55" y="324" width="850" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="358" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">y₀ = 1×1 + 1×0 + 2×(-1) = -1</text></g></g></svg>
