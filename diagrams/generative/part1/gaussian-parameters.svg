<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">网络输出分布参数，再从分布采样</title><desc id="desc">常用编码器输出 d 维均值 μφ(x) 与对数方差 sφ(x)，令标准差 σφ(x)=exp(sφ(x)/2)，从而保持方差为正。各维条件独立构成对角高斯近似。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">网络输出分布参数，再从分布采样</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="133" width="200" height="100" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="142" y="163" font-size="18" fill="#283b34" text-anchor="middle">输入 x</text><text x="142" y="188" font-size="14" fill="#63766c" text-anchor="middle">D 维</text><path d="M246 183 L294 183" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="298" y="133" width="239" height="100" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="417.5" y="163" font-size="18" fill="#283b34" text-anchor="middle">编码器</text><text x="417.5" y="188" font-size="14" fill="#63766c" text-anchor="middle">μ 与 log σ²</text><path d="M541 183 L589 183" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="593" y="133" width="325" height="100" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="755.5" y="163" font-size="18" fill="#283b34" text-anchor="middle">qφ(z|x)</text><text x="755.5" y="188" font-size="14" fill="#63766c" text-anchor="middle">d 维对角高斯</text><rect x="149" y="303" width="662" height="72" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="333" font-size="18" fill="#283b34" text-anchor="middle">σ = exp(log σ² / 2)</text><text x="480" y="358" font-size="14" fill="#63766c" text-anchor="middle">方差为 σ²；重参数化乘的是标准差 σ</text></g></svg>
