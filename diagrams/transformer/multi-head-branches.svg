<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="两头示例：分别计算关系"><title>两头示例：分别计算关系</title><desc>每个头在不同投影子空间独立计算；两组输出随后共同参与当前位置的表示。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">两头示例：分别计算关系</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">每个头独立投影和聚合</text><rect x="57" y="184" width="148" height="80" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="131" y="230" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">同一输入 X</text><path d="M205 224 L333 143" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="335" y="103" width="408" height="79" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="539" y="135.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">头 1：独立 Q、K、V</text><text x="539" y="163.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">打分 → Softmax → 加权和</text><path d="M743 142 L828 142" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="859" y="149" font-size="17" fill="#263f35" text-anchor="middle" font-weight="400">B1</text><path d="M205 224 L333 300" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="335" y="260" width="408" height="79" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="539" y="292.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">头 2：独立 Q、K、V</text><text x="539" y="320.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">打分 → Softmax → 加权和</text><path d="M743 299 L828 299" fill="none" stroke="#17665