<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">与目标帧真实颜色比较</title><desc id="desc">原彩色视频目标帧提供真值 cⱼ。颜色预测损失经加权汇总与匹配权重传回编码器，推动特征建立准确对应。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">与目标帧真实颜色比较</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="42" y="149" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="174" y="184" font-size="18" fill="#263f35" text-anchor="middle">编码器</text><text x="174" y="210" font-size="14" fill="#5d7469" text-anchor="middle">位置特征</text><path d="M306 190 L328 190" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="149" width="264" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="466" y="184" font-size="18" fill="#263f35" text-anchor="middle">匹配与复制</text><text x="466" y="210" font-size="14" fill="#5d7469" text-anchor="middle">预测 yj</text><path d="M598 190 L620 190" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="626" y="149" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="758" y="184" font-size="18" fill="#263f35" text-anchor="middle">颜色损失</text><text x="758" y="210" font-size="14" fill="#5d7469" text-anchor="middle">比较真值 cj</text><path d="M794 230 V310 H187 V234" fill="none" stroke="#ac4f53" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="344" font-size="18" fill="#ac4f53" text-anchor="middle">梯度：损失 → 复制 → 匹配 → 编码器</text></g></svg>
