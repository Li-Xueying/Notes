<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="编码器—解码器。变长源序列进入变长目标序列"><title>编码器—解码器</title><desc>变长源序列进入变长目标序列。编码器形成源表示，解码器根据源表示与目标前缀逐步输出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">编码器—解码器</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">变长源序列进入变长目标序列</text><rect x="45" y="145" width="88" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="89" y="171" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">je</text><rect x="150" y="145" width="88" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="194" y="171" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">suis</text><rect x="255" y="145" width="88" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="299" y="171" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">ici</text><path d="M343 166 L420 166" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="440" y="123" width="120" height="86" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="500" y="159" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">编码器</text><text x="500" y="184" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">source states</text><path d="M560 166 L638 166" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><text x="599" y="158" fill="#176653" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">context</text><rect x="658" y="123" width="120" height="86" rx="6" fill="#eaf1f4" stroke="#a8c2b4" stroke-width="1.4"/><text x="718" y="159" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">解码器</text><text x="718" y="184" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">autoregressive</text><path d="M778 166 L845 166" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="845" y="145" width="80" height="42" rx="5" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="885" y="171" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">I am …</text><path d="M885 187 C900 278 690 300 718 209" fill="none" stroke="#b47936" stroke-width="2" marker-end="url(#arrow-amber)"/><text x="793" y="307" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">已生成目标前缀回到下一步</text><rect x="220" y="322" width="520" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="353" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">变长源序列 → 变长目标序列</text></g></svg>
