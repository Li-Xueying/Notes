<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="为什么不能只堆叠线性层"><title>为什么不能只堆叠线性层</title><desc>连续的线性变换仍可以合并为一次线性变换 表达能力的关键变化来自中间的非线性。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="115" y="135" width="223.33333333333334" height="75" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="226.66666666666669" y="179.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="226.66666666666669" dy="0">x</tspan></text><path d="M340.33333333333337 172.5 L365.33333333333337 172.5" stroke="#176653" stroke-width="2" fill="none"/><path d="M357.3503790283198 176.65601257987333 L365.33333333333337 172.5 L357.3503790283198 168.34398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="368.33333333333337" y="135" width="223.33333333333334" height="75" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="480.00000000000006" y="179.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="480.00000000000006" dy="0">W<tspan baseline-shift="sub" font-size="72%">1</tspan>x + b<tspan baseline-shift="sub" font-size="72%">1</tspan></tspan></text><path d="M593.6666666666667 172.5 L618.6666666666667 172.5" stroke="#176653" stroke-width="2" fill="none"/><path d="M610.6837123616532 176.65601257987333 L618.6666666666667 172.5 L610.6837123616532 168.34398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="621.6666666666667" y="135" width="223.33333333333334" height="75" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="733.3333333333334" y="179.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="733.3333333333334" dy="0">W<tspan baseline-shift="sub" font-size="72%">2</tspan>h + b<tspan baseline-shift="sub" font-size="72%">2</tspan></tspan></text><path d="M480 230 L480 277" stroke="#176653" stroke-width="2" fill="none"/><path d="M475.84398742012667 269.01704569498645 L480 277 L484.15601257987333 269.01704569498645" fill="none" stroke="#176653" stroke-width="2"/><text x="480" y="244.5" fill="#176653" font-size="14" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">合并</tspan></text><rect x="210" y="301" width="540" height="74" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="480" y="345" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="480" dy="0">等效的一次线性变换 W′x + b′</tspan></text><text x="480" y="448" fill="#176653" font-size="18" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">W<tspan baseline-shift="sub" font-size="72%">2</tspan>(W<tspan baseline-shift="sub" font-size="72%">1</tspan>x + b<tspan baseline-shift="sub" font-size="72%">1</tspan>) + b<tspan baseline-shift="sub" font-size="72%">2</tspan> = (W<tspan baseline-shift="sub" font-size="72%">2</tspan>W<tspan baseline-shift="sub" font-size="72%">1</tspan>)x + (W<tspan baseline-shift="sub" font-size="72%">2</tspan>b<tspan baseline-shift="sub" font-size="72%">1</tspan> + b<tspan baseline-shift="sub" font-size="72%">2</tspan>)</tspan></text></g></svg>