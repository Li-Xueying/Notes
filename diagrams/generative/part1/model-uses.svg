<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">分布决定可做的事情</title><desc id="desc">判别模型用于标签预测与有标签特征学习；生成模型可以从无标签数据学结构、支持密度分析并采样新数据；条件生成模型则按指定标签或条件产生样本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">分布决定可做的事情</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="96" width="224" height="76" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="154" y="140" font-size="18" fill="#283b34" text-anchor="middle">判别模型</text><path d="M270 134 L326 134" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><text x="351" y="141" font-size="20" fill="#283b34" text-anchor="start">类别预测 / 有标签特征</text><rect x="42" y="199" width="224" height="76" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="154" y="243" font-size="18" fill="#283b34" text-anchor="middle">无条件生成</text><path d="M270 237 L326 237" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><text x="351" y="244" font-size="20" fill="#283b34" text-anchor="start">采样数据 / 无标签结构</text><rect x="42" y="302" width="224" height="76" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="154" y="346" font-size="18" fill="#283b34" text-anchor="middle">条件生成</text><path d="M270 340 L326 340" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><text x="351" y="347" font-size="20" fill="#283b34" text-anchor="start">指定条件下采样数据</text></g></svg>
