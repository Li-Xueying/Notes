<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">低温度令教师分布更有区分度</title><desc id="desc">锐化（sharpening）用低教师温度放大分数差异，降低均匀输出的倾向；学生温度更高。中心化与锐化作用需要平衡。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">低温度令教师分布更有区分度</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="53" y="153" width="363" height="72" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="234.5" y="183" font-size="18" fill="#263f35" text-anchor="middle">同一 logits：[2,1,0]</text><text x="234.5" y="209" font-size="14" fill="#5d7469" text-anchor="middle">温度 1 → 0.5</text><text x="694" y="125" font-size="17" fill="#263f35" text-anchor="middle">τ=0.5 的概率</text><rect x="530" y="165.3709602249277" width="75" height="171.6290397750723" rx="4" fill="#edf3f8" stroke="#426f91"/><text x="567" y="363" font-size="17" fill="#263f35" text-anchor="middle">0.867</text><text x="567" y="391" font-size="15" fill="#263f35" text-anchor="middle">原型 1</text><rect x="642" y="313.77253529041275" width="75" height="23.227464709587277" rx="4" fill="#edf3f8" stroke="#426f91"/><text x="679" y="363" font-size="17" fill="#263f35" text-anchor="middle">0.117</text><text x="679" y="391" font-size="15" fill="#263f35" text-anchor="middle">原型 2</text><rect x="754" y="333.8565044846596" width="75" height="3.1434955153404194" rx="4" fill="#edf3f8" stroke="#426f91"/><text x="791" y="363" font-size="17" fill="#263f35" text-anchor="middle">0.016</text><text x="791" y="391" font-size="15" fill="#263f35" text-anchor="middle">原型 3</text><text x="233" y="294" font-size="18" fill="#176653" text-anchor="middle">低温度放大概率差异</text></g></svg>
