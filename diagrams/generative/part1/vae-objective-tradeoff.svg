<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">辨别样本的能力与潜空间约束</title><desc id="desc">重建倾向保留不同输入的差异，并可能偏好较小的潜变量噪声；先验 KL 倾向让均值靠近零、标准差靠近一。完整目标需要兼顾两者。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">辨别样本的能力与潜空间约束</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="50" y="137" width="405" height="131" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="252.5" y="167" font-size="18" fill="#283b34" text-anchor="middle">重建项的倾向</text><text x="252.5" y="192" font-size="14" fill="#63766c" text-anchor="middle">保留不同输入的差异</text><text x="252.5" y="215" font-size="14" fill="#63766c" text-anchor="middle">需要 z 携带可解码的信息</text><rect x="505" y="137" width="405" height="131" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="707.5" y="167" font-size="18" fill="#283b34" text-anchor="middle">先验 KL 的倾向</text><text x="707.5" y="192" font-size="14" fill="#63766c" text-anchor="middle">μ 靠近 0，σ 靠近 1</text><text x="707.5" y="215" font-size="14" fill="#63766c" text-anchor="middle">约束编码分布偏离先验</text><rect x="141" y="316" width="678" height="62" rx="4" fill="#f9e7e3" stroke="#ccdbd2"/><text x="480" y="353" font-size="18" fill="#283b34" text-anchor="middle">平衡两项；任一极端都可能损失重要能力</text></g></svg>
