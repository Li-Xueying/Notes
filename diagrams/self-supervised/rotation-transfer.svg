<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">从旋转角度迁移到鸟类别</title><desc id="desc">先从大量未标注图像构造旋转标签，训练特征提取器；随后连接浅层分类器，用少量带标签目标数据学习鸟类别。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">从旋转角度迁移到鸟类别</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="42" y="132" width="410" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="247" y="167" font-size="18" fill="#263f35" text-anchor="middle">未标注图像</text><text x="247" y="193" font-size="14" fill="#5d7469" text-anchor="middle">施加旋转</text><path d="M452 173 L474 173" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="132" width="410" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="685" y="167" font-size="18" fill="#263f35" text-anchor="middle">预训练编码器</text><text x="685" y="193" font-size="14" fill="#5d7469" text-anchor="middle">预测 90° 等角度</text><path d="M658 213 V245 H380 V278" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="42" y="279" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="174" y="314" font-size="18" fill="#263f35" text-anchor="middle">目标图像</text><text x="174" y="340" font-size="14" fill="#5d7469" text-anchor="middle">少量鸟类别标签</text><path d="M306 320 L328 320" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="279" width="264" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="466" y="314" font-size="18" fill="#263f35" text-anchor="middle">编码器 + 线性头</text><text x="466" y="340" font-size="14" fill="#5d7469" text-anchor="middle">输出鸟类别</text><path d="M598 320 L620 320" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="626" y="279" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="758" y="314" font-size="18" fill="#263f35" text-anchor="middle">目标评价</text><text x="758" y="340" font-size="14" fill="#5d7469" text-anchor="middle">独立数据</text></g></svg>
