<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">从简单噪声产生新样本</title><desc id="desc">已知真实样本 x 来自数据分布 pdata，希望生成器产生相同分布的新样本。先从简单先验 p(z) 抽取潜变量，例如标准高斯，再经过神经网络 Gθ 得到假样本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">从简单噪声产生新样本</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="126" width="122" height="75" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="103" y="155" font-size="18" fill="#283b34" text-anchor="middle">噪声 z</text><text x="103" y="180" font-size="14" fill="#63766c" text-anchor="middle">简单先验</text><path d="M168 164 L204 164" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="208" y="126" width="150" height="75" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="283" y="155" font-size="18" fill="#283b34" text-anchor="middle">生成器 G</text><text x="283" y="180" font-size="14" fill="#63766c" text-anchor="middle">参数 θ</text><path d="M362 164 L398 164" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="402" y="126" width="164" height="75" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="484" y="155" font-size="18" fill="#283b34" text-anchor="middle">假样本 G(z)</text><text x="484" y="180" font-size="14" fill="#63766c" text-anchor="middle">由 G 定义 pG</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">从先验取样后，一次前向得到生成样本</text></g></svg>
