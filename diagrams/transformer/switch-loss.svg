<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="Switch 的辅助损失有两种统计量"><title>Switch 的辅助损失有两种统计量</title><desc>fᵢ 是实际分配比例，pᵢ 是平均路由概率；不同统计量共同构成求和后的辅助损失。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">Switch 的辅助损失有两种统计量</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">实际比例 fᵢ 与平均概率 pᵢ</text><text x="72" y="161" font-size="16" fill="#263f35" text-anchor="start" font-weight="400">实际 token 数</text><rect x="243" y="129" width="211.33333333333334" height="52" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="348.6666666666667" y="161" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">3</text><rect x="466.33333333333337" y="129" width="211.33333333333334" height="52" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="572" y="161" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">1</text><rect x="689.6666666666667" y="129" width="211.33333333333334" height="52" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="795.3333333333334" y="161" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">2</text><text x="72" y="248" font-size="16" fill="#263f35" text-anchor="start" font-weight="400">比例 fᵢ</text><rect x="243" y="216" width="211.33333333333334" height="52" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="348.6666666666667" y="248" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">3/6</text><rect x="466.33333333333337" y="216" width="211.33333333333334" height="52" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="572" y="248" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">1/6</text><rect x="689.6666666666667" y="216" width="211.33333333333334" height="52" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="795.3333333333334" y="248" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">2/6</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">Laux = α E ∑ᵢ fᵢpᵢ；pᵢ 是批内平均路由概率</text></g></svg>
