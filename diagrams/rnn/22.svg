<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="裁剪与记忆通路。过大梯度与长期保留需要不同方案"><title>裁剪与记忆通路</title><desc>过大梯度与长期保留需要不同方案。梯度裁剪控制更新幅度；加性、受控的状态路径帮助保留长期信息。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">裁剪与记忆通路</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">过大梯度与长期保留需要不同方案</text><rect x="55" y="116" width="390" height="188" rx="6" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.4"/><text x="250" y="203" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">爆炸梯度</text><text x="250" y="228" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">限制更新幅度</text><rect x="105" y="203" width="290" height="32" rx="16" fill="#b47936" stroke="#b47936" stroke-width="1.4"/><text x="250" y="224" fill="#ffffff" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">gradient clipping</text><rect x="515" y="116" width="390" height="188" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="710" y="203" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">长期信息难保留</text><text x="710" y="228" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">改变状态传递结构</text><rect x="565" y="187" width="290" height="32" rx="16" fill="#176653" stroke="#176653" stroke-width="1.4"/><text x="710" y="208" fill="#ffffff" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">加性记忆路径</text><rect x="565" y="231" width="290" height="32" rx="16" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="710" y="252" fill="#176653" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">门控读 / 写 / 保留</text><rect x="130" y="322" width="700" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="353" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">裁剪处理“过大”；门控记忆处理“保留”。</text></g></svg>
