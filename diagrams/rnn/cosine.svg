<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="怎样比较两个词向量"><title>怎样比较两个词向量</title><desc>内积除以两个向量的长度：同向为 1，正交为 0，反向为 −1。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">怎样比较两个词向量</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">余弦相似度比较方向</text><path d="M250 285 L640 285" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><path d="M250 285 L530 130" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="654" y="291" font-size="17" fill="#263f35" text-anchor="middle" font-weight="400">u</text><text x="541" y="125" font-size="17" fill="#263f35" text-anchor="middle" font-weight="400">v</text><text x="348" y="264" font-size="17" fill="#263f35" text-anchor="middle" font-weight="400">θ</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">cos(u,v) = uᵀv / (‖u‖₂ ‖v‖₂)</text></g></svg>
