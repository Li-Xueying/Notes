<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">取对数，把乘积变为求和</title><desc id="desc">多个小概率相乘容易造成数值下溢。对数是严格单调递增函数，最大化似然等价于最大化对数似然，乘积由此变为和。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">取对数，把乘积变为求和</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="93" y="133" width="774" height="76" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="480" y="163" font-size="18" fill="#283b34" text-anchor="middle">pθ(x⁽¹⁾) × pθ(x⁽²⁾) × … × pθ(x⁽ᴺ⁾)</text><text x="480" y="188" font-size="14" fill="#63766c" text-anchor="middle">概率乘积</text><path d="M480 214 L480 264" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="93" y="270" width="774" height="76" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="300" font-size="18" fill="#283b34" text-anchor="middle">log pθ(x⁽¹⁾) + log pθ(x⁽²⁾) + … + log pθ(x⁽ᴺ⁾)</text><text x="480" y="325" font-size="14" fill="#63766c" text-anchor="middle">对数和：保持最优参数</text><text x="587" y="249" font-size="17" fill="#2f7253" text-anchor="middle">单调 log</text></g></svg>
