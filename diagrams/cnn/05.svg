<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="MLP 的参数规模"><title>MLP 的参数规模</title><desc>32×32 RGB 已接近 2100 万参数</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">MLP 的参数规模</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">32×32 RGB 已接近 2100 万参数</text><rect x="55" y="126" width="199" height="92" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="154.5" y="165" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">3072 输入</text><text x="154.5" y="191" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">32×32×3</text><path d="M254 172 L269 172" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="272" y="126" width="199" height="92" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="371.5" y="165" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">4096 隐藏</text><text x="371.5" y="191" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">12.6M</text><path d="M471 172 L486 172" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="489" y="126" width="199" height="92" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="588.5" y="165" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">2048 隐藏</text><text x="588.5" y="191" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">8.4M</text><path d="M688 172 L703 172" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="706" y="126" width="199" height="92" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="805.5" y="165" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">10 输出</text><text x="805.5" y="191" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">20.5k</text><rect x="50" y="291" width="860" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="325" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">(3072+1)×4096 + (4096+1)×2048 + (2048+1)×10 = 20,998,154 ≈ 21M</text></g></svg>
