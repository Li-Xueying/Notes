<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="多通道卷积"><title>多通道卷积</title><desc>跨输入通道求和，多组核产生多个输出通道</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">多通道卷积</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">跨输入通道求和，多组核产生多个输出通道</text><rect x="70" y="135" width="145" height="135" rx="7" fill="#ffffff" stroke="#a75d52" stroke-width="1.5"/><text x="88" y="158" fill="#a75d52" font-size="15" font-weight="700" text-anchor="middle" font-family="sans-serif">R</text><rect x="92" y="123" width="145" height="135" rx="7" fill="#ffffff" stroke="#4f8b75" stroke-width="1.5"/><text x="110" y="146" fill="#4f8b75" font-size="15" font-weight="700" text-anchor="middle" font-family="sans-serif">G</text><rect x="114" y="111" width="145" height="135" rx="7" fill="#ffffff" stroke="#547a8a" stroke-width="1.5"/><text x="132" y="134" fill="#547a8a" font-size="15" font-weight="700" text-anchor="middle" font-family="sans-serif">B</text><path d="M248 196 L345 196" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="360" y="153" width="120" height="100" rx="7" fill="#f6faf7" stroke="#a75d52" stroke-width="1.5"/><text x="378" y="176" fill="#a75d52" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">Kᴿ</text><rect x="378" y="143" width="120" height="100" rx="7" fill="#f6faf7" stroke="#4f8b75" stroke-width="1.5"/><text x="396" y="166" fill="#4f8b75" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">Kᴳ</text><rect x="396" y="133" width="120" height="100" rx="7" fill="#f6faf7" stroke="#547a8a" stroke-width="1.5"/><text x="414" y="156" fill="#547a8a" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">Kᴮ</text><path d="M516 196 L610 196" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><text x="563" y="187" fill="#176653" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">通道求和</text><rect x="630" y="143" width="110" height="110" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="685" y="191" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">输出 1</text><text x="685" y="217" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">一个特征图</text><rect x="785" y="143" width="110" height="110" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="840" y="191" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">输出 Cₒᵤₜ</text><text x="840" y="217" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">多组核</text><rect x="220" y="319" width="520" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="353" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">K ∈ R^(Cout × Cin × Kh × Kw)</text></g></svg>
