<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">第四步：对 qφ(z|x) 取期望</title><desc id="desc">固定 x 时，log pθ(x) 是关于 z 的常数。因 qφ(z|x) 归一化，可以在等式两侧对它取期望，并用期望的线性性拆开右侧三项。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">第四步：对 qφ(z|x) 取期望</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="55" y="133" width="365" height="89" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="237.5" y="163" font-size="18" fill="#283b34" text-anchor="middle">左侧：log pθ(x)</text><text x="237.5" y="188" font-size="14" fill="#63766c" text-anchor="middle">固定 x 后不依赖 z</text><rect x="525" y="133" width="380" height="89" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="715" y="163" font-size="18" fill="#283b34" text-anchor="middle">右侧：三个含 z 的项</text><text x="715" y="188" font-size="14" fill="#63766c" text-anchor="middle">对同一个 qφ(z|x) 取期望</text><path d="M424 178 L520 178" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="174" y="294" width="612" height="79" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="324" font-size="18" fill="#283b34" text-anchor="middle">期望线性性保持等式</text><text x="480" y="349" font-size="14" fill="#63766c" text-anchor="middle">左侧常数不变，右侧分成三个期望</text></g></svg>
