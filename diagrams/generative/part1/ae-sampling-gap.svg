<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">新潜变量从哪里来</title><desc id="desc">普通自编码器学会了训练数据到潜表示的映射，却没有规定这些表示服从哪一个已知分布。随意取 z，可能落到解码器没有学好的区域。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">新潜变量从哪里来</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="49" y="153" width="235" height="86" rx="4" fill="#f9e7e3" stroke="#ccdbd2"/><text x="166.5" y="183" font-size="18" fill="#283b34" text-anchor="middle">新潜变量 z</text><text x="166.5" y="208" font-size="14" fill="#63766c" text-anchor="middle">从哪里抽样？</text><path d="M288 197 L346 197" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="153" width="235" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="467.5" y="183" font-size="18" fill="#283b34" text-anchor="middle">已有解码器</text><text x="467.5" y="208" font-size="14" fill="#63766c" text-anchor="middle">只学过训练表示</text><path d="M589 197 L647 197" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="651" y="153" width="262" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="782" y="183" font-size="18" fill="#283b34" text-anchor="middle">新数据 x</text><text x="782" y="208" font-size="14" fill="#63766c" text-anchor="middle">随意 z 不保证合理</text><text x="480" y="405" font-size="17" fill="#63766c" text-anchor="middle">为 z 建立简单可采样的先验，才有明确的生成起点</text></g></svg>
