<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">恰好执行 T 次更新，返回 x₀</title><desc id="desc">从 k=T 递减到 1，每次使用 t=k/T 求速度并更新一次，最后恰好到 t=0。整个采样循环在关闭梯度的环境下执行，训练网络参数保持固定。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">恰好执行 T 次更新，返回 x₀</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">初始化</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">x₁ ~ pnoise</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">T 次迭代</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">k=T,…,1</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">返回</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">x₀</text><rect x="163" y="309" width="634" height="65" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="338" font-size="18" fill="#283b34" text-anchor="middle">训练：随机时刻；生成：顺序依赖</text><text x="480" y="363" font-size="14" fill="#63766c" text-anchor="middle">每一步都在更新后的状态重新求速度</text></g></svg>
