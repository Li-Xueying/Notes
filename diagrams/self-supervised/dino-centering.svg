<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">中心化抑制单一原型主导</title><desc id="desc">中心化（centering）维护教师原型分数的逐维 EMA。减去中心 c 降低某一原型长期占主导的倾向，c 是向量而非单一标量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">中心化抑制单一原型主导</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="42" y="170" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="174" y="205" font-size="18" fill="#263f35" text-anchor="middle">教师 logits zt</text><text x="174" y="231" font-size="14" fill="#5d7469" text-anchor="middle">K 维分数</text><path d="M306 211 L328 211" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="170" width="264" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="466" y="205" font-size="18" fill="#263f35" text-anchor="middle">减中心 c</text><text x="466" y="231" font-size="14" fill="#5d7469" text-anchor="middle">逐维 EMA</text><path d="M598 211 L620 211" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="626" y="170" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="758" y="205" font-size="18" fill="#263f35" text-anchor="middle">除温度 τt</text><text x="758" y="231" font-size="14" fill="#5d7469" text-anchor="middle">Softmax</text><rect x="42" y="362" width="876" height="48" rx="4" fill="#f5f9f6" stroke="#d7e5dc"/><text x="480" y="393" font-size="18" fill="#176653" text-anchor="middle">中心来自 logits 批均值，c 与 zt 维度相同</text></g></svg>
