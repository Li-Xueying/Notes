<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="拼接各头，再做输出投影"><title>拼接各头，再做输出投影</title><desc>先拼接各头，再投影回 D 维；头数增加不代表每头必须对应预先命名的语言关系。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">拼接各头，再做输出投影</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">Concat(head₁,…,headₕ)Wᴼ</text><rect x="57" y="110" width="220" height="67" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="167" y="136.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">head₁</text><text x="167" y="164.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">N × dᵥ</text><rect x="57" y="266" width="220" height="67" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="167" y="292.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">head₂</text><text x="167" y="320.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">N × dᵥ</text><path d="M277 143 L417 198" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><path d="M277 298 L417 244" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="176" width="199" height="91" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="519.5" y="214.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">拼接</text><text x="519.5" y="242.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">N × 2dᵥ</text><path d="M619 222 L707 222" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="709" y="176" width="204" height="91" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="811" y="214.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">输出投影 Wᴼ</text><text x="811" y="242.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">N × D</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">MultiHead = Concat(head₁,…,headₕ) Wᴼ</text></g></svg>
