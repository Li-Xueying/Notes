<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="CBOW 与 Skip-gram。同一窗口，两种预测方向"><title>CBOW 与 Skip-gram</title><desc>同一窗口，两种预测方向。CBOW 用上下文预测中心词，Skip-gram 用中心词预测上下文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">CBOW 与 Skip-gram</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">同一窗口，两种预测方向</text><rect x="70" y="117" width="360" height="174" rx="6" fill="#eaf1f4" stroke="#a8c2b4" stroke-width="1.4"/><text x="250" y="197" fill="#263f35" font-size="21" font-weight="650" text-anchor="middle" font-family="sans-serif">CBOW</text><text x="250" y="222" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">context → center</text><rect x="95" y="191" width="92" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="141" y="217" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">turning</text><rect x="197" y="191" width="76" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="235" y="217" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">into</text><path d="M283 212 L343 212" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="343" y="191" width="98" height="42" rx="5" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="392" y="217" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">banking</text><rect x="530" y="117" width="360" height="174" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="710" y="197" fill="#263f35" font-size="21" font-weight="650" text-anchor="middle" font-family="sans-serif">Skip-gram</text><text x="710" y="222" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">center → context</text><rect x="560" y="191" width="98" height="42" rx="5" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="609" y="217" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">banking</text><path d="M658 212 L718 212" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="718" y="191" width="82" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="759" y="217" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">crises</text><rect x="220" y="317" width="520" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="348" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">同一窗口，预测方向相反。</text></g></svg>
