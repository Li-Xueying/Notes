<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">平方误差的最优解是条件平均速度</title><desc id="desc">多条训练直线可以穿过同一个 xt，但对应的 z−x 不同。面对相同输入，确定性网络只能给一个预测；平方误差最小的选择是这些目标在条件分布下的平均。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">平方误差的最优解是条件平均速度</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="128" width="396" height="111" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="240" y="157" font-size="18" fill="#283b34" text-anchor="middle">同一个中间状态</text><text x="240" y="182" font-size="14" fill="#63766c" text-anchor="middle">可能来自多个 (x,z) 配对</text><rect x="42" y="285" width="396" height="71" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="240" y="326.5" font-size="18" fill="#283b34" text-anchor="middle">最优预测 = 条件平均速度</text><path d="M550 329 L840 155" fill="none" stroke="#ab4d42" stroke-width="2" marker-end="url(#arrow)"/><path d="M612 359 L778 125" fill="none" stroke="#306b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M847 319 L543 165" fill="none" stroke="#9a701c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="695" cy="242" r="11" fill="#2f7253"/><text x="695" y="274" font-size="17" fill="#283b34" text-anchor="middle">xₜ=u</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">只对能够产生这个 u、t 的配对求平均</text></g></svg>
