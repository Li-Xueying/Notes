<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="训练与推理看到的历史不同"><title>训练与推理看到的历史不同</title><desc>真实历史与模型生成历史可能产生分布差异 Scheduled Sampling 讨论两类历史的使用方式；具体训练规则需明确。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="60" y="162" width="260" height="80" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="190" y="209" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="190" dy="0">真实历史 y&lt;t</tspan></text><path d="M322 202 L347 202" stroke="#176653" stroke-width="2" fill="none"/><path d="M339.01704569498645 206.15601257987333 L347 202 L339.01704569498645 197.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="350" y="162" width="260" height="80" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="480" y="209" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="480" dy="0">历史输入选择</tspan></text><path d="M612 202 L637 202" stroke="#176653" stroke-width="2" fill="none"/><path d="M629.0170456949865 206.15601257987333 L637 202 L629.0170456949865 197.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="640" y="162" width="260" height="80" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="770" y="209" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="770" dy="0">解码预测</tspan></text><rect x="361" y="341" width="238" height="78" rx="9" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="480" y="369" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="480" dy="0">模型生成历史 ŷ&lt;t</tspan></text><text x="480" y="398" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">训练策略决定混合方式</tspan></text><path d="M480 336 L480 247" stroke="#b47936" stroke-width="2" fill="none"/><path d="M484.15601257987333 254.98295430501355 L480 247 L475.84398742012667 254.98295430501355" f