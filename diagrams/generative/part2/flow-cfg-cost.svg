<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">无需额外分类器，通常需要两支网络评估</title><desc id="desc">早期分类器引导使用额外的含噪分类器及其对输入的梯度。CFG 利用生成网络自己的有条件与无条件预测，省去独立分类器。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">无需额外分类器，通常需要两支网络评估</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">有条件评估</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">同一 xₜ,t</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">无条件评估</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">同一网络</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">速度组合</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">沿组合方向积分</text><rect x="181" y="314" width="598" height="64" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="343" font-size="18" fill="#283b34" text-anchor="middle">通常约两倍网络计算，无额外分类器</text><text x="480" y="368" font-size="14" fill="#63766c" text-anchor="middle">合批可影响实际时延</text></g></svg>
