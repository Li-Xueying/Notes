<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">随机丢弃条件，训练同一网络的两种能力</title><desc id="desc">训练时以一定概率将 y 替换为空条件 ∅，其余时候保留真实条件。xt 与速度监督不变，同一个网络由此既能作条件预测，也能作无条件预测。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">随机丢弃条件，训练同一网络的两种能力</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="70" y="132" width="272" height="101" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="206" y="161" font-size="18" fill="#283b34" text-anchor="middle">训练数据 (x,y)</text><text x="206" y="186" font-size="14" fill="#63766c" text-anchor="middle">速度目标 z−x</text><path d="M346 182 H421 V126 H491" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><path d="M421 182 V299 H491" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="88" width="387" height="91" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="688.5" y="117" font-size="18" fill="#283b34" text-anchor="middle">保留 y</text><text x="688.5" y="142" font-size="14" fill="#63766c" text-anchor="middle">条件预测 fθ(xₜ,t,y)</text><rect x="495" y="260" width="387" height="91" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="688.5" y="289" font-size="18" fill="#283b34" text-anchor="middle">替换为空条件 ∅</text><text x="688.5" y="314" font-size="14" fill="#63766c" text-anchor="middle">无条件预测 fθ(xₜ,t,∅)</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">只改变条件输入；数据、噪声、时间与目标身份不变</text></g></svg>
