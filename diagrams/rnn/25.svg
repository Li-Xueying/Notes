<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="遗忘旧信息。遗忘门逐元素缩放旧细胞状态"><title>遗忘旧信息</title><desc>遗忘门逐元素缩放旧细胞状态。门值越接近 1 保留越多，越接近 0 擦除越多。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">遗忘旧信息</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">遗忘门逐元素缩放旧细胞状态</text><path d="M65 175 L375 175" fill="none" stroke="#b47936" stroke-width="5"/><circle cx="450" cy="175" r="30" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="450" y="184" fill="#b47936" font-size="27" font-weight="700" text-anchor="middle" font-family="sans-serif">⊙</text><path d="M375 175 L420 175" fill="none" stroke="#b47936" stroke-width="2.1" marker-end="url(#arrow-amber)"/><path d="M480 175 L865 175" fill="none" stroke="#b47936" stroke-width="2.1" marker-end="url(#arrow-amber)"/><rect x="260" y="245" width="380" height="66" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="450" y="271" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">f_t = σ(W_f[h_(t−1);x_t] + b_f)</text><text x="450" y="296" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">每个分量位于 (0,1)</text><path d="M450 245 L450 205" fill="none" stroke="#b47936" stroke-width="2.1" marker-end="url(#arrow-amber)"/><text x="67" y="154" fill="#b47936" font-size="14" font-weight="400" text-anchor="start" font-family="sans-serif">c_(t−1)</text><text x="862" y="154" fill="#b47936" font-size="14" font-weight="400" text-anchor="end" font-family="sans-serif">保留后的旧记忆</text></g></svg>
