<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="平移等变"><title>平移等变</title><desc>输入移动，响应随之移动；旋转不具备同样保证</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">平移等变</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">输入移动，响应随之移动；旋转不具备同样保证</text><rect x="65" y="120" width="180" height="115" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="155" y="170.5" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">输入 X</text><text x="155" y="196.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">目标在左侧</text><path d="M245 178 L335 178" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><text x="290" y="169" fill="#176653" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">卷积 f</text><rect x="350" y="120" width="180" height="115" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="440" y="170.5" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">响应 f(X)</text><text x="440" y="196.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">峰值在左侧</text><path d="M155 263 L155 300" stroke="#b47936" stroke-width="2" fill="none"/><path d="M155 300 L375 300" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><text x="265" y="291" fill="#176653" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">平移 TΔ</text><rect x="615" y="120" width="280" height="115" rx="7" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="755" y="170.5" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">旋转对照</text><text x="755" y="196.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">普通卷积的响应关系会改变</text><rect x="80" y="322" width="800" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="356" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">f(TΔX) = TΔf(X)     （边界与离散采样会产生偏差）</text></g></svg>
