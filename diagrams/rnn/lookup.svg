<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="从嵌入表取出一个词"><title>从嵌入表取出一个词</title><desc>保留三维示例中的数值；示意坐标本身不保证 hotel 与 motel 接近。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">从嵌入表取出一个词</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">独热选择与查表是同一计算</text><text x="80" y="115" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">motel        [0.234, -0.567, 0.891]</text><text x="80" y="162" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">hotel        [-0.123, 0.456, -0.789]</text><text x="80" y="209" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">conference   [0.678, -0.234, 0.345]</text><text x="80" y="256" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">词表第 4 行     [−0.456, 0.789, −0.123]</text><text x="80" y="303" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">词表第 5 行     [0.567, −0.891, 0.234]</text><rect x="48" y="345" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="377" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">E ∈ ℝ^(|V|×d)      e_w = Eᵀx_w：选出第 w 行</text></g></svg>
