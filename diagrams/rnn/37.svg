<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="如何评价翻译。BLEU 便于比较，但不等同于完整质量"><title>如何评价翻译</title><desc>BLEU 便于比较，但不等同于完整质量。自动指标要与语义忠实、流畅度、偏差、安全和领域约束一起检查。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">如何评价翻译</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">BLEU 便于比较，但不等同于完整质量</text><rect x="55" y="108" width="260" height="210" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="185" y="218" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">BLEU 能检查</text><text x="92" y="180" fill="#176653" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">n-gram 重合</text><text x="92" y="216" fill="#176653" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">简短惩罚</text><text x="92" y="252" fill="#176653" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">固定集合快速比较</text><rect x="350" y="108" width="260" height="210" rx="6" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.4"/><text x="480" y="218" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">BLEU 不能单独保证</text><text x="387" y="180" fill="#b47936" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">语义忠实</text><text x="387" y="216" fill="#b47936" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">自然流畅</text><text x="387" y="252" fill="#b47936" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">事实与安全</text><rect x="645" y="108" width="260" height="210" rx="6" fill="#eaf1f4" stroke="#a8c2b4" stroke-width="1.4"/><text x="775" y="218" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">系统仍需面对</text><text x="682" y="180" fill="#547a8a" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">低资源 / 领域偏移</text><text x="682" y="216" fill="#547a8a" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">长上下文 / 习语</text><text x="682" y="252" fill="#547a8a" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">数据偏差 / 异常输出</text></g></svg>
