<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">三个问题串起自监督学习</title><desc id="desc">传统任务用空间、变换、通道和时间；MAE 预测像素；SimCLR/MoCo 比较正负视图；DINO 匹配教师分布。它们都留下编码器与表征。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">三个问题串起自监督学习</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="42" y="162" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="174" y="197" font-size="18" fill="#263f35" text-anchor="middle">产生监督</text><text x="174" y="223" font-size="14" fill="#5d7469" text-anchor="middle">任务 / 视图 / 教师</text><path d="M306 203 L328 203" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="162" width="264" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="466" y="197" font-size="18" fill="#263f35" text-anchor="middle">保留表征</text><text x="466" y="223" font-size="14" fill="#5d7469" text-anchor="middle">编码器</text><path d="M598 203 L620 203" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="626" y="162" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="758" y="197" font-size="18" fill="#263f35" text-anchor="middle">检验用途</text><text x="758" y="223" font-size="14" fill="#5d7469" text-anchor="middle">冻结 / 微调 / 迁移</text><rect x="42" y="362" width="876" height="48" rx="4" fill="#f5f9f6" stroke="#d7e5dc"/><text x="480" y="393" font-size="18" fill="#176653" text-anchor="middle">输入输出、标签来源、更新范围、评价条件</text></g></svg>
