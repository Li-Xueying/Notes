<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="完整的模型工程流程"><title>完整的模型工程流程</title><desc>从数据到训练、评价，再应用到新的样本 先明确如何获得评价结果，再选择与任务相匹配的性能度量。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="80" y="136" width="246.66666666666666" height="86" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="203.33333333333331" y="164" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="203.33333333333331" dy="0">训练样本</tspan></text><text x="203.33333333333331" y="193" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="203.33333333333331" dy="0">输入与标签</tspan></text><path d="M328.66666666666663 179 L353.66666666666663 179" stroke="#176653" stroke-width="2" fill="none"/><path d="M345.6837123616531 183.15601257987333 L353.66666666666663 179 L345.6837123616531 174.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="356.66666666666663" y="136" width="246.66666666666666" height="86" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="479.99999999999994" y="164" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="479.99999999999994" dy="0">模型预测</tspan></text><text x="479.99999999999994" y="193" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="479.99999999999994" dy="0">前向传播</tspan></text><path d="M605.3333333333333 179 L630.3333333333333 179" stroke="#176653" stroke-width="2" fill="none"/><path d="M622.3503790283197 183.15601257987333 L630.3333333333333 179 L622.3503790283197 174.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="633.3333333333333" y="136" width="246.66666666666666" height="86" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="756.6666666666666" y="164" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="756.6666666666666" dy="0">计算损失</tspan></text><text x="756.66