idth="46" height="46" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="578" y="168" fill="#263f35" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">g00</text><rect x="601" y="140" width="46" height="46" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="624" y="168" fill="#263f35" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">g01</text><rect x="555" y="186" width="46" height="46" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="578" y="214" fill="#263f35" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">g10</text><rect x="601" y="186" width="46" height="46" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="624" y="214" fill="#263f35" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">g11</text><text x="601" y="129" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">全部输出梯度</text><path d="M430 193 L520 193" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="750" y="135" width="150" height="110" rx="7" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="825" y="183" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">四条路径累加</text><text x="825" y="209" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">共享参数的链式法则</text><rect x="60" y="324" width="840" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="358" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">∂L/∂K₀₀ = G₀₀X₀₀ + G₀₁X₀₁ + G₁₀X₁₀ + G₁₁X₁₁</text></g></svg>
