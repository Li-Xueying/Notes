<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="RNNs and LSTMs。从词向量到带注意力的序列生成"><title>RNNs and LSTMs</title><desc>从词向量到带注意力的序列生成。本讲沿一条完整计算链，从离散词语进入递归状态、门控记忆与条件序列生成。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">RNNs and LSTMs</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">从词向量到带注意力的序列生成</text><rect x="50" y="142" width="204.5" height="102" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="152.25" y="186" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">词表示</text><text x="152.25" y="211" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">离散符号 → 向量</text><path d="M254.5 193 L265.5 193" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="268.5" y="142" width="204.5" height="102" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="370.75" y="186" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">RNN</text><text x="370.75" y="211" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">历史 → 隐藏状态</text><path d="M473 193 L484 193" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="487" y="142" width="204.5" height="102" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="589.25" y="186" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">LSTM</text><text x="589.25" y="211" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">受控长期记忆</text><path d="M691.5 193 L702.5 193" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="705.5" y="142" width="204.5" height="102" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="807.75" y="186" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">Seq2Seq</text><text x="807.75" y="211" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">条件序列生成</text><rect x="130" y="308" width="700" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="339" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">representation → recurrence → memory → generation</text></g></svg>
