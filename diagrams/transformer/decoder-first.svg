<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="从 START 生成第一个字"><title>从 START 生成第一个字</title><desc>分布覆盖整个词表，已列出的 0.8 与 0.1 之外仍有其他候选；这里使用最大概率选择。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">从 START 生成第一个字</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">分布示例：深 0.8；习 0.1</text><rect x="70" y="213" width="170" height="71" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="155" y="241.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">START / BOS</text><text x="155" y="269.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">开始前缀</text><path d="M240 248 L319 248" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="321" y="206" width="238" height="84" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="440" y="241" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Decoder</text><text x="440" y="269" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">读取源输入条件</text><path d="M559 248 L628 248" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="119" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">学：0.0</text><text x="650" y="167" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">深：0.8  ← 最大项</text><text x="650" y="215" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">度：0.0</text><text x="650" y="263" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">习：0.1</text><text x="650" y="311" font-size="18" fi