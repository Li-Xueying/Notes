<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="独热向量：一个词占一个位置"><title>独热向量：一个词占一个位置</title><desc>词表可以超过 50 万项。独热表示既高维稀疏，也没有把语义关系编码进距离。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">独热向量：一个词占一个位置</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">索引不同，向量内积仍为 0</text><text x="80" y="137" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">hotel：索引 8 → [0,…,1,…,0]</text><text x="80" y="184" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">motel：索引 11 → [0,…,1,…,0]</text><text x="80" y="231" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">conference：索引 2 → [0,1,0,…,0]</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">不同词的独热向量内积为 0；语义相近也不例外</text></g></svg>
