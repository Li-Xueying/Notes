<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="MNIST 与参数量对比"><title>MNIST 与参数量对比</title><desc>同一十分类任务，不同连接方式</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">MNIST 与参数量对比</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">同一十分类任务，不同连接方式</text><rect x="70" y="118" width="350" height="172" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="245" y="197" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">全连接方案</text><text x="245" y="223" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">展平 → 隐藏层 → 10 类</text><text x="245" y="250" fill="#b47936" font-size="28" font-weight="650" text-anchor="middle" font-family="sans-serif">≈ 101k 参数</text><rect x="540" y="118" width="350" height="172" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="715" y="197" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">卷积方案</text><text x="715" y="223" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">卷积 → 池化 → 分类头</text><text x="715" y="250" fill="#176653" font-size="28" font-weight="650" text-anchor="middle" font-family="sans-serif">≈ 3k 参数</text><rect x="155" y="319" width="650" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="353" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">比较时必须使用同一输入与输出任务。</text></g></svg>
