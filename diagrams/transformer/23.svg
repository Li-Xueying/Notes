<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="从概率分布中选择输出"><title>从概率分布中选择输出</title><desc>贪心选择与随机采样采用不同决策规则 概率为演示数据；采样并不总是选择概率最大的 token。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="91" y="174.5" width="75" height="220.5" rx="5" fill="#176653"/><text x="128" y="425" fill="#263f35" font-size="17" font-weight="400" text-anchor="middle"><tspan x="128" dy="0">词 A</tspan></text><text x="128" y="159.5" fill="#176653" font-size="17" font-weight="400" text-anchor="middle"><tspan x="128" dy="0">0.45</tspan></text><rect x="223" y="248" width="75" height="147" rx="5" fill="#a8c2b4"/><text x="260" y="425" fill="#263f35" font-size="17" font-weight="400" text-anchor="middle"><tspan x="260" dy="0">词 B</tspan></text><text x="260" y="233" fill="#176653" font-size="17" font-weight="400" text-anchor="middle"><tspan x="260" dy="0">0.3</tspan></text><rect x="355" y="321.5" width="75" height="73.5" rx="5" fill="#a8c2b4"/><text x="392" y="425" fill="#263f35" font-size="17" font-weight="400" text-anchor="middle"><tspan x="392" dy="0">词 C</tspan></text><text x="392" y="306.5" fill="#176653" font-size="17" font-weight="400" text-anchor="middle"><tspan x="392" dy="0">0.15</tspan></text><rect x="487" y="346" width="75" height="49" rx="5" fill="#a8c2b4"/><text x="524" y="425" fill="#263f35" font-size="17" font-weight="400" text-anchor="middle"><tspan x="524" dy="0">词 D</tspan></text><text x="524" y="331" fill="#176653" font-size="17" font-weight="400" text-anchor="middle"><tspan x="524" dy="0">0.1</tspan></text><rect x="675" y="172" width="234" height="83" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="792" y="200" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="792" dy="0">贪心</tspan></text><text x="792" y="229" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="792" dy="0">选择最高概率</tspan></text><rect x="675" y="306" width="234" height="83" rx="9" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="792" y="334" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="792" dy="0">随机采样</tspan></text><text x="792" y="363" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="792" dy="0">依概率分布抽取</tspan></text></g></svg>