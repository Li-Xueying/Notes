<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="LSTM 的两种状态。隐藏状态对外，细胞状态承载记忆"><title>LSTM 的两种状态</title><desc>隐藏状态对外，细胞状态承载记忆。细胞状态和隐藏状态都是向量，职责与更新路径不同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">LSTM 的两种状态</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">隐藏状态对外，细胞状态承载记忆</text><text x="55" y="112" fill="#b47936" font-size="15" font-weight="650" text-anchor="start" font-family="sans-serif">细胞状态 c：长期记忆通路</text><path d="M65 145 L895 145" fill="none" stroke="#b47936" stroke-width="5" marker-end="url(#arrow-amber)"/><circle cx="190" cy="145" r="16" fill="#fbf0dd" stroke="#b47936" stroke-width="1.5"/><text x="190" y="151" fill="#b47936" font-size="11" font-weight="650" text-anchor="middle" font-family="sans-serif">c_0</text><circle cx="395" cy="145" r="16" fill="#fbf0dd" stroke="#b47936" stroke-width="1.5"/><text x="395" y="151" fill="#b47936" font-size="11" font-weight="650" text-anchor="middle" font-family="sans-serif">c_1</text><circle cx="600" cy="145" r="16" fill="#fbf0dd" stroke="#b47936" stroke-width="1.5"/><text x="600" y="151" fill="#b47936" font-size="11" font-weight="650" text-anchor="middle" font-family="sans-serif">c_2</text><circle cx="805" cy="145" r="16" fill="#fbf0dd" stroke="#b47936" stroke-width="1.5"/><text x="805" y="151" fill="#b47936" font-size="11" font-weight="650" text-anchor="middle" font-family="sans-serif">c_3</text><text x="55" y="236" fill="#176653" font-size="15" font-weight="650" text-anchor="start" font-family="sans-serif">隐藏状态 h：当前输出与控制信号</text><path d="M65 270 C280 240 680 300 895 270" fill="none" stroke="#176653" stroke-width="3" marker-end="url(#arrow)"/><circle cx="190" cy="270" r="16" fill="#e9f3ee" stroke="#176653" stroke-width="1.5"/><text x="190" y="276" fill="#176653" font-size="11" font-weight="650" text-anchor="middle" font-family="sans-serif">h_0</text><circle cx="395" cy="270" r="16" fill="#e9f3ee" stroke="#176653" stroke-width="1.5"/><text x="395" y="276" fill="#176653" font-size="11" font-weight="650" text-anchor="middle" font-family="sans-serif">h_1</text><circle cx="600" cy="270" r="16" fill="#e9f3ee" stroke="#176653" stroke-width="1.5"/><text x="600" y="276" fill="#176653" font-size="11" font-weight="650" text-anchor="middle" font-family="sans-serif">h_2</text><circle cx="805" cy="270" r="16" fill="#e9f3ee" stroke="#176653" stroke-width="1.5"/><text x="805" y="276" fill="#176653" font-size="11" font-weight="650" text-anchor="middle" font-family="sans-serif">h_3</text><rect x="280" y="323" width="400" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="354" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">c_t, h_t ∈ R^n</text></g></svg>
