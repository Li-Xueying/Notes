<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="序列数据改变了什么。顺序、长度和上下文都会影响表示"><title>序列数据改变了什么</title><desc>顺序、长度和上下文都会影响表示。语言、视频和生物信号不能只当作固定长度、彼此独立的特征集合。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">序列数据改变了什么</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">顺序、长度和上下文都会影响表示</text><rect x="55" y="125" width="250" height="155" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="180" y="195.5" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">语言</text><text x="180" y="220.5" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">词序改变含义</text><rect x="355" y="125" width="250" height="155" rx="6" fill="#eaf1f4" stroke="#a8c2b4" stroke-width="1.4"/><text x="480" y="195.5" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">视频</text><text x="480" y="220.5" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">帧序形成动作</text><rect x="655" y="125" width="250" height="155" rx="6" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.4"/><text x="780" y="195.5" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">生物信号</text><text x="780" y="220.5" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">时间形态携带信息</text><rect x="200" y="317" width="560" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="348" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">顺序 + 变长 + 上下文依赖</text></g></svg>
