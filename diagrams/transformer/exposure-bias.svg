<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="模型生成“渡”，真实前缀却是“度”"><title>模型生成“渡”，真实前缀却是“度”</title><desc>训练读“深度”，推理可能读“深渡”，不同前缀分布会改变后续预测。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">模型生成“渡”，真实前缀却是“度”</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">训练读取真值，推理读取自己的输出</text><text x="80" y="133" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">训练输入：BOS 深 度 → 下一词“学”</text><text x="80" y="181" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">推理输入：BOS 深 渡 → 当前前缀已变化</text><text x="80" y="229" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">错误预测被反馈后，后续输入偏离训练中的真实前缀</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">Scheduled Sampling 尝试在训练中混合两类前缀</text></g></svg>
