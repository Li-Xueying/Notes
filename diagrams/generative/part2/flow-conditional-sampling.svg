<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">每一步采样使用同一个条件</title><desc id="desc">采样时先选条件 y，再抽初始噪声。在每个时间步将当前状态、时间和同一个 y 输入网络，沿对应条件速度场积分。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">每一步采样使用同一个条件</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">固定条件 y</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">选择希望的分布</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">当前状态 xₜ</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">每步都注入 y</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">条件速度</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">fθ(xₜ,t,y)</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">不同初始噪声，在同一条件下仍能产生不同输出</text></g></svg>
