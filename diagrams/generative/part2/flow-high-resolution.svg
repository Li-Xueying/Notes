<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">高分辨率需要匹配噪声尺度与表示</title><desc id="desc">像素之间存在空间相关性，分辨率变化会影响同一噪声比例下的可感知信号。高分辨率训练可使用偏向较高噪声的时间策略，并结合更合适的压缩表示与网络。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">高分辨率需要匹配噪声尺度与表示</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">分辨率增大</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">像素相关与计算增多</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">调整表示与噪声</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">潜空间、时间策略</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">扩展模型</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">U-Net / Transformer</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">简洁框架仍需要匹配数据尺度与网络设计</text></g></svg>
