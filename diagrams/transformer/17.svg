<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="逐步生成目标序列"><title>逐步生成目标序列</title><desc>每一步依据已有前缀预测下一个 token 文本示例用于说明生成机制；每次预测的是词表上的概率分布。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="66" y="136" width="163" height="65" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="147.5" y="175.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="147.5" dy="0">我</tspan></text><path d="M233 169 L277 169" stroke="#176653" stroke-width="2" fill="none"/><path d="M269.01704569498645 173.15601257987333 L277 169 L269.01704569498645 164.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="287" y="136" width="163" height="65" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="368.5" y="175.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="368.5" dy="0">喜欢</tspan></text><path d="M454 169 L498 169" stroke="#176653" stroke-width="2" fill="none"/><path d="M490.01704569498645 173.15601257987333 L498 169 L490.01704569498645 164.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="508" y="136" width="163" height="65" rx="9" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="589.5" y="175.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="589.5" dy="0">机器</tspan></text><path d="M675 169 L719 169" stroke="#176653" stroke-width="2" fill="none"/><path d="M711.0170456949865 173.15601257987333 L719 169 L711.0170456949865 164.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="729" y="136" width="163" height="65" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="810.5" y="175.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="810.5" dy="0">…</tspan></text><path d="M480 210 L480 251" stroke="#176653" stroke-width="2" fill="none"/><path d="M475.84398742012667 243.01704569498645 L480 251 L484.15601257987333 243.01704569498645" fill="none" stroke="#176653" stroke-width="2"/><rect x="289" y="265" width="382" height="76" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="480" y="293" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="480" dy="0">模型预测下一个 token</tspan></text><text x="480" y="322" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">条件：已出现的完整前缀</tspan></text><path d="M674 304 L806 304" stroke="#176653" stroke-width="2" fill="none"/><path d="M798.0170456949865 308.15601257987333 L806 304 L798.0170456949865 299.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="757" y="364" width="152" height="65" rx="9" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="833" y="403.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="833" dy="0">追加 token</tspan></text><path d="M838 361 V226 H850 V204" fill="none" stroke="#b47936" stroke-width="2"/><text x="395" y="419" fill="#176653" font-size="20" font-weight="400" text-anchor="middle"><tspan x="395" dy="0">输入前缀 → 词表分布 → 选择 → 继续</tspan></text></g></svg>