<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">RNN 和因果 Transformer 参数化同一分解</title><desc id="desc">循环神经网络（RNN）用隐藏状态积累前缀；因果 Transformer 用遮罩注意力读取此前位置。二者都能输出下一词的条件分布。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">RNN 和因果 Transformer 参数化同一分解</text><path d="M42 63 H918" stroke="#ccdbd2"/><text x="108" y="117" font-size="19" fill="#283b34" text-anchor="middle">RNN</text><rect x="42" y="138" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="171.33333333333334" y="168" font-size="18" fill="#283b34" text-anchor="middle">前缀 x&lt;t</text><text x="171.33333333333334" y="193" font-size="14" fill="#63766c" text-anchor="middle">时间递归状态</text><path d="M304.6666666666667 181 L346.6666666666667 181" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350.6666666666667" y="138" width="258.6666666666667" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="168" font-size="18" fill="#283b34" text-anchor="middle">隐藏状态 ht</text><text x="480" y="193" font-size="14" fill="#63766c" text-anchor="middle">汇集历史</text><path d="M613.3333333333334 181 L655.3333333333334 181" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="659.3333333333334" y="138" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="788.6666666666667" y="168" font-size="18" fill="#283b34" text-anchor="middle">下一词分布</text><text x="788.6666666666667" y="193" font-size="14" fill="#63766c" text-anchor="middle">采样 xt</text><text x="168" y="294" font-size="19" fill="#283b34" text-anchor="middle">因果 Transformer</text><rect x="42" y="312" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="171.33333333333334" y="342" font-size="18" fill="#283b34" text-anchor="middle">前缀 x&lt;t</text><text x="171.33333333333334" y="367" font-size="14" fill="#63766c" text-anchor="middle">位置表示</text><path d="M304.6666666666667 355 L346.6666666666667 355" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350.6666666666667" y="312" width="258.6666666666667" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="342" font-size="18" fill="#283b34" text-anchor="middle">因果注意力</text><text x="480" y="367" font-size="14" fill="#63766c" text-anchor="middle">仅可见过去</text><path d="M613.3333333333334 355 L655.3333333333334 355" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="659.3333333333334" y="312" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="788.6666666666667" y="342" font-size="18" fill="#283b34" text-anchor="middle">下一词分布</text><text x="788.6666666666667" y="367" font-size="14" fill="#63766c" text-anchor="middle">追加到前缀</text></g></svg>
