<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="最大池化与平均池化"><title>最大池化与平均池化</title><desc>对输入 0 到 8，左上窗口为 0、1、3、4：最大值为 4，平均值为 2。比较整张输出保留的信息。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">最大池化与平均池化</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">在同一组 2×2 窗口上比较两种汇总</text><rect x="75" y="120" width="48" height="48" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="99" y="149" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">0</text><rect x="123" y="120" width="48" height="48" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="147" y="149" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">1</text><rect x="171" y="120" width="48" height="48" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="195" y="149" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">2</text><rect x="75" y="168" width="48" height="48" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="99" y="197" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">3</text><rect x="123" y="168" width="48" height="48" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="147" y="197" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">4</text><rect x="171" y="168" width="48" height="48" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="195" y="197" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">5</text><rect x="75" y="216" width="48" height="48" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="99" y="245" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">6</text><rect x="123" y="216" width="48" height="48" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="147" y="245" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">7</text><rect x="171" y="216" width="48" height="48" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="195" y="245" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">8</text><text x="147" y="109" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">输入与当前窗口</text><g data-window="input" transform="translate(75 120)"><rect width="96" height="96" fill="none" stroke="#b47936" stroke-width="3"/></g><path d="M238 191 L315 191" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><text x="276.5" y="182" fill="#176653" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">局部汇总</text><rect x="355" y="138" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="max" data-index="0"><text x="380" y="168" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">4</text></g><rect x="405" y="138" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="max" data-index="1"><text x="430" y="168" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">5</text></g><rect x="355" y="188" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="max" data-index="2"><text x="380" y="218" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">7</text></g><rect x="405" y="188" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="max" data-index="3"><text x="430" y="218" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">8</text></g><text x="405" y="127" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">最大池化</text><g data-window="output-max" transform="translate(355 138)"><rect width="50" height="50" fill="none" stroke="#b47936" stroke-width="3"/></g><rect x="670" y="138" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="mean" data-index="0"><text x="695" y="168" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">2</text></g><rect x="720" y="138" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="mean" data-index="1"><text x="745" y="168" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">3</text></g><rect x="670" y="188" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="mean" data-index="2"><text x="695" y="218" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">5</text></g><rect x="720" y="188" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="mean" data-index="3"><text x="745" y="218" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">6</text></g><text x="720" y="127" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">平均池化</text><g data-window="output-mean" transform="translate(670 138)"><rect width="50" height="50" fill="none" stroke="#b47936" stroke-width="3"/></g><g data-window-equation=""><rect x="70" y="319" width="820" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="353" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">max(0,1,3,4) = 4；(0+1+3+4) / 4 = 2</text></g></g></svg>
