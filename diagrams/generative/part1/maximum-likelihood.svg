<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">独立样本的联合似然是乘积</title><desc id="desc">最大似然估计（maximum likelihood estimation，MLE）假设训练集由 N 个独立同分布样本组成。模型参数 θ 决定每个样本的概率质量或密度，训练寻找使联合似然最大的参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">独立样本的联合似然是乘积</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="157" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="171.33333333333334" y="187" font-size="18" fill="#283b34" text-anchor="middle">训练数据</text><text x="171.33333333333334" y="212" font-size="14" fill="#63766c" text-anchor="middle">x⁽¹⁾,…,x⁽ᴺ⁾</text><path d="M304.6666666666667 200 L346.6666666666667 200" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350.6666666666667" y="157" width="258.6666666666667" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="187" font-size="18" fill="#283b34" text-anchor="middle">概率模型 pθ</text><text x="480" y="212" font-size="14" fill="#63766c" text-anchor="middle">归一化分布</text><path d="M613.3333333333334 200 L655.3333333333334 200" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="659.3333333333334" y="157" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="788.6666666666667" y="187" font-size="18" fill="#283b34" text-anchor="middle">选取参数 θ</text><text x="788.6666666666667" y="212" font-size="14" fill="#63766c" text-anchor="middle">最大化样本似然</text><text x="480" y="405" font-size="17" fill="#63766c" text-anchor="middle">独立同分布假设：训练集联合似然 = 各样本似然的乘积</text></g></svg>
