<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="穷举所有完整序列太昂贵"><title>穷举所有完整序列太昂贵</title><desc>完整序列最大概率，不保证每一步都是局部最高概率。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">穷举所有完整序列太昂贵</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">固定长度有 |V|^T 种候选</text><rect x="48" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="180" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">每步 |V| 个词</text><text x="180" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">所有分支</text><path d="M312 200 L332 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="336" y="154" width="264" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="468" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">长度 T</text><text x="468" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">|V|^T 个序列</text><path d="M600 200 L620 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="756" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">搜索代价</text><text x="756" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">随长度指数增长</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">max_y ∑ₜ log P(y_t | y_&lt;t,x)</text></g></svg>
