<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="人工特征与自动学习表示"><title>人工特征与自动学习表示</title><desc>传统机器学习依赖人工设计特征，深度学习联合学习表示和分类器。</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.7"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.7"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start"><tspan x="48" dy="0">两种识别流程的差别</tspan></text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="48" dy="0">差别在于特征由谁产生，而不在于输入图片本身</tspan></text><text x="52" y="134" fill="#263f35" font-size="17" font-weight="600" text-anchor="start"><tspan x="52" dy="0">传统机器学习</tspan></text><rect x="215" y="104" width="170" height="78" rx="8" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.6"/><text x="300" y="135" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="300" dy="0">人工设计特征</tspan></text><text x="300" y="162" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="300" dy="0">颜色 · 纹理 · 形状</tspan></text><rect x="470" y="104" width="170" height="78" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="555" y="135" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="555" dy="0">分类器</tspan></text><text x="555" y="162" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="555" dy="0">SVM / Boosting</tspan></text><rect x="725" y="104" width="170" height="78" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="810" y="135" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="810" dy="0">类别</tspan></text><text x="810" y="162" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="810" dy="0">芒果 / 苹果</tspan></text><path d="M385 143 L467 143" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><path d="M640 143 L722 143" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><text x="52" y="273" fill="#263f35" font-size="17" font-weight="600" text-anchor="start"><tspan x="52" dy="0">深度学习</tspan></text><rect x="215" y="243" width="280" height="78" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="355" y="274" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="355" dy="0">可学习的特征提取器</tspan></text><text x="355" y="301" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="355" dy="0">从像素中学习表示</tspan></text><rect x="580" y="243" width="150" height="78" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="655" y="274" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="655" dy="0">分类层</tspan></text><text x="655" y="301" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="655" dy="0">联合优化</tspan></text><rect x="815" y="243" width="80" height="78" rx="8" fill="#176653" stroke="#a8c2b4" stroke-width="1.6"/><text x="855" y="274" fill="#ffffff" font-size="18" font-weight="600" text-anchor="middle"><tspan x="855" dy="0">类别</tspan></text><path d="M495 282 L577 282" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><path d="M730 282 L812 282" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><text x="480" y="379" fill="#667f72" font-size="16" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">同一目标：在未见样本上做出可靠预测</tspan></text></g></svg>
