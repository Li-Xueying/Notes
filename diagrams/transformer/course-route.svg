<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="从机制到完整模型，再到专家层"><title>从机制到完整模型，再到专家层</title><desc>先拆开注意力，再沿原章节组装两侧网络；随后转入语言、视觉和稀疏专家层。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">从机制到完整模型，再到专家层</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">自注意力 → 编码器 → 解码器 → 语言与视觉 → MoE</text><rect x="46" y="161" width="193" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="142.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">自注意力</text><text x="142.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">位置之间交换信息</text><path d="M239 207 L259 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="263" y="161" width="193" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="359.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">编码器 / 解码器</text><text x="359.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">组装序列模型</text><path d="M456 207 L476 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="161" width="193" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="576.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">NLP / Vision</text><text x="576.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">适配任务与输入</text><path d="M673 207 L693 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="697" y="161" width="193" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="793.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">MoE</text><text x="793.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">稀疏条件计算</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">机制 → 模型 → 任务扩展 → 专家容量</text></g></svg>
