<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="数据不多，还能训练 CNN 吗"><title>数据不多，还能训练 CNN 吗</title><desc>已有模型学到的视觉表示能否迁移</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">数据不多，还能训练 CNN 吗</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">已有模型学到的视觉表示能否迁移</text><rect x="55" y="155" width="272.6666666666667" height="105" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="191.33333333333334" y="200.5" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">目标数据少</text><text x="191.33333333333334" y="226.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">从头训练容易过拟合</text><path d="M327.6666666666667 207.5 L340.6666666666667 207.5" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="343.6666666666667" y="155" width="272.6666666666667" height="105" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="480" y="200.5" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">其他任务的模型</text><text x="480" y="226.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">已学到视觉特征</text><path d="M616.3333333333334 207.5 L629.3333333333334 207.5" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="632.3333333333334" y="155" width="272.6666666666667" height="105" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="768.6666666666667" y="200.5" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">迁移学习</text><text x="768.6666666666667" y="226.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">复用表示适应新类别</text><rect x="90" y="319" width="780" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="353" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">下一步：获得预训练主干，再决定训练哪些参数。</text></g></svg>
