<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="小数据还能训练 CNN 吗"><title>小数据还能训练 CNN 吗</title><desc>复用大规模预训练表示</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">小数据还能训练 CNN 吗</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">复用大规模预训练表示</text><rect x="65" y="140" width="194" height="105" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="162" y="185.5" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">大规模源数据</text><text x="162" y="211.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">通用视觉模式</text><path d="M259 192.5 L274 192.5" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="277" y="140" width="194" height="105" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="374" y="185.5" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">预训练主干</text><text x="374" y="211.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">已学习参数</text><path d="M471 192.5 L486 192.5" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="489" y="140" width="194" height="105" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="586" y="185.5" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">替换分类头</text><text x="586" y="211.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">目标类别数</text><path d="M683 192.5 L698 192.5" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="701" y="140" width="194" height="105" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="798" y="185.5" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">目标任务</text><text x="798" y="211.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">少量标注</text><rect x="130" y="299" width="700" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="333" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">先复用表示，再用目标数据建立新的决策边界。</text></g></svg>
