<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">重建与 KL 相加，再反向传播</title><desc id="desc">固定结构算例：x=(0.6,−0.2)。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">重建与 KL 相加，再反向传播</text><path d="M42 63 H918" stroke="#ccdbd2"/><text x="480" y="103" font-size="17" fill="#63766c" text-anchor="middle">二维结构算例：输入与噪声在所有步骤中保持固定</text><rect x="43" y="159" width="150" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="118" y="189" font-size="18" fill="#283b34" text-anchor="middle">输入 x</text><text x="118" y="214" font-size="14" fill="#63766c" text-anchor="middle">(0.6, -0.2)</text><text x="480" y="422" font-size="17" fill="#63766c" text-anchor="middle">先得到分布参数，再将独立噪声变成潜变量</text></g></svg>
