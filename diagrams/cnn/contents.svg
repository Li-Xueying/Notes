<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="本讲路线"><title>本讲路线</title><desc>结构 → 训练 → 架构</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">本讲路线</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">结构 → 训练 → 架构</text><rect x="55" y="150" width="272.6666666666667" height="112" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="191.33333333333334" y="199" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">01 卷积网络</text><text x="191.33333333333334" y="225" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">构造前向计算</text><path d="M327.6666666666667 206 L340.6666666666667 206" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="343.6666666666667" y="150" width="272.6666666666667" height="112" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="480" y="199" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">02 CNN 训练</text><text x="480" y="225" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">沿依赖关系求梯度</text><path d="M616.3333333333334 206 L629.3333333333334 206" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="632.3333333333334" y="150" width="272.6666666666667" height="112" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="768.6666666666667" y="199" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">03 经典架构</text><text x="768.6666666666667" y="225" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">组合组件解决问题</text><text x="480" y="326" fill="#667f72" font-size="17" font-weight="400" text-anchor="middle" font-family="sans-serif">三部分共享同一条主线：张量怎样变化，参数怎样共享，梯度怎样返回。</text></g></svg>
