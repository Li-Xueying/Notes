<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">固定表征的质量与适配潜力</title><desc id="desc">线性探测只训练线性头，衡量固定特征在受限读出条件下的可分性。全模型微调（full fine-tuning）更新编码器和任务头，衡量适配后的表现。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">固定表征的质量与适配潜力</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="42" y="137" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="174" y="172" font-size="18" fill="#263f35" text-anchor="middle">冻结编码器</text><text x="174" y="198" font-size="14" fill="#5d7469" text-anchor="middle">固定特征</text><path d="M306 178 L328 178" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="137" width="264" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="466" y="172" font-size="18" fill="#263f35" text-anchor="middle">训练线性头</text><text x="466" y="198" font-size="14" fill="#5d7469" text-anchor="middle">使用目标标签</text><path d="M598 178 L620 178" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="626" y="137" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="758" y="172" font-size="18" fill="#263f35" text-anchor="middle">线性探测</text><text x="758" y="198" font-size="14" fill="#5d7469" text-anchor="middle">检查可分性</text><rect x="42" y="280" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="174" y="315" font-size="18" fill="#263f35" text-anchor="middle">更新编码器</text><text x="174" y="341" font-size="14" fill="#5d7469" text-anchor="middle">目标任务适配</text><path d="M306 321 L328 321" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)