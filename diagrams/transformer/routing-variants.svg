<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="Top-k、哈希、RL 与匹配路由"><title>Top-k、哈希、RL 与匹配路由</title><desc>不同选择规则形成不同条件计算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">Top-k、哈希、RL 与匹配路由</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">不同选择规则形成不同条件计算</text><text x="80" y="133" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">Top-k：按当前分数选择少数专家</text><text x="80" y="181" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">Hash：按固定映射分配</text><text x="80" y="229" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">RL：学习离散路径策略</text><text x="80" y="277" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">Matching：优化整体 token—expert 分配</text></g></svg>
