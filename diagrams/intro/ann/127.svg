<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="统一特征的尺度"><title>统一特征的尺度</title><desc>比较 Min–Max 缩放与标准化 统计量由训练数据确定，再应用于验证、测试和新输入。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="145" y="142" width="223.33333333333334" height="52" fill="#e9f3ee"/><text x="157" y="174" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="157" dy="0">原始值</tspan></text><rect x="368.33333333333337" y="142" width="223.33333333333334" height="52" fill="#e9f3ee"/><text x="380.33333333333337" y="174" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="380.33333333333337" dy="0">处理规则</tspan></text><rect x="591.6666666666667" y="142" width="223.33333333333334" height="52" fill="#e9f3ee"/><text x="603.6666666666667" y="174" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="603.6666666666667" dy="0">变换结果</tspan></text><rect x="145" y="194" width="223.33333333333334" height="52" fill="#f7faf8"/><text x="157" y="226" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="157" dy="0">45</tspan></text><rect x="368.33333333333337" y="194" width="223.33333333333334" height="52" fill="#f7faf8"/><text x="380.33333333333337" y="226" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="380.33333333333337" dy="0">减最小值，除极差</tspan></text><rect x="591.6666666666667" y="194" width="223.33333333333334" height="52" fill="#f7faf8"/><text x="603.6666666666667" y="226" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="603.6666666666667" dy="0">0.500</tspan></text><rect x="145" y="246" width="223.33333333333334" height="52" fill="#ffffff"/><text x="157" y="278" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="157" dy="0">29</tspan></text><rect x="368.33333333333337" y="246" width="223.33333333333334" height="52" fill="#ffffff"/><text x="380.33333333333337" y="278" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="380.33333333333337" dy="0">减最小值，除极差</tspan></text><rect x="591.6666666666667" y="246" width="223.33333333333334" height="52" fill="#ffffff"/><text x="603.6666666666667" y="278" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="603.6666666666667" dy="0">0.000</tspan></text><rect x="145" y="298" width="223.33333333333334" height="52" fill="#f7faf8"/><text x="157" y="330" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="157" dy="0">61</tspan></text><rect x="368.33333333333337" y="298" width="223.33333333333334" height="52" fill="#f7faf8"/><text x="380.33333333333337" y="330" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="380.33333333333337" dy="0">减最小值，除极差</tspan></text><rect x="591.6666666666667" y="298" width="223.33333333333334" height="52" fill="#f7faf8"/><text x="603.6666666666667" y="330" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="603.6666666666667" dy="0">1.000</tspan></text><rect x="145" y="350" width="223.33333333333334" height="52" fill="#ffffff"/><text x="157" y="382" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="157" dy="0">52</tspan></text><rect x="368.33333333333337" y="350" width="223.33333333333334" height="52" fill="#ffffff"/><text x="380.33333333333337" y="382" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="380.33333333333337" dy="0">减最小值，除极差</tspan></text><rect x="591.6666666666667" y="350" width="223.33333333333334" height="52" fill="#ffffff"/><text x="603.6666666666667" y="382" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="603.6666666666667" dy="0">0.719</tspan></text><text x="480" y="457" fill="#176653" font-size="18" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">Min–Max: (x−xmin)/(xmax−xmin)　　标准化: (x−μ)/σ</tspan></text></g></svg>