<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="为什么池化提供局部稳定性"><title>为什么池化提供局部稳定性</title><desc>最大值和平均值都不依赖窗口内元素顺序，所以某些局部平移不会改变结果。跨越窗口边界后，这种稳定性不再保证。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">为什么池化提供局部稳定性</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">同一窗口内重排数值，汇总结果不变</text><image href="data:image/png;base64," x="40" y="96" width="880" height="285" preserveAspectRatio="xMidYMid meet"/></g></svg>
