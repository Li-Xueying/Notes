<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">把监督构造落到训练循环</title><desc id="desc">对一个批次抽取与数据同形状的高斯噪声，为每个样本抽 t，并将 t 广播到其余轴。网络输出与目标作均方误差，反向传播更新参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">把监督构造落到训练循环</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">每轮重采样</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">数据、噪声、时间</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">预测并比较</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">MSE 对齐速度</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">反向传播</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">更新同一个 θ</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">批次时间广播到其余轴，预测与监督形状一致</text></g></svg>
