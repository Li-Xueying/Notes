<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="梯度消失与爆炸。雅可比矩阵连乘带来的两种极端"><title>梯度消失与爆炸</title><desc>雅可比矩阵连乘带来的两种极端。消失让远处信息难以学习，爆炸会造成不稳定甚至数值溢出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">梯度消失与爆炸</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">雅可比矩阵连乘带来的两种极端</text><path d="M95 285 L95 115 M95 285 L870 285" fill="none" stroke="#263f35" stroke-width="2"/><text x="72" y="111" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">梯度幅度</text><text x="865" y="309" fill="#667f72" font-size="13" font-weight="400" text-anchor="end" font-family="sans-serif">时间距离 →</text><path d="M110 148 C260 190 420 244 820 278" fill="none" stroke="#547a8a" stroke-width="3"/><path d="M110 269 C310 260 520 205 820 126" fill="none" stroke="#a75d52" stroke-width="3"/><text x="770" y="255" fill="#547a8a" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">消失</text><text x="770" y="116" fill="#a75d52" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">爆炸</text><rect x="175" y="322" width="610" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="353" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">连乘因子的有效尺度 &lt; 1 或 &gt; 1</text></g></svg>
