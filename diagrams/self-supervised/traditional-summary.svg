<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">关注留下的特征与迁移用途</title><desc id="desc">旋转、拼图、着色和修复偏重不同结构。代理任务做得好，还需要检查分类、检测与分割表现。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">关注留下的特征与迁移用途</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="42" y="133" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="174" y="168" font-size="18" fill="#263f35" text-anchor="middle">数据结构</text><text x="174" y="194" font-size="14" fill="#5d7469" text-anchor="middle">空间 / 时间 / 通道</text><path d="M306 174 L328 174" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="133" width="264" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="466" y="168" font-size="18" fill="#263f35" text-anchor="middle">代理预测</text><text x="466" y="194" font-size="14" fill="#5d7469" text-anchor="middle">视觉常识任务</text><path d="M598 174 L620 174" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="626" y="133" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="758" y="168" font-size="18" fill="#263f35" text-anchor="middle">迁移表征</text><text x="758" y="194" font-size="14" fill="#5d7469" text-anchor="middle">下游评价</text><rect x="154" y="270" width="652" height="70" rx="4" fill="#fcf3df" stroke="#a8c2b4"/><text x="480" y="299" font-size="18" fill="#263f35" text-anchor="middle">统一的视图任务</text><text x="480" y="325" font-size="14" fill="#5d7469" text-anchor="middle">同图不同变换，保留来源身份</text></g></svg>
