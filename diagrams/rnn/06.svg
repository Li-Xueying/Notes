width="2"/><text x="512" y="171" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">banking</text><rect x="573" y="145" width="92" height="42" rx="5" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="619" y="171" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">crises</text><rect x="675" y="145" width="92" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="721" y="171" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">as</text><rect x="777" y="145" width="92" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="823" y="171" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">happened</text><path d="M308 214 Q480 280 652 214" fill="none" stroke="#b47936" stroke-width="2" marker-end="url(#arrow-amber)"/><text x="480" y="274" fill="#b47936" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">多个局部上下文共同塑造 banking 的表示</text><rect x="120" y="317" width="720" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="348" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">相似上下文 → 相关用法 → 可学习的向量邻近</text></g></svg>
