<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">三种分布，三种问题</title><desc id="desc">判别模型（discriminative model）学习给定数据的标签分布 p(y|x)；无条件生成模型学习数据分布 p(x)；条件生成模型学习给定标签或其他条件的 p(x|y)。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">三种分布，三种问题</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="158" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="171.33333333333334" y="188" font-size="18" fill="#283b34" text-anchor="middle">判别 p(y|x)</text><text x="171.33333333333334" y="213" font-size="14" fill="#63766c" text-anchor="middle">固定数据 x → 标签 y</text><path d="M304.6666666666667 201 L346.6666666666667 201" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350.6666666666667" y="158" width="258.6666666666667" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="188" font-size="18" fill="#283b34" text-anchor="middle">生成 p(x)</text><text x="480" y="213" font-size="14" fill="#63766c" text-anchor="middle">模型 → 新数据 x</text><path d="M613.3333333333334 201 L655.3333333333334 201" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="659.3333333333334" y="158" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="788.6666666666667" y="188" font-size="18" fill="#283b34" text-anchor="middle">条件生成 p(x|y)</text><text x="788.6666666666667" y="213" font-size="14" fill="#63766c" text-anchor="middle">固定条件 y → 数据 x</text><text x="480" y="405" font-size="17" fill="#63766c" text-anchor="middle">先固定条件，再确认在什么变量上归一化</text></g></svg>
