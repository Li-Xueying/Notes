<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="一行分数对应一个查询"><title>一行分数对应一个查询</title><desc>矩阵的行是查询，列是被查询位置；输出数量等于查询数量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">一行分数对应一个查询</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">QKᵀ → 逐行 Softmax → AV</text><rect x="45" y="114" width="150" height="74" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="120" y="144" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Q</text><text x="120" y="172" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">N × dₖ</text><rect x="45" y="235" width="150" height="74" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="120" y="265" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">K</text><text x="120" y="293" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">N × dₖ</text><rect x="742" y="235" width="170" height="74" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="827" y="265" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">V</text><text x="827" y="293" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">N × dᵥ</text><text x="480" y="207" font-size="17" fill="#176653" text-anchor="middle" font-weight="400">三个投影参数在位置间共享</text></g></svg>
