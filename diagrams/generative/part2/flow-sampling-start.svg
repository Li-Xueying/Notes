<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">先定步数，再抽初始噪声</title><desc id="desc">选择正整数步数 T，从噪声分布抽 x1。可用 50 步作为一个示例设置；步数取值与模型、求解器和质量预算有关。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">先定步数，再抽初始噪声</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">选步数 T</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">决定网络评估预算</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">抽 x₁</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">高斯噪声</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">开始积分</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">t=1，参数固定</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">采样只需要噪声；看不到真实数据端点</text></g></svg>
