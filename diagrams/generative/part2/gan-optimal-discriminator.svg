<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">固定 pG，逐点求最优 D</title><desc id="desc">把两个期望写为积分后，对于每个位置 x，只需最大化 pdata(x)log D(x)+pG(x)log(1-D(x))。令对 D 的导数为零，得到真实来源的最优判别比例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">固定 pG，逐点求最优 D</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">固定生成分布</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">pG 不变</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">逐点最大化</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">真密度×log D</text><text x="480" y="246" font-size="14" fill="#63766c" text-anchor="middle">假密度×log(1−D)</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">最优判别</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">真密度 / 两密度之和</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">仅在两分布密度和为正处定义</text></g></svg>
