<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">第三步：拆成三个对数项</title><desc id="desc">利用乘积与商的对数规则，把先验 p(z) 与一个 qφ 配对，再把另一个 qφ 与真实后验配对。三个项的符号决定后续的上下界方向。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">第三步：拆成三个对数项</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="145" width="275" height="96" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="179.5" y="175" font-size="18" fill="#283b34" text-anchor="middle">重建对数</text><text x="179.5" y="200" font-size="14" fill="#63766c" text-anchor="middle">log pθ(x|z)</text><rect x="342" y="145" width="275" height="96" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="479.5" y="175" font-size="18" fill="#283b34" text-anchor="middle">先验密度比</text><text x="479.5" y="200" font-size="14" fill="#63766c" text-anchor="middle">log [qφ(z|x) / p(z)]</text><rect x="642" y="145" width="275" height="96" rx="4" fill="#f9e7e3" stroke="#ccdbd2"/><text x="779.5" y="175" font-size="18" fill="#283b34" text-anchor="middle">后验密度比</text><text x="779.5" y="200" font-size="14" fill="#63766c" text-anchor="middle">log [qφ(z|x) / pθ(z|x)]</text><text x="330" y="205" font-size="27" fill="#283b34" text-anchor="middle">−</text><text x="630" y="205" font-size="27" fill="#283b34" text-anchor="middle">+</text><text x="480" y="344" font-size="17" fill="#63766c" text-anchor="middle">每一项仍含 z；下一步对同一个 qφ(z|x) 取期望</text></g></svg>
