<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="负采样的损失"><title>负采样的损失</title><desc>负项使用 σ(−u_nᵀv_c)，负号决定了压低噪声词对点积的优化方向。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">负采样的损失</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">一个正样本与 k 个负样本</text><text x="80" y="137" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">真实词对：增大 u_oᵀv_c → 增大 σ(u_oᵀv_c)</text><text x="80" y="184" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">噪声词对：减小 u_nᵀv_c → 增大 σ(−u_nᵀv_c)</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">J = −log σ(u_oᵀv_c) − ∑ₙ log σ(−u_nᵀv_c)</text></g></svg>
