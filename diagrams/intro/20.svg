<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="1958–1969 · 感知机与早期兴盛"><title>1958–1969 · 感知机与早期兴盛</title><desc>感知机和 Adaline 推动早期发展，对单层模型能力边界的研究也揭示了局限。</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.7"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.7"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start"><tspan x="48" dy="0">1958–1969 · 感知机与早期兴盛</tspan></text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="48" dy="0">连接权重开始能够从数据中调整</tspan></text>
  <rect x="48" y="106" width="260" height="112" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="178" y="137" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="178" dy="0">1958 · Perceptron</tspan></text><text x="178" y="164" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="178" dy="0">感知机</tspan><tspan x="178" dy="20">从样本调整连接权重</tspan></text>
  <rect x="350" y="106" width="260" height="112" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="480" y="137" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="480" dy="0">1960 · Adaline</tspan></text><text x="480" y="164" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">自适应线性神经元</tspan><tspan x="480" dy="20">用误差改进权重</tspan></text>
  <rect x="652" y="106" width="260" height="112" rx="8" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.6"/><text x="782" y="137" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="782" dy="0">1969 · Perceptrons</tspan></text><text x="782" y="164" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="782" dy="0">系统分析能力边界</tspan><tspan x="782" dy="20">单层模型局限显现</tspan></text>
  <text x="198" y="269" fill="#263f35" font-size="14" font-weight="400" text-anchor="middle"><tspan x="198" dy="0">阶跃函数：给出 0 / 1 的硬判断</tspan></text>
