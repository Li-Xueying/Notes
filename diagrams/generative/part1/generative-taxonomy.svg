<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">四类方法的路线图</title><desc id="desc">自回归模型通过条件分布乘积计算似然，并按顺序采样；变分自编码器（Variational Autoencoder，VAE）引入潜变量，优化对数似然下界。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">四类方法的路线图</text><path d="M42 63 H918" stroke="#ccdbd2"/><text x="64" y="111" font-size="18" fill="#63766c" text-anchor="start">方法</text><text x="405" y="111" font-size="18" fill="#63766c" text-anchor="middle">典型训练对象</text><text x="760" y="111" font-size="18" fill="#63766c" text-anchor="middle">典型采样路径</text><rect x="42" y="126" width="876" height="57" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="64" y="163" font-size="19" fill="#283b34" text-anchor="start">自回归</text><text x="405" y="163" font-size="18" fill="#283b34" text-anchor="middle">精确条件似然</text><text x="760" y="163" font-size="18" fill="#283b34" text-anchor="middle">按元素顺序生成</text><rect x="42" y="190" width="876" height="57" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="64" y="227" font-size="19" fill="#283b34" text-anchor="start">VAE</text><text x="405" y="227" font-size="18" fill="#283b34" text-anchor="middle">对数似然下界</text><text x="760" y="227" font-size="18" fill="#283b34" text-anchor="middle">先采 z，再解码</text><rect x="42" y="254" width="876" height="57" rx="4" fill="#f6f6f3" stroke="#ccdbd2"/><text x="64" y="291" font-size="19" fill="#283b34" text-anchor="start">GAN</text><text x="405" y="291" font-size="18" fill="#283b34" text-anchor="middle">对抗目标</text><text x="760" y="291" font-size="18" fill="#283b34" text-anchor="middle">噪声经生成器</text><rect x="42" y="318" width="876" height="57" rx="4" fill="#f6f6f3" stroke="#ccdbd2"/><text x="64" y="355" font-size="19" fill="#283b34" text-anchor="start">扩散模型</text><text x="405" y="355" font-size="18" fill="#283b34" text-anchor="middle">去噪等目标</text><text x="760" y="355" font-size="18" fill="#283b34" text-anchor="middle">逐步迭代生成</text><text x="480" y="421" font-size="17" fill="#63766c" text-anchor="middle">后两类在 Part II 展开；不同变体的似然形式可能不同</text></g></svg>
