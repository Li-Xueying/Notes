<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="等变、稳定与数据增强"><title>等变、稳定与数据增强</title><desc>先明确任务希望保留什么</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">等变、稳定与数据增强</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">先明确任务希望保留什么</text><rect x="58" y="118" width="260" height="166" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="188" y="194" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">等变</text><text x="188" y="220" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">输入变化后，响应按规则变化</text><rect x="350" y="118" width="260" height="166" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="480" y="194" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">局部稳定</text><text x="480" y="220" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">小扰动不显著改变预测</text><rect x="642" y="118" width="260" height="166" rx="7" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="772" y="194" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">数据增强</text><text x="772" y="220" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">把允许的变化加入训练分布</text><rect x="220" y="319" width="520" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="353" fill="#176653" font-size="18" 