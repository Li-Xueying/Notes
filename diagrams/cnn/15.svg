<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="最大池化与平均池化"><title>最大池化与平均池化</title><desc>同一窗口的两种局部汇总</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">最大池化与平均池化</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">同一窗口的两种局部汇总</text><rect x="70" y="115" width="42" height="42" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="91" y="141" fill="#263f35" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">1</text><rect x="112" y="115" width="42" height="42" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="133" y="141" fill="#263f35" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">3</text><rect x="154" y="115" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="175" y="141" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">2</text><rect x="196" y="115" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="217" y="141" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">4</text><rect x="70" y="157" width="42" height="42" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="91" y="183" fill="#263f35" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">4</text><rect x="112" y="157" width="42" height="42" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="133" y="183" fill="#263f35" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">2</text><rect x="154" y="157" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="175" y="183" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">1</text><rect x="196" y="157" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="217" y="183" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">5</text><rect x="70" y="199" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="91" y="225" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">0</text><rect x="112" y="199" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="133" y="225" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">6</text><rect x="154" y="199" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="175" y="225" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">3</text><rect x="196" y="199" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="217" y="225" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">2</text><rect x="70" y="241" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="91" y="267" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">2</text><rect x="112" y="241" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="133" y="267" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">1</text><rect x="154" y="241" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="175" y="267" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">4</text><rect x="196" y="241" width="42" height="42" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="217" y="267" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">8</text><text x="154" y="104" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">输入：当前 2×2 窗口</text><path d="M250 202 L350 202" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="380" y="135" width="180" height="120" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="470" y="188" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">Max Pool</text><text x="470" y="214" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">max(1,3,4,2) = 4</text><rect x="620" y="135" width="220" height="120" rx="7" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="730" y="188" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">Average Pool</text><text x="730" y="214" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">(1+3+4+2) / 4 = 2.5</text><rect x="155" y="319" width="650" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="353" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">池化逐通道执行，通常不改变通道数。</text></g></svg>
