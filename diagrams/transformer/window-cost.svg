<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="窗口注意力如何降低成本"><title>窗口注意力如何降低成本</title><desc>固定 M×M 窗口：分数项约为 hwM²。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">窗口注意力如何降低成本</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">固定 M×M 窗口：分数项约为 hwM²</text><text x="80" y="133" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">全局 MSA：4hwC² + 2(hw)²C</text><text x="80" y="181" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">窗口 W-MSA：4hwC² + 2M²hwC</text><text x="80" y="229" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">窗口边长 M 固定时：分数项随 hw 线性增长</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">相同投影项 4hwC²；变化的是位置交互项</text></g></svg>
