<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">用 a,b 描述输入，用 c,d 描述目标</title><desc id="desc">一般输入可写成 xt=a(t)x+b(t)z，回归目标可以是数据、噪声或二者的线性组合。为统一符号，这里把目标写成 y*=c(t)x+d(t)z。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">用 a,b 描述输入，用 c,d 描述目标</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="59" y="129" width="399" height="124" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="258.5" y="158" font-size="18" fill="#283b34" text-anchor="middle">输入路径</text><text x="258.5" y="183" font-size="14" fill="#63766c" text-anchor="middle">xₜ=a(t)x+b(t)z</text><text x="258.5" y="205" font-size="14" fill="#63766c" text-anchor="middle">决定当前含噪状态</text><rect x="501" y="129" width="399" height="124" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="700.5" y="158" font-size="18" fill="#283b34" text-anchor="middle">回归目标</text><text x="700.5" y="183" font-size="14" fill="#63766c" text-anchor="middle">y*=c(t)x+d(t)z</text><text x="700.5" y="205" font-size="14" fill="#63766c" text-anchor="middle">决定网络输出的意义</text><rect x="159" y="309" width="642" height="65" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="338" font-size="18" fill="#283b34" text-anchor="middle">采样器必须与这两种选择匹配</text><text x="480" y="363" font-size="14" fill="#63766c" text-anchor="middle">网络输出不总是 d xₜ / dt</text></g></svg>
