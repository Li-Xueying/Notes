<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">GAN 的能力与代价</title><desc id="desc">GAN 的构造直接，能够生成高质量图像，训练后通常一次生成器前向就能得到样本。代价是两方训练容易失衡，损失与质量之间缺少简单关系，扩大模型和数据也需要稳定训练设计。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">GAN 的能力与代价</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="51" y="127" width="411" height="128" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="256.5" y="156" font-size="18" fill="#283b34" text-anchor="middle">生成的优势</text><text x="256.5" y="181" font-size="14" fill="#63766c" text-anchor="middle">先验 → G → 样本</text><text x="256.5" y="203" font-size="14" fill="#63766c" text-anchor="middle">一次前向，图像质量可高</text><rect x="499" y="127" width="411" height="128" rx="4" fill="#f9e7e3" stroke="#ccdbd2"/><text x="704.5" y="156" font-size="18" fill="#283b34" text-anchor="middle">训练的难点</text><text x="704.5" y="181" font-size="14" fill="#63766c" text-anchor="middle">D 与 G 同时变化</text><text x="704.5" y="203" font-size="14" fill="#63766c" text-anchor="middle">稳定性、覆盖与扩展性</text><rect x="203" y="314" width="554" height="64" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="352" font-size="18" fill="#283b34" text-anchor="middle">下一条路线：监督回归 + 多步生成</text></g></svg>
