<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">沿条件差异外推，再反向积分</title><desc id="desc">w=2：继续加强条件差异，−vCFG=(5,−2)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">沿条件差异外推，再反向积分</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="112" width="391" height="99" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="237.5" y="141" font-size="18" fill="#283b34" text-anchor="middle">固定同一 xₜ 与 t</text><text x="237.5" y="166" font-size="14" fill="#63766c" text-anchor="middle">vᵤ=(1,2)，v꜀=(−1,2)</text><path d="M632 321 L587 231" fill="none" stroke="#9a701c" stroke-width="2" marker-end="url(#arrow)"/><text x="565" y="219" font-size="17" fill="#9a701c" text-anchor="middle">−vᵤ</text><path d="M632 321 L677 231" fill="none" stroke="#306b87" stroke-width="2" marker-end="url(#arrow)"/><text x="677" y="206" font-size="17" fill="#306b87" text-anchor="middle">−v꜀</text><path d="M632 321 L857 231" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><text x="857" y="226" font-size="17" fill="#2f7253" text-anchor="middle">−vCFG</text><rect x="42" y="251" width="391" height="96" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="237.5" y="280" font-size="18" fill="#283b34" text-anchor="middle">w=2：vCFG=(-5, 2)</text><text x="237.5" y="305" font-size="14" fill="#63766c" text-anchor="middle">生成移动方向 (5, -2)</text><circle cx="632" cy="321" r="7" fill="#283b34"/><text x="632" y="353" font-size="17" fill="#283b34" text-anchor="middle">当前状态 xₜ</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">箭头表示实际生成方向 −v；组合后再乘负时间步长</text></g></svg>
