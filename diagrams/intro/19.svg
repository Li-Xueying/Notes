  <text x="420" y="126" fill="#263f35" font-size="15" font-weight="400" text-anchor="middle"><tspan x="420" dy="0">x₁</tspan><tspan x="420" dy="50">x₂</tspan><tspan x="420" dy="50">x₃</tspan></text>
