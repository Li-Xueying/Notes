<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="移位后，原窗口的 token 能相遇"><title>移位后，原窗口的 token 能相遇</title><desc>数字是区域编号，每格才是一个 token；同区域可互读。查询区域 8 时，绕回的 6、2、0 必须遮挡。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">移位后，原窗口的 token 能相遇</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">循环移位 → 分组 → 遮罩 → 逆移位</text><text x="218" y="110" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">移位前的区域编号</text><text x="218" y="130" font-size="13" fill="#667f72" text-anchor="middle" font-weight="400">每格一个 token；粗线为 2×2 计算窗口</text><rect x="108" y="148" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="135" y="176" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">0</text><rect x="163" y="148" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="190" y="176" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">1</text><rect x="218" y="148" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="245" y="176" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">1</text><rect x="273" y="148" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="300" y="176" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">2</text><rect x="108" y="191" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="135" y="219" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">3</text><rect x="163" y="191" width="54" height="42" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="190" y="219" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">4</text><rect x="218" y="191" width="54" height="42" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="245" y="219" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">4</text><rect x="273" y="191" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="300" y="219" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">5</text><rect x="108" y="234" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="135" y="262" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">3</text><rect x="163" y="234" width="54" height="42" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="190" y="262" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">4</text><rect x="218" y="234" width="54" height="42" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="245" y="262" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">4</text><rect x="273" y="234" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="300" y="262" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">5</text><rect x="108" y="277" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="135" y="305" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">6</text><rect x="163" y="277" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="190" y="305" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">7</text><rect x="218" y="277" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="245" y="305" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">7</text><rect x="273" y="277" width="54" height="42" rx="4" fill="white" stroke="#a8c2b4"/><text x="300" y="305" font-size="21" fill="#263f35" text-anchor="middle" font-weight="400">8</text><path d="M108 148 H328 V320 H108 Z M218 148 V320 M108 234 H328" fill="none" stroke="#547a8a" stroke-width="2.5"/><path d="M361 222 L473 222" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="169" width="383" height="99" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="686.5" y="211.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">向左、向上循环移一格</text><text x="686.5" y="239.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">行、列都按循环索引移动</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">16 个 token；0 至 8 为区域编号，重复编号表示同一区域</text></g></svg>
