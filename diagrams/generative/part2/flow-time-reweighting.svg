<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">从均匀抽样到非均匀抽样</title><desc id="desc">将 t 的采样分布改为 pt，可以增加某些噪声级别出现的频率。若不做重要性校正，这等价于重新加权训练目标。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">从均匀抽样到非均匀抽样</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="53" y="135" width="402" height="125" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="254" y="164" font-size="18" fill="#283b34" text-anchor="middle">均匀时间采样</text><text x="254" y="189" font-size="14" fill="#63766c" text-anchor="middle">同长度区间机会相同</text><text x="254" y="211" font-size="14" fill="#63766c" text-anchor="middle">t ~ Uniform[0,1]</text><rect x="505" y="135" width="402" height="125" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="706" y="164" font-size="18" fill="#283b34" text-anchor="middle">非均匀时间采样</text><text x="706" y="189" font-size="14" fill="#63766c" text-anchor="middle">资源偏向所选噪声尺度</text><text x="706" y="211" font-size="14" fill="#63766c" text-anchor="middle">t ~ pt</text><path d="M460 197 L500 197" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">训练采样分布与生成积分网格是两个独立设计选择</text></g></svg>
