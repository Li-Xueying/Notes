<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">第一步：写出贝叶斯恒等式</title><desc id="desc">从生成模型的联合分布出发，将边缘似然写成条件似然、先验与真实后验的比。取自然对数后，仍是精确等式。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">第一步：写出贝叶斯恒等式</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="102" y="151" width="755" height="101" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="479.5" y="181" font-size="18" fill="#283b34" text-anchor="middle">条件生成 × 先验 ÷ 真实后验</text><text x="479.5" y="206" font-size="14" fill="#63766c" text-anchor="middle">pθ(x|z) × p(z) / pθ(z|x)</text><text x="480" y="405" font-size="17" fill="#63766c" text-anchor="middle">固定 x，整个比值与选取的有效 z 无关</text></g></svg>
