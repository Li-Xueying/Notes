<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="Inception 模块"><title>Inception 模块</title><desc>多尺度分支、1×1 降维、通道拼接</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">Inception 模块</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">多尺度分支、1×1 降维、通道拼接</text><rect x="50" y="172" width="110" height="70" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="105" y="200" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">输入</text><text x="105" y="226" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">H×W×C</text><path d="M160 207 L210 207" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M210 118 L210 328" stroke="#176653" stroke-width="2" fill="none"/><path d="M210 118 L240 118" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M210 188 L240 188" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M210 258 L240 258" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M210 328 L240 328" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="245" y="91" width="230" height="54" rx="7" fill="#f6faf7" stroke="#a8c2b4" stroke-width="1.5"/><text x="360" y="111" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">1×1</text><text x="360" y="137" fill="#667f72" font-size="11" font-weight="400" text-anchor="middle" font-family="sans-serif">直接</text><rect x="245" y="161" width="230" height="54" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="360" y="181" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">1×1 → 3×3</text><text x="360" y="207" fill="#667f72" font-size="11" font-weight="400" text-anchor="middle" font-family="sans-serif">降维后卷积</text><rect x="245" y="231" width="230" height="54" rx="7" fill="#f6faf7" stroke="#a8c2b4" stroke-width="1.5"/><text x="360" y="251" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">1×1 → 5×5</text><text x="360" y="277" fill="#667f72" font-size="11" font-weight="400" text-anchor="middle" font-family="sans-serif">降维后卷积</text><rect x="245" y="301" width="230" height="54" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="360" y="321" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">Pool → 1×1</text><text x="360" y="347" fill="#667f72" font-size="11" font-weight="400" text-anchor="middle" font-family="sans-serif">汇总后投影</text><path d="M475 118 L515 118" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M475 188 L515 188" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M475 258 L515 258" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M475 328 L515 328" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M515 118 L515 328" stroke="#176653" stroke-width="2" fill="none"/><path d="M515 207 L625 207" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="630" y="157" width="270" height="100" rx="7" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="765" y="200" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">Concat axis = C</text><text x="765" y="226" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">空间尺寸一致，沿通道拼接</text><rect x="140" y="334" width="680" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="368" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Y = Concat(Y₁×₁, Y₃×₃, Y₅×₅, Ypool)</text></g></svg>
