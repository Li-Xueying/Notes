<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="大语言模型的表达多样性"><title>大语言模型的表达多样性</title><desc>两个回答表达不同，但共享“可以介绍规则、策略并讨论棋局”的核心语义。</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.7"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.7"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start"><tspan x="48" dy="0">表达不同，不等于目标不同</tspan></text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="48" dy="0">大语言模型按上下文生成后续文本，可能给出多种等价表达</tspan></text><rect x="55" y="112" width="370" height="180" rx="8" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.6"/><text x="240" y="143" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="240" dy="0">回答 1</tspan></text><text x="240" y="170" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="240" dy="0">我可以介绍国际象棋的规则、</tspan><tspan x="240" dy="20">策略和技巧，也可以讨论具体棋局。</tspan></text><rect x="535" y="112" width="370" height="180" rx="8" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.6"/><text x="720" y="143" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="720" dy="0">回答 2</tspan></text><text x="720" y="170" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="720" dy="0">我能帮助学习开局、战术与规则，</tspan><tspan x="720" dy="20">也能一起分析某个局面。</tspan></text><path d="M425 202 L532 202" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><text x="478.5" y="190" fill="#176653" font-size="13" font-weight="400" text-anchor="middle"><tspan x="478.5" dy="0">语义相近</tspan></text><text x="260" y="339" fill="#176653" font-size="15" font-weight="600" text-anchor="middle"><tspan x="260" dy="0">可观察到：表述具有变化</tspan></text><text x="700" y="339" fill="#b47936" font-size="15" font-weight="600" text-anchor="middle"><tspan x="700" dy="0">仍需检验：事实性、推理稳定性和任务边界</tspan></text></g></svg>
