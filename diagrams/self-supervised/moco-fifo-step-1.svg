<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">先计算损失，再维护 FIFO 队列</title><desc id="desc">当前查询先与旧队列比较，新键 K5、K6 待入队。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">先计算损失，再维护 FIFO 队列</text><path d="M42 63 H918" stroke="#d7e5dc"/><text x="145" y="142" font-size="16" fill="#ac4f53" text-anchor="middle">队首（最旧）</text><text x="705" y="142" font-size="16" fill="#176653" text-anchor="middle">队尾（最新）</text><rect x="65" y="160" width="159" height="77" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="144.5" y="204.5" font-size="18" fill="#263f35" text-anchor="middle">K1</text><rect x="251" y="160" width="159" height="77" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="330.5" y="204.5" font-size="18" fill="#263f35" text-anchor="middle">K2</text><rect x="437" y="160" width="159" height="77" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="516.5" y="204.5" font-size="18" fill="#263f35" text-anchor="middle">K3</text><rect x="623" y="160" width="159" height="77" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="702.5" y="204.5" font-size="18" fill="#263f35" text-anchor="middle">K4</text><text x="856" y="205" font-size="15" fill="#263f35" text-anchor="middle">固定容量 4</text><rect x="65" y="278" width="159" height="58" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="144.5" y="313" font-size="18" fill="#263f35" text-anchor="middle">当前查询 q</text><rect x="565" y="278" width="295" height="58" rx="4" fill="#fcf3df" stroke="#a8c2b4"/><text x="712.5" y="313" font-size="18" fill="#263f35" text-anchor="middle">当前新键 K5、K6</text><path d="M145 278 V253 H612 V239" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="279" font-size="17" fill="#263f35" text-anchor="middle">使用旧队列计算 loss</text><rect x="42" y="381" width="876" height="48" rx="4" fill="#f5f9f6" stroke="#d7e5dc"/><text x="480" y="412" font-size="18" fill="#176653" text-anchor="middle">当前损失计算完成后，才维护队列</text></g></svg>
