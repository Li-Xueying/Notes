<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">一次预测局部变化，多次更新得到样本</title><desc id="desc">网络接收当前含噪状态和 t，预测如何改变它。采样从 t=1 的噪声开始，重复预测并向较小 t 移动，直到 t=0。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">一次预测局部变化，多次更新得到样本</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">x₁：噪声</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">从简单分布抽样</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">反复评估 fθ</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">状态与时间共同输入</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">x₀：数据</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">积分后的样本</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">网络输出局部速度；求解器负责推进状态</text></g></svg>
