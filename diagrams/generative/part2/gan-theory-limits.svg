<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">理想最优解不保证训练收敛</title><desc id="desc">固定容量网络未必能表达最优 G 和 D；有限数据、优化误差和双方持续变化的目标进一步影响训练。交替梯度更新也可能振荡，或只覆盖少量数据模式。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">理想最优解不保证训练收敛</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">表达能力</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">有限网络不一定能表示</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">统计误差</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">有限数据与泛化</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">优化动态</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">交替更新可能振荡</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">样本质量与模式覆盖分别评价</text></g></svg>
