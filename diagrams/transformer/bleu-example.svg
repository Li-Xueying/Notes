<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="the cat sat on the mat 的算例"><title>the cat sat on the mat 的算例</title><desc>一元 5/6，二元 3/5，BP=1；二元等权 BLEU≈0.707。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">the cat sat on the mat 的算例</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">参考：the cat is on the mat</text><text x="80" y="133" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">候选：the cat sat on the mat</text><text x="80" y="181" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">参考：the cat is on the mat</text><text x="80" y="229" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">一元：the ×2、cat、on、mat → 5/6</text><text x="80" y="277" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">二元：the cat、on the、the mat → 3/5</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">BP = 1；BLEU₂ = √((5/6) × (3/5)) ≈ 0.7071</text></g></svg>
