<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="Word2Vec 怎样训练"><title>Word2Vec 怎样训练</title><desc>随机初始化后从大量窗口产生训练词对，提高真实邻词的预测概率。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">Word2Vec 怎样训练</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">扫描文本 → 预测邻词 → 调整词向量</text><rect x="48" y="154" width="192" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="144" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">随机向量</text><text x="144" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">初始化参数</text><path d="M240 200 L260 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="264" y="154" width="192" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="360" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">文本窗口</text><text x="360" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">形成词对</text><path d="M456 200 L476 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="154" width="192" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="576" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">概率与损失</text><text x="576" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">预测邻词</text><path d="M672 200 L692 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="154" width="192" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="792" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">梯度更新</text><text x="792" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">调整向量</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">反复扫描大量文本窗口</text></g></svg>
