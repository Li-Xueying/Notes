<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="累计分数偏向短序列"><title>累计分数偏向短序列</title><desc>更多小于 1 的条件概率相乘会降低分数，示例用分数除以长度比较完成假设。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">累计分数偏向短序列</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">用平均对数概率校正长度</text><text x="80" y="137" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">各项 log P ≤ 0，累加使长序列的分数更低</text><text x="80" y="184" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">比较完成译文时，用平均对数概率减轻长度偏置</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">score_norm(y₁:ₜ) = (1/t) ∑ᵢ log P(y_i | y_&lt;i,x)</text></g></svg>
