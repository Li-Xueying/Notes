<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="池化如何传回梯度"><title>池化如何传回梯度</title><desc>最大值位置与均匀分配</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">池化如何传回梯度</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">最大值位置与均匀分配</text><rect x="62" y="138" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="91" y="172" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">1</text><rect x="120" y="138" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="149" y="172" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">3</text><rect x="62" y="196" width="58" height="58" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="91" y="230" fill="#263f35" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">4</text><rect x="120" y="196" width="58" height="58" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="149" y="230" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">2</text><text x="120" y="127" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">前向窗口</text><path d="M190 197 L280 197" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="305" y="126" width="210" height="142" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="410" y="190" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">Max Pool</text><text x="410" y="216" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">g 只回到 argmax = 4</text><rect x="605" y="126" width="265" height="142" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="737.5" y="190" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">Average Pool</text><text x="737.5" y="216" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">每个位置收到 g / 4</text><rect x="130" y="319" width="700" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="353" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">窗口重叠时，同一输入收到的贡献仍需相加。</text></g></svg>
