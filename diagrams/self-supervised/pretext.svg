<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">代理任务：从数据产生答案</title><desc id="desc">代理任务（pretext task）为学习表征而设计。隐藏图像区域后预测缺失内容，或施加已知旋转后预测角度，都能由原数据自动产生答案。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">代理任务：从数据产生答案</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="42" y="156" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="174" y="191" font-size="18" fill="#263f35" text-anchor="middle">原图数据</text><text x="174" y="217" font-size="14" fill="#5d7469" text-anchor="middle">无人工类别标签</text><path d="M306 197 L328 197" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="156" width="264" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="466" y="191" font-size="18" fill="#263f35" text-anchor="middle">编码器</text><text x="466" y="217" font-size="14" fill="#5d7469" text-anchor="middle">学到表征</text><path d="M598 197 L620 197" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="626" y="156" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="758" y="191" font-size="18" fill="#263f35" text-anchor="middle">代理头</text><text x="758" y="217" font-size="14" fill="#5d7469" text-anchor="middle">预测自动目标</text><path d="M797 239 V307 H425 V240" fill="none" stroke="#ac4f53" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="337" font-size="17" fill="#ac4f53" text-anchor="middle">目标比较 → 梯度更新</text></g></svg>
