<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">固定 G：提高真假分类能力</title><desc id="desc">更新判别器时，假样本由当前生成器给出并视作固定训练输入。D 增大真实项和生成项，使真实分数上升、生成分数下降。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">固定 G：提高真假分类能力</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="126" width="122" height="75" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="103" y="155" font-size="18" fill="#283b34" text-anchor="middle">噪声 z</text><text x="103" y="180" font-size="14" fill="#63766c" text-anchor="middle">简单先验</text><path d="M168 164 L204 164" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="208" y="126" width="150" height="75" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="283" y="155" font-size="18" fill="#283b34" text-anchor="middle">生成器 G</text><text x="283" y="180" font-size="14" fill="#63766c" text-anchor="middle">参数 θ</text><path d="M362 164 L398 164" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="402" y="126" width="164" height="75" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="484" y="155" font-size="18" fill="#283b34" text-anchor="middle">假样本 G(z)</text><text x="484" y="180" font-size="14" fill="#63766c" text-anchor="middle">由 G 定义 pG</text><rect x="402" y="285" width="164" height="75" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="484" y="314" font-size="18" fill="#283b34" text-anchor="middle">真实样本 x</text><text x="484" y="339" font-size="14" fill="#63766c" text-anchor="middle">来自 pdata</text><path d="M570 164 H605 V227 H646" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 322 H605 V247 H646" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="199" width="145" height="75" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="722.5" y="228" font-size="18" fill="#283b34" text-anchor="middle">判别器 D</text><text x="722.5" y="253" font-size="14" fill="#63766c" text-anchor="middle">参数 ψ</text><path d="M799 237 L835 237" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><text x="880" y="244" font-size="17" fill="#283b34" text-anchor="middle">真假分数</text><text x="284" y="111" font-size="17" fill="#63766c" text-anchor="middle">冻结 θ</text><text x="722" y="182" font-size="18" fill="#ab4d42" text-anchor="middle">更新 ψ</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">提高 D(x)，降低 D(G(z))；G 的输出停止梯度</text></g></svg>
