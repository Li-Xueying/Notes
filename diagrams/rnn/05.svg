<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="相似度与嵌入查表。矩阵选行，再比较向量方向"><title>相似度与嵌入查表</title><desc>矩阵选行，再比较向量方向。查表等价于独热向量乘嵌入矩阵；余弦相似度衡量方向接近程度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">相似度与嵌入查表</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">矩阵选行，再比较向量方向</text><rect x="55" y="112" width="285" height="174" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="197.5" y="192" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">嵌入表 E</text><text x="197.5" y="217" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">每一行对应一个词</text><text x="78" y="180" fill="#263f35" font-size="13" font-weight="400" text-anchor="start" font-family="monospace">hotel      [0.68, −0.23, 0.35]</text><text x="78" y="207" fill="#263f35" font-size="13" font-weight="400" text-anchor="start" font-family="monospace">motel      [0.71, −0.19, 0.31]</text><text x="78" y="234" fill="#263f35" font-size="13" font-weight="400" text-anchor="start" font-family="monospace">conference [−0.45, 0.79, −0.12]</text><path d="M340 197 L440 197" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><text x="390" y="189" fill="#176653" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">查表</text><rect x="465" y="124" width="175" height="146" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="552.5" y="190" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">motel</text><text x="552.5" y="215" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">[0.71, −0.19, 0.31]</text><path d="M640 197 L727 197" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><text x="683.5" y="189" fill="#176653" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">比较</text><rect x="752" y="124" width="150" height="146" rx="6" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.4"/><text x="827" y="190" fill="#263f35" font-size="22" font-weight="650" text-anchor="middle" font-family="sans-serif">cos = 0.99</text><text x="827" y="215" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">方向接近</text><rect x="195" y="317" width="570" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="348" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">cos(u,v) = uᵀv / (||u||₂ ||v||₂)</text></g></svg>
