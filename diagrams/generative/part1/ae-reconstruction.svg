<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">解码器重建输入，形成训练信号</title><desc id="desc">解码器从 z 预测重建 x̂，把原输入 x 作为目标。训练通过减小输入与重建之间的平方误差，同时更新编码器与解码器。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">解码器重建输入，形成训练信号</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="44" y="168" width="156" height="76" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="122" y="198" font-size="18" fill="#283b34" text-anchor="middle">输入 x</text><text x="122" y="223" font-size="14" fill="#63766c" text-anchor="middle">同一数据</text><path d="M204 206 L243 206" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="247" y="168" width="160" height="76" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="327" y="198" font-size="18" fill="#283b34" text-anchor="middle">编码器 fφ</text><text x="327" y="223" font-size="14" fill="#63766c" text-anchor="middle">得到潜表示 z</text><path d="M411 206 L450 206" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="454" y="168" width="96" height="76" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="502" y="212" font-size="18" fill="#283b34" text-anchor="middle">z</text><path d="M554 206 L593 206" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="597" y="168" width="160" height="76" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="677" y="198" font-size="18" fill="#283b34" text-anchor="middle">解码器 gθ</text><text x="677" y="223" font-size="14" fill="#63766c" text-anchor="middle">得到重建 x̂</text><path d="M761 206 L800 206" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="804" y="168" width="111" height="76" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="859.5" y="198" font-size="18" fill="#283b34" text-anchor="middle">重建 x̂</text><text x="859.5" y="223" font-size="14" fill="#63766c" text-anchor="middle">与 x 同维</text><path d="M859 249 V289 H477 V316" fill="none" stroke="#ab4d42" stroke-width="2" marker-end="url(#arrow)"/><path d="M122 249 V289 H477 V316" fill="none" stroke="#ab4d42" stroke-width="2" marker-end="url(#arrow)"/><rect x="325" y="320" width="304" height="53" rx="4" fill="#f9e7e3" stroke="#ccdbd2"/><text x="477" y="352.5" font-size="18" fill="#283b34" text-anchor="middle">平方误差 ‖x−x̂‖²</text><path d="M325 346 H284 V250" fill="none" stroke="#ab4d42" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="379" font-size="16" fill="#ab4d42" text-anchor="middle">误差反传到两网络</text><text x="480" y="419" font-size="17" fill="#63766c" text-anchor="middle">重建得到训练信号；特征用途还需下游评价</text></g></svg>
