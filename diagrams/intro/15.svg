<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="人工智能主要流派的发展脉络"><title>人工智能主要流派的发展脉络</title><desc>沿一条时间线串联人工智能的早期基础、符号主义、联结主义、行为主义以及现代融合发展。</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.7"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.7"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start"><tspan x="48" dy="0">人工智能主要流派的发展脉络</tspan></text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="48" dy="0">沿时间线理解不同思想的兴起；各流派长期并存并相互借鉴</tspan></text>
  <path d="M62 216 H916" stroke="#a8c2b4" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <circle cx="112" cy="216" r="9" fill="#667f72" stroke="#ffffff" stroke-width="3"/><circle cx="294" cy="216" r="9" fill="#176653" stroke="#ffffff" stroke-width="3"/><circle cx="476" cy="216" r="9" fill="#b47936" stroke="#ffffff" stroke-width="3"/><circle cx="658" cy="216" r="9" fill="#667f72" stroke="#ffffff" stroke-width="3"/><circle cx="840" cy="216" r="9" fill="#176653" stroke="#ffffff" stroke-width="3"/>
  <path d="M112 207 V187 M294 225 V240 M476 207 V187 M658 225 V240 M840 207 V187" stroke="#a8c2b4" stroke-width="1.5" fill="none"/>
  <rect x="30" y="98" width="164" height="89" rx="8" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.6"/><text x="112" y="129" fill="#263f35" font-size="16" font-weight="600" text-anchor="middle"><tspan x="112" dy="0">1940s–50s</tspan></text><text x="112" y="156" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="112" dy="0">早期基础</tspan><tspan x="112" dy="20">逻辑 · 控制论 · 形式神经元</tspan></text>
  <rect x="212" y="240" width="164" height="89" rx="8" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.6"/><text x="294" y="271" fill="#263f35" font-size="16" font-weight="600" text-anchor="middle"><tspan x="294" dy="0">1950s</tspan></text><text x="294" y="298" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="294" dy="0">符号主义</tspan><tspan x="294" dy="20">符号 · 规则 · 逻辑推理</tspan></text>
  <rect x="394" y="98" width="164" height="89" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="476" y="129" fill="#263f35" font-size="16" font-weight="600" text-anchor="middle"><tspan x="476" dy="0">1950s–60s</tspan></text><text x="476" y="156" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="476" dy="0">联结主义</tspan><tspan x="476" dy="20">感知机 · 神经元连接</tspan></text>
  <rect x="576" y="240" width="164" height="89" rx="8" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.6"/><text x="658" y="271" fill="#263f35" font-size="16" font-weight="600" text-anchor="middle"><tspan x="658" dy="0">1980s–现在</tspan></text><text x="658" y="298" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="658" dy="0">行为主义</tspan><tspan x="658" dy="20">感知—行动 · 环境反馈</tspan></text>
  <rect x="758" y="98" width="164" height="89" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="840" y="129" fill="#263f35" font-size="16" font-weight="600" text-anchor="middle"><tspan x="840" dy="0">2010s–现在</tspan></text><text x="840" y="156" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="840" dy="0">融合发展</tspan><tspan x="840" dy="20">深度学习 · 强化学习 · 规则</tspan></text>
  <text x="916" y="241" fill="#667f72" font-size="12" font-weight="400" text-anchor="end"><tspan x="916" dy="0">时间</tspan></text>
  <text x="480" y="382" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">三种流派并非依次取代：现代系统常把学习、反馈、知识与规则组合起来。</tspan></text></g></svg>
