<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="BatchNorm 的训练与推理"><title>BatchNorm 的训练与推理</title><desc>统计量来源不同，仿射变换保持一致</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">BatchNorm 的训练与推理</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">统计量来源不同，仿射变换保持一致</text><rect x="55" y="125" width="200.5" height="84" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="155.25" y="160" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">训练激活</text><text x="155.25" y="186" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">当前批次</text><path d="M255.5 167 L268.5 167" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="271.5" y="125" width="200.5" height="84" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="371.75" y="160" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">μc, σc²</text><text x="371.75" y="186" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">跨 N,H,W</text><path d="M472 167 L485 167" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="488" y="125" width="200.5" height="84" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="588.25" y="160" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">标准化</text><text x="588.25" y="186" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">X̂</text><path d="M688.5 167 L701.5 167" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="704.5" y="125" width="200.5" height="84" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="804.75" y="160" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">γc, βc</text><text x="804.75" y="186" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">可学习仿射</text><rect x="55" y="238" width="200.5" height="70" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="155.25" y="266" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">推理激活</text><text x="155.25" y="292" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">单个/小批次</text><path d="M255.5 273 L268.5 273" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="271.5" y="238" width="200.5" height="70" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="371.75" y="266" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">移动统计</text><text x="371.75" y="292" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">训练期累计</text><path d="M472 273 L485 273" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="488" y="238" width="200.5" height="70" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="588.25" y="266" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">标准化</text><text x="588.25" y="292" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">X̂</text><path d="M688.5 273 L701.5 273" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="704.5" y="238" width="200.5" height="70" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="804.75" y="266" fill="#263f35" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">γc, βc</text><text x="804.75" y="292" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">同一组参数</text><rect x="110" y="334" width="740" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="368" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">X̂ = (X − μc) / √(σc² + ε)      Y = γcX̂ + βc</text></g></svg>
