<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">对未观测的潜变量积分</title><desc id="desc">若每个训练样本都附有真实 z，就能直接训练条件生成器。实际只观察到 x，需要对所有可能的 z 边缘化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">对未观测的潜变量积分</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="57" y="141" width="245" height="100" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="179.5" y="171" font-size="18" fill="#283b34" text-anchor="middle">训练只看到 x</text><text x="179.5" y="196" font-size="14" fill="#63766c" text-anchor="middle">真实 z 未观测</text><rect x="355" y="141" width="547" height="100" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="628.5" y="171" font-size="18" fill="#283b34" text-anchor="middle">汇总所有可能的潜变量解释</text><text x="628.5" y="196" font-size="14" fill="#63766c" text-anchor="middle">pθ(x|z) × p(z)，对整个 z 空间积分</text><path d="M307 191 L350 191" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="136" y="299" width="688" height="69" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="329" font-size="18" fill="#283b34" text-anchor="middle">固定 z 的两个因子可算 ≠ 积分容易计算</text><text x="480" y="354" font-size="14" fill="#63766c" text-anchor="middle">非线性解码器使高维边缘化通常难有解析解</text></g></svg>
