<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="数据量 × 任务相似性"><title>数据量 × 任务相似性</title><desc>较早层的特征较通用，靠近分类输出的特征更专门</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">数据量 × 任务相似性</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">较早层的特征较通用，靠近分类输出的特征更专门</text><rect x="55" y="100" width="850" height="224" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><path d="M230 100 L230 324" stroke="#a8c2b4" stroke-width="2" fill="none"/><path d="M565 100 L565 324" stroke="#a8c2b4" stroke-width="2" fill="none"/><path d="M55 151 L905 151" stroke="#a8c2b4" stroke-width="2" fill="none"/><path d="M55 237 L905 237" stroke="#a8c2b4" stroke-width="2" fill="none"/><text x="398" y="131" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">任务相似</text><text x="735" y="131" fill="#263f35" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">任务差异大</text><text x="142" y="198" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">数据少</text><text x="142" y="283" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">数据多</text><text x="398" y="185" fill="#263f35" font-size="16" font-weight="400" text-anchor="middle" font-family="sans-serif">冻结主干</text><text x="398" y="210" fill="#263f35" font-size="16" font-weight="400" text-anchor="middle" font-family="sans-serif">训练末端分类器</text><text x="735" y="185" fill="#b47936" font-size="16" font-weight="400" text-anchor="middle" font-family="sans-serif">换更接近的预训练模型</text><text x="735" y="210" fill="#b47936" font-size="16" font-weight="400" text-anchor="middle" font-family="sans-serif">或收集更多数据</text><text x="398" y="286" fill="#263f35" font-size="16" font-weight="400" text-anchor="middle" font-family="sans-serif">微调更多层或全部层</text><text x="735" y="286" fill="#263f35" font-size="16" font-weight="400" text-anchor="middle" font-family="sans-serif">全面微调或从头训练</text><text x="480" y="369" fill="#667f72" font-size="17" font-weight="400" text-anchor="middle" font-family="sans-serif">根据验证集判断迁移收益与过拟合，再调整训练范围。</text></g></svg>
