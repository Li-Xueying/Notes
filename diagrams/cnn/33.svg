<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="AlexNet"><title>AlexNet</title><desc>更深网络进入大规模图像分类</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">AlexNet</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">更深网络进入大规模图像分类</text><rect x="42" y="120" width="124.6" height="92" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="104.3" y="159" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">输入</text><text x="104.3" y="185" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">227×227</text><path d="M166.6 166 L173.6 166" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="176.6" y="120" width="124.6" height="92" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="238.89999999999998" y="159" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">5× Conv</text><text x="238.89999999999998" y="185" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">逐层提取</text><path d="M301.2 166 L308.2 166" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="311.2" y="120" width="124.6" height="92" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="373.5" y="159" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">3× Pool</text><text x="373.5" y="185" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">下采样</text><path d="M435.79999999999995 166 L442.79999999999995 166" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="445.79999999999995" y="120" width="124.6" height="92" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="508.09999999999997" y="159" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">3× FC</text><text x="508.09999999999997" y="185" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">分类</text><path d="M570.4 166 L577.4 166" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="580.4" y="120" width="124.6" height="92" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="642.6999999999999" y="159" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">输出</text><text x="642.6999999999999" y="185" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">1000 类</text><rect x="750" y="112" width="165" height="188" rx="7" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="832.5" y="199" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">训练配置</text><text x="832.5" y="225" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">Dropout · GPU 加速</text><text x="832" y="199" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">约 6000 万参数</text><text x="832" y="222" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">模型大小约 240M</text><text x="832" y="245" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">双 GPU 拆分数据</text><text x="832" y="268" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">分别训练并融合</text><rect x="120" y="319" width="720" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="353" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">2012 年以 16.4% 的显著优势赢得 ILSVRC</text></g></svg>
