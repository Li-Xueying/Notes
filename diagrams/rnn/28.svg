<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="生成隐藏输出。输出门决定暴露多少细胞内容"><title>生成隐藏输出</title><desc>输出门决定暴露多少细胞内容。更新后的细胞状态继续向后传，隐藏状态服务当前输出与下一步。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">生成隐藏输出</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">输出门决定暴露多少细胞内容</text><rect x="65" y="145" width="190" height="96" rx="6" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.4"/><text x="160" y="186" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">新细胞状态</text><text x="160" y="211" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">c_t</text><path d="M255 193 L360 193" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><text x="307.5" y="185" fill="#176653" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">tanh</text><rect x="385" y="145" width="160" height="96" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="465" y="186" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">候选输出</text><text x="465" y="211" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">tanh(c_t)</text><circle cx="625" cy="193" r="30" fill="#e9f3ee" stroke="#176653" stroke-width="1.5"/><text x="625" y="202" fill="#176653" font-size="27" font-weight="700" text-anchor="middle" font-family="sans-serif">⊙</text><path d="M545 193 L595 193" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M625 286 L625 223" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="560" y="286" width="130" height="32" rx="16" fill="#176653" stroke="#176653" stroke-width="1.4"/><text x="625" y="307" fill="#ffffff" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">输出门 o_t</text><path d="M655 193 L760 193" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="780" y="145" width="115" height="96" rx="6" fill="#eaf1f4" stroke="#a8c2b4" stroke-width="1.4"/><text x="837.5" y="186" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">隐藏状态</text><text x="837.5" y="211" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">h_t</text><rect x="220" y="322" width="520" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="353" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">h_t = o_t ⊙ tanh(c_t)</text></g></svg>
