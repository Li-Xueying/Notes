<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="卷积层如何生成整张特征图"><title>卷积层如何生成整张特征图</title><desc>用输入 0 到 8 和 2×2 核逐格算出 19、25、37、43。相邻输出对应相邻窗口，所有位置使用同一组参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">卷积层如何生成整张特征图</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">移动输入窗口，复用相同的核参数</text><rect x="72" y="118" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="97" y="148" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">0</text><rect x="122" y="118" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="147" y="148" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">1</text><rect x="172" y="118" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="197" y="148" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">2</text><rect x="72" y="168" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="97" y="198" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">3</text><rect x="122" y="168" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="147" y="198" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">4</text><rect x="172" y="168" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="197" y="198" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">5</text><rect x="72" y="218" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="97" y="248" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">6</text><rect x="122" y="218" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="147" y="248" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">7</text><rect x="172" y="218" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="197" y="248" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">8</text><text x="147" y="107" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">输入 X</text><g data-window="input" transform="translate(72 118)"><rect width="100" height="100" fill="none" stroke="#b47936" stroke-width="3"/></g><rect x="340" y="144" width="48" height="48" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="364" y="173" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">0</text><rect x="388" y="144" width="48" height="48" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="412" y="173" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">1</text><rect x="340" y="192" width="48" height="48" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="364" y="221" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">2</text><rect x="388" y="192" width="48" height="48" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="412" y="221" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">3</text><text x="388" y="133" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">共享核 K</text><path d="M452 194 L560 194" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><text x="506" y="185" fill="#176653" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">对应相乘、求和</text><rect x="595" y="144" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="convolution" data-index="0"><text x="620" y="174" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">19</text></g><rect x="645" y="144" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="convolution" data-index="1"><text x="670" y="174" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">25</text></g><rect x="595" y="194" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="convolution" data-index="2"><text x="620" y="224" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">37</text></g><rect x="645" y="194" width="50" height="50" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><g data-output-cell="convolution" data-index="3"><text x="670" y="224" fill="#263f35" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">43</text></g><text x="645" y="133" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">输出特征图</text><g data-window="output-convolution" transform="translate(595 144)"><rect width="50" height="50" fill="none" stroke="#b47936" stroke-width="3"/></g><g data-window-equation=""><rect x="70" y="319" width="820" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="353" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">y₀₀ = 0×0 + 1×1 + 3×2 + 4×3 = 19</text></g></g></svg>
