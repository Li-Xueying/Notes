<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="性能提高之后仍有难点"><title>性能提高之后仍有难点</title><desc>评估需关注数据和语言环境。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">性能提高之后仍有难点</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">未知词、领域、长上下文与低资源</text><rect x="48" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="180" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">未知词 / 领域</text><text x="180" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">训练分布差异</text><path d="M312 200 L332 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="336" y="154" width="264" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="468" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">长上下文</text><text x="468" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">跨句信息</text><path d="M600 200 L620 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="756" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">低资源语言</text><text x="756" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">平行数据不足</text></g></svg>
