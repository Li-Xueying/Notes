<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="为什么需要负采样。完整 Softmax 的分母遍历整个词表"><title>为什么需要负采样</title><desc>完整 Softmax 的分母遍历整个词表。词表很大时，一次样本若更新所有输出向量，计算成本过高。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">为什么需要负采样</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">完整 Softmax 的分母遍历整个词表</text><rect x="55" y="119" width="390" height="176" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="250" y="200" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">完整 Softmax</text><text x="250" y="225" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">每次样本扫描 |V| 个输出向量</text><text x="250" y="196" fill="#667f72" font-size="15" font-weight="400" text-anchor="middle" font-family="sans-serif">10 万词表</text><text x="250" y="223" fill="#667f72" font-size="15" font-weight="400" text-anchor="middle" font-family="sans-serif">→ 10 万次打分</text><text x="250" y="250" fill="#667f72" font-size="15" font-weight="400" text-anchor="middle" font-family="sans-serif">→ 10 万项归一化</text><rect x="515" y="119" width="390" height="176" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="710" y="200" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">负采样</text><text x="710" y="225" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">1 个真实词 + K 个噪声词</text><text x="710" y="196" fill="#667f72" font-size="15" font-weight="400" text-anchor="middle" font-family="sans-serif">K = 5（演示）</text><text x="710" y="223" fill="#667f72" font-size="15" font-weight="400" text-anchor="middle" font-family="sans-serif">→ 6 次打分</text><text x="710" y="250" fill="#667f72" font-size="15" font-weight="400" text-anchor="middle" font-family="sans-serif">→ 局部二分类</text><rect x="235" y="319" width="490" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="350" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">计算范围：O(|V|) → O(K)</text></g></svg>
