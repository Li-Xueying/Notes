<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">从先验取 z，仅运行解码器</title><desc id="desc">生成新样本时先从 p(z)=N(0,I) 抽样，再计算 pθ(x|z)，最后从该条件分布抽出 x。无需给定真实输入，也不经过编码器。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">从先验取 z，仅运行解码器</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="163" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="171.33333333333334" y="193" font-size="18" fill="#283b34" text-anchor="middle">采样 z ~ N(0,I)</text><text x="171.33333333333334" y="218" font-size="14" fill="#63766c" text-anchor="middle">不需要真实输入</text><path d="M304.6666666666667 206 L346.6666666666667 206" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350.6666666666667" y="163" width="258.6666666666667" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="193" font-size="18" fill="#283b34" text-anchor="middle">解码器 μθ(z)</text><text x="480" y="218" font-size="14" fill="#63766c" text-anchor="middle">均值图像</text><path d="M613.3333333333334 206 L655.3333333333334 206" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="659.3333333333334" y="163" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="788.6666666666667" y="193" font-size="18" fill="#283b34" text-anchor="middle">条件采样 x</text><text x="788.6666666666667" y="218" font-size="14" fill="#63766c" text-anchor="middle">再加入观察噪声 τξ</text><text x="480" y="405" font-size="17" fill="#63766c" text-anchor="middle">编码器服务于训练推断；新样本生成从先验开始</text></g></svg>
