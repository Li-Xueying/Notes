<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="窗口怎样产生训练词对"><title>窗口怎样产生训练词对</title><desc>半径 2 的完整窗口产生四个词对；中心移动，预测目标随之改变。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">窗口怎样产生训练词对</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">中心词从 into 移到 banking</text><rect x="48" y="135" width="136" height="54" rx="4" fill="white" stroke="#a8c2b4"/><text x="116" y="168" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">problems</text><rect x="192" y="135" width="136" height="54" rx="4" fill="white" stroke="#a8c2b4"/><text x="260" y="168" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">turning</text><rect x="336" y="135" width="136" height="54" rx="4" fill="white" stroke="#a8c2b4"/><text x="404" y="168" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">into</text><rect x="480" y="135" width="136" height="54" rx="4" fill="white" stroke="#a8c2b4"/><text x="548" y="168" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">banking</text><rect x="624" y="135" width="136" height="54" rx="4" fill="white" stroke="#a8c2b4"/><text x="692" y="168" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">crises</text><rect x="768" y="135" width="136" height="54" rx="4" fill="white" stroke="#a8c2b4"/><text x="836" y="168" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">as</text><g  transform="translate(48 128)"><rect width="712" height="68" rx="0" fill="none" stroke="#b47936" stroke-width="3"/><rect x="288" width="136" height="6