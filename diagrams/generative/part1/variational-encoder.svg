<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">学习 qφ(z|x)，近似 pθ(z|x)</title><desc id="desc">变分推断（variational inference）引入可计算的 qφ(z|x)，近似真实后验 pθ(z|x)。编码器接收观测 x，输出潜变量的分布；解码器接收 z，输出数据的条件分布。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">学习 qφ(z|x)，近似 pθ(z|x)</text><path d="M42 63 H918" stroke="#ccdbd2"/><text x="113" y="121" font-size="19" fill="#283b34" text-anchor="middle">推断路径</text><rect x="42" y="140" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="171.33333333333334" y="170" font-size="18" fill="#283b34" text-anchor="middle">观测 x</text><text x="171.33333333333334" y="195" font-size="14" fill="#63766c" text-anchor="middle">编码器输入</text><path d="M304.6666666666667 183 L346.6666666666667 183" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350.6666666666667" y="140" width="258.6666666666667" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="170" font-size="18" fill="#283b34" text-anchor="middle">变分编码器 qφ</text><text x="480" y="195" font-size="14" fill="#63766c" text-anchor="middle">学习近似后验</text><path d="M613.3333333333334 183 L655.3333333333334 183" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="659.3333333333334" y="140" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="788.6666666666667" y="170" font-size="18" fill="#283b34" text-anchor="middle">潜变量 z</text><text x="788.6666666666667" y="195" font-size="14" fill="#63766c" text-anchor="middle">分布而非单点</text><text x="113" y="292" font-size="19" fill="#283b34" text-anchor="middle">生成路径</text><rect x="42" y="310" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="171.33333333333334" y="340" font-size="18" fill="#283b34" text-anchor="middle">潜变量 z</text><text x="171.33333333333334" y="365" font-size="14" fill="#63766c" text-anchor="middle">解码器输入</text><path d="M304.6666666666667 353 L346.6666666666667 353" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350.6666666666667" y="310" width="258.6666666666667" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="340" font-size="18" fill="#283b34" text-anchor="middle">生成解码器 pθ</text><text x="480" y="365" font-size="14" fill="#63766c" text-anchor="middle">学习条件分布</text><path d="M613.3333333333334 353 L655.3333333333334 353" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="659.3333333333334" y="310" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="788.6666666666667" y="340" font-size="18" fill="#283b34" text-anchor="middle">观测 x</text><text x="788.6666666666667" y="365" font-size="14" fill="#63766c" text-anchor="middle">数据空间</text></g></svg>
