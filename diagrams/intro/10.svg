<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="图灵测试：电子通讯中的多轮问答"><title>图灵测试：电子通讯中的多轮问答</title><desc>人类询问者通过电子通讯设备与身份隐藏的人类和机器进行多轮文字问答，再根据回答判断身份；示例问题是你会下国际象棋吗。</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.7"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.7"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start"><tspan x="48" dy="0">图灵测试：电子通讯中的多轮问答</tspan></text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="48" dy="0">询问者看不到回答者，只根据文字回答判断对方是人类还是机器</tspan></text>
  <rect x="25" y="110" width="180" height="155" rx="8" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.6"/><text x="115" y="141" fill="#263f35" font-size="17" font-weight="600" text-anchor="middle"><tspan x="115" dy="0">人类回答者 A</tspan></text><text x="115" y="168" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="115" dy="0">身份隐藏</tspan></text>
  <rect x="390" y="110" width="180" height="155" rx="8" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.6"/><text x="480" y="141" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="480" dy="0">人类询问者</tspan></text><text x="480" y="168" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">通过电子通讯设备</tspan><tspan x="480" dy="20">比较多轮回答</tspan><tspan x="480" dy="20">判断回答者身份</tspan></text>
  <rect x="755" y="110" width="180" height="155" rx="8" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.6"/><text x="845" y="141" fill="#263f35" font-size="17" font-weight="600" text-anchor="middle"><tspan x="845" dy="0">机器回答者 B</tspan></text><text x="845" y="168" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="845" dy="0">身份隐藏</tspan></text>
  <path d="M390 118 L208 118" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><path d="M390 174 L208 174" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><path d="M390 230 L208 230" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M208 138 L387 138" stroke="#b47936" stroke-width="2.2" fill="none" marker-end="url(#arrow-orange)"/><path d="M208 194 L387 194" stroke="#b47936" stroke-width="2.2" fill="none" marker-end="url(#arrow-orange)"/><path d="M208 250 L387 250" stroke="#b47936" stroke-width="2.2" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M570 118 L752 118" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><path d="M570 174 L752 174" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><path d="M570 230 L752 230" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M752 138 L573 138" stroke="#b47936" stroke-width="2.2" fill="none" marker-end="url(#arrow-orange)"/><path d="M752 194 L573 194" stroke="#b47936" stroke-width="2.2" fill="none" marker-end="url(#arrow-orange)"/><path d="M752 250 L573 250" stroke="#b47936" stroke-width="2.2" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="298" y="114" fill="#176653" font-size="10.5" font-weight="600" text-anchor="middle"><tspan x="298" dy="0">1 问：你会下国际象棋吗？</tspan></text><text x="298" y="170" fill="#176653" font-size="10.5" font-weight="600" text-anchor="middle"><tspan x="298" dy="0">2 问：你会下国际象棋吗？</tspan></text><text x="298" y="226" fill="#176653" font-size="10.5" font-weight="600" text-anchor="middle"><tspan x="298" dy="0">3 问：你会下国际象棋吗？</tspan></text>
  <text x="298" y="134" fill="#b47936" font-size="10.5" font-weight="600" text-anchor="middle"><tspan x="298" dy="0">答：是的。</tspan></text>
  <text x="298" y="190" fill="#b47936" font-size="9.5" font-weight="600" text-anchor="middle"><tspan x="298" dy="0">答：我不是已经说过了吗？</tspan></text>
  <text x="298" y="246" fill="#b47936" font-size="9.5" font-weight="600" text-anchor="middle"><tspan x="298" dy="0">答：干嘛总问同样的问题？</tspan></text>
  <text x="662" y="114" fill="#176653" font-size="10.5" font-weight="600" text-anchor="middle"><tspan x="662" dy="0">1 问：你会下国际象棋吗？</tspan></text><text x="662" y="170" fill="#176653" font-size="10.5" font-weight="600" text-anchor="middle"><tspan x="662" dy="0">2 问：你会下国际象棋吗？</tspan></text><text x="662" y="226" fill="#176653" font-size="10.5" font-weight="600" text-anchor="middle"><tspan x="662" dy="0">3 问：你会下国际象棋吗？</tspan></text>
  <text x="662" y="134" fill="#b47936" font-size="10.5" font-weight="600" text-anchor="middle"><tspan x="662" dy="0">答：是的。</tspan></text><text x="662" y="190" fill="#b47936" font-size="10.5" font-weight="600" text-anchor="middle"><tspan x="662" dy="0">答：是的。</tspan></text><text x="662" y="246" fill="#b47936" font-size="10.5" font-weight="600" text-anchor="middle"><tspan x="662" dy="0">答：是的。</tspan></text>
  <text x="480" y="291" fill="#667f72" font-size="11" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">绿色箭头：询问者提问　　橙色箭头：回答者回答</tspan></text>
  <rect x="75" y="306" width="810" height="91" rx="8" fill="#fbf0dd" stroke="#d2af7d" stroke-width="1.5"/>
  <text x="480" y="338" fill="#263f35" font-size="13" font-weight="650" text-anchor="middle"><tspan x="480" dy="0">询问者依据多轮文字交互判断身份；结论取决于具体的受测条件。</tspan></text>
  <text x="480" y="368" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">自然的对话表现不能单独证明理解、意识或通用智能。</tspan></text></g></svg>
