<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="用容量因子控制缓冲区"><title>用容量因子控制缓冲区</title><desc>6 个 token / 3 个专家 × 1.0 = 容量 2。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">用容量因子控制缓冲区</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">6 个 token / 3 个专家 × 1.0 = 容量 2</text><text x="80" y="133" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">6 个 token，3 个专家：平均 2 个 / 专家</text><text x="80" y="181" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">容量因子 1.0：单专家容量 2，偏斜路由可能溢出</text><text x="80" y="229" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">容量因子 1.5：单专家容量 3，允许更多偏斜，也有空槽</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">C = ceil(c × T / E)；激活路径数改变时需核对容量约定</text></g></svg>
