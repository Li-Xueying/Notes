<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="专家满员后，token 如何继续？"><title>专家满员后，token 如何继续？</title><desc>每个专家容量为 3。先尝试备选专家；两个候选都满员时，走残差而跳过当前专家分支。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">专家满员后，token 如何继续？</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">备选专家也满员时，跳过当前专家分支</text><rect x="48" y="103" width="114" height="45" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="105" y="131.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">What</text><rect x="172" y="103" width="114" height="45" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="229" y="131.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">is</text><rect x="296" y="103" width="114" height="45" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="353" y="131.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Mixture</text><rect x="420" y="103" width="114" height="45" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="477" y="131.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">of</text><rect x="544" y="103" width="114" height="45" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="601" y="131.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Experts</text><rect x="668" y="103" width="114" height="45" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="725" y="131.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">?</text><rect x="792" y="103" width="114" height="45" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="849" y="131.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Summarize</text><rect x="155" y="221" width="250" height="128" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="280" y="278" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">E1</text><text x="280" y="306" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">容量 3</text><rect x="556" y="221" width="250" height="128" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="681" y="278" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">E4</text><text x="681" y="306" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">容量 3</text><path d="M105 148 L250 221" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="164" y="305" width="70" height="33" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="199" y="327.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">What</text><path d="M229 148 L277 221" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="241" y="305" width="70" height="33" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="276" y="327.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">is</text><path d="M353 148 L304 221" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="318" y="305" width="70" height="33" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="353" y="327.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Mixture</text><path d="M477 148 L650 221" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="565" y="305" width="70" height="33" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="600" y="327.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">of</text><path d="M601 148 L677 221" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="642" y="305" width="70" height="33" rx="4" fill="#eaf1f4" stroke="#a8