<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="先隔离解码器自身的路径"><title>先隔离解码器自身的路径</title><desc>Masked self-attention + FFN。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">先隔离解码器自身的路径</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">Masked self-attention + FFN</text><rect x="46" y="161" width="193" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="142.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">已有目标前缀</text><text x="142.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">含位置表示</text><path d="M239 207 L259 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="263" y="161" width="193" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="359.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Masked MHA</text><text x="359.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">只读取前缀</text><path d="M456 207 L476 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="161" width="193" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="576.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">FFN</text><text x="576.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">逐位置变换</text><path d="M673 207 L693 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="697" y="161" width="193" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="793.5" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">输出预测</text><text x="793.5" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">下一个 token</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">每个子层配残差和归一化；稍后接入源侧交叉注意力</text></g></svg>
