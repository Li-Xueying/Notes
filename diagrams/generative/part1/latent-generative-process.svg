<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">先采 z，再生成 x</title><desc id="desc">VAE 假设观测样本由潜在因素 z 生成。生成过程先从简单先验 p(z) 取样，再从解码器给出的 pθ(x|z) 取样。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">先采 z，再生成 x</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="172" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="171.33333333333334" y="202" font-size="18" fill="#283b34" text-anchor="middle">已知先验 p(z)</text><text x="171.33333333333334" y="227" font-size="14" fill="#63766c" text-anchor="middle">标准高斯 N(0,I)</text><path d="M304.6666666666667 215 L346.6666666666667 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350.6666666666667" y="172" width="258.6666666666667" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="202" font-size="18" fill="#283b34" text-anchor="middle">采样潜变量 z</text><text x="480" y="227" font-size="14" fill="#63766c" text-anchor="middle">生成起点</text><path d="M613.3333333333334 215 L655.3333333333334 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="659.3333333333334" y="172" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="788.6666666666667" y="202" font-size="18" fill="#283b34" text-anchor="middle">条件分布 pθ(x|z)</text><text x="788.6666666666667" y="227" font-size="14" fill="#63766c" text-anchor="middle">再从中采样 x</text><text x="480" y="405" font-size="17" fill="#63766c" text-anchor="middle">生成方向 z → x；模型学习如何把简单随机性转成数据结构</text></g></svg>
