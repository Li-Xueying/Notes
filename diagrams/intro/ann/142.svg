<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="连续值与离散类别"><title>连续值与离散类别</title><desc>把连续特征映射到事先定义的区间 这是特征变换示意，不规定任何临床判断阈值。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><path d="M120 262 L840 262" stroke="#a8c2b4" stroke-width="4" fill="none"/><rect x="120" y="193" width="237" height="69" rx="5" fill="#ecf3f8"/><text x="240" y="236" fill="#263f35" font-size="22" font-weight="400" text-anchor="middle"><tspan x="240" dy="0">区间 A</tspan></text><rect x="360" y="193" width="237" height="69" rx="5" fill="#e9f3ee"/><text x="480" y="236" fill="#263f35" font-size="22" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">区间 B</tspan></text><rect x="600" y="193" width="237" height="69" rx="5" fill="#fbf0dd"/><text x="720" y="236" fill="#263f35" font-size="22" font-weight="400" text-anchor="middle"><tspan x="720" dy="0">区间 C</tspan></text><text x="480" y="309" fill="#667f72" font-size="19" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">连续观测值</tspan></text><path d="M480 332 L480 368" stroke="#176653" stroke-width="2" fill="none"/><path d="M475.84398742012667 360.01704569498645 L480 368 L484.15601257987333 360.01704569498645" fill="none" stroke="#176653" stroke-width="2"/><rect x="285" y="390" width="390" height="55" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="480" y="424.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="480" dy="0">区间标签 / 类别编码</tspan></text></g></svg>