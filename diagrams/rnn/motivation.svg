<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="从识别一张图到理解一段序列"><title>从识别一张图到理解一段序列</title><desc>前馈网络可以给图片分类；读取算式时，需要依次更新中间结果，最终得到 2。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">从识别一张图到理解一段序列</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">one minus two plus three：顺序决定运算过程</text><rect x="55" y="100" width="330" height="84" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="220" y="135" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">图片 → 前馈网络 → cat</text><text x="220" y="163" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">固定输入的图像分类</text><text x="600" y="131" font-size="24" fill="#263f35" text-anchor="middle" font-weight="650">one minus two plus three</text><rect x="48" y="218" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="180" y="257" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">读入 one</text><text x="180" y="285" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">当前值 1</text><path d="M312 264 L332 264" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="336" y="218" width="264" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="468" y="257" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">减去 two</text><text x="468" y="285" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">当前值 −1</text><path d="M600 264 L620 264" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="218" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="756" y="257" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">加上 three</text><text x="756" y="285" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">结果 2</text><text x="480" y="365" font-size="17" fill="#176653" text-anchor="middle" font-weight="400">序列需要保留中间状态，并按输入顺序更新</text></g></svg>
