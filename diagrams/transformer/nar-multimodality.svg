<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="并行速度与输出一致性的取舍"><title>并行速度与输出一致性的取舍</title><desc>一个输入的多个合理输出模式，可能被独立位置预测混合；任务决定速度与质量的取舍。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">并行速度与输出一致性的取舍</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">同一输入可能对应多种合理输出</text><rect x="46" y="161" width="265.3333333333333" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="178.66666666666666" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">同一个输入</text><text x="178.66666666666666" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">多个合理答案</text><path d="M311.3333333333333 207 L331.3333333333333 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="335.3333333333333" y="161" width="265.3333333333333" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="468" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">逐位置独立选择</text><text x="468" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">可能混合不同模式</text><path d="M600.6666666666666 207 L620.6666666666666 207" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="624.6666666666666" y="161" width="265.3333333333333" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="757.3333333333333" y="200" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">生成取舍</text><text x="757.3333333333333" y="228" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">速度与一致性</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">任务与依赖结构决定并行生成的适用方式</text></g></svg>
