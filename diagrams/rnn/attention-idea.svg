<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="每个解码步直接连接源状态"><title>每个解码步直接连接源状态</title><desc>先建立图解直觉：保留各编码状态，当前解码状态决定关注分布。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">每个解码步直接连接源状态</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">每轮选择相关源位置</text><rect x="85" y="123" width="145" height="78" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="157.5" y="155" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">源状态 h1</text><text x="157.5" y="183" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">il</text><path d="M157 201 L480 279" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="300" y="123" width="145" height="78" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="372.5" y="155" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">源状态 h2</text><text x="372.5" y="183" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">a</text><path d="M372 201 L480 279" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="515" y="123" width="145" height="78" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="587.5" y="155" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">源状态 h3</text><text x="587.5" y="183" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">m’</text><path d="M587 201 L480 279" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="123" width="145" height="78" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="802.5" y="155" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">源状态 h4</text><text x="802.5" y="183" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">entarté</text><path d="M802 201 L480 279" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="360" y="280" width="240" height="65" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="480" y="305.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">当前解码状态</text><text x="480" y="333.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">每轮直接访问源位置</text><text x="480" y="101" font-size="16" fill="#176653" text-anchor="middle" font-weight="400">完整编码状态序列保持可访问</text><text x="480" y="389" font-size="17" fill="#667f72" text-anchor="middle" font-weight="400">生成不同目标词时，重新选择所需的源信息</text></g></svg>
