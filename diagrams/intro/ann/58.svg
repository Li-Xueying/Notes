<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="激活函数的选择"><title>激活函数的选择</title><desc>把输出形式、梯度特性与使用位置联系起来 </desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="58" y="140" width="281.3333333333333" height="55" fill="#e9f3ee"/><text x="70" y="173.5" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="70" dy="0">函数</tspan></text><rect x="339.3333333333333" y="140" width="281.3333333333333" height="55" fill="#e9f3ee"/><text x="351.3333333333333" y="173.5" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="351.3333333333333" dy="0">输出特点</tspan></text><rect x="620.6666666666666" y="140" width="281.3333333333333" height="55" fill="#e9f3ee"/><text x="632.6666666666666" y="173.5" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="632.6666666666666" dy="0">需要留意</tspan></text><rect x="58" y="195" width="281.3333333333333" height="55" fill="#f7faf8"/><text x="70" y="228.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="70" dy="0">ReLU</tspan></text><rect x="339.3333333333333" y="195" width="281.3333333333333" height="55" fill="#f7faf8"/><text x="351.3333333333333" y="228.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="351.3333333333333" dy="0">分段线性，负区间为 0</tspan></text><rect x="620.6666666666666" y="195" width="281.3333333333333" height="55" fill="#f7faf8"/><text x="632.6666666666666" y="228.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="632.6666666666666" dy="0">负区间可能停止更新</tspan></text><rect x="58" y="250" width="281.3333333333333" height="55" fill="#ffffff"/><text x="70" y="283.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Sigmoid</tspan></text><rect x="339.3333333333333" y="250" width="281.3333333333333" height="55" fill="#ffffff"/><text x="351.3333333333333" y="283.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="351.3333333333333" dy="0">输出位于 (0,1)</tspan></text><rect x="620.6666666666666" y="250" width="281.3333333333333" height="55" fill="#ffffff"/><text x="632.6666666666666" y="283.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="632.6666666666666" dy="0">两端饱和，梯度变小</tspan></text><rect x="58" y="305" width="281.3333333333333" height="55" fill="#f7faf8"/><text x="70" y="338.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Softmax</tspan></text><rect x="339.3333333333333" y="305" width="281.3333333333333" height="55" fill="#f7faf8"/><text x="351.3333333333333" y="338.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="351.3333333333333" dy="0">各类别概率之和为 1</tspan></text><rect x="620.6666666666666" y="305" width="281.3333333333333" height="55" fill="#f7faf8"/><text x="632.6666666666666" y="338.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="632.6666666666666" dy="0">各输出通过分母相互关联</tspan></text></g></svg>