<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="冻结还是微调"><title>冻结还是微调</title><desc>数据规模与任务相似性共同决定训练范围</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">冻结还是微调</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">数据规模与任务相似性共同决定训练范围</text><text x="75" y="122" fill="#176653" font-size="15" font-weight="650" text-anchor="start" font-family="sans-serif">小且相似</text><rect x="75" y="145" width="118" height="72" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="134" y="174" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">冻结</text><text x="134" y="200" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">早期层</text><path d="M193 181 L198 181" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="201" y="145" width="118" height="72" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="260" y="174" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">冻结</text><text x="260" y="200" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">中间层</text><path d="M319 181 L324 181" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="327" y="145" width="118" height="72" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="386" y="174" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">训练</text><text x="386" y="200" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">分类头</text><text x="520" y="122" fill="#b47936" font-size="15" font-weight="650" text-anchor="start" font-family="sans-serif">更大或差异明显</text><rect x="520" y="145" width="118" height="72" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="579" y="174" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">小学习率</text><text x="579" y="200" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">早期层</text><path d="M638 181 L643 181" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="646" y="145" width="118" height="72" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="705" y="174" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">微调</text><text x="705" y="200" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">后期层</text><path d="M764 181 L769 181" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="772" y="145" width="118" height="72" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="831" y="174" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">训练</text><text x="831" y="200" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">分类头</text><rect x="130" y="303" width="700" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="337" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">逐步解冻，用验证集决定训练范围与停止时机。</text></g></svg>
