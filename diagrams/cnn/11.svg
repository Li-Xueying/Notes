<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="Padding、Stride 与输出尺寸"><title>Padding、Stride 与输出尺寸</title><desc>窗口有效位置决定特征图大小</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">Padding、Stride 与输出尺寸</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">窗口有效位置决定特征图大小</text><rect x="70" y="118" width="34" height="34" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="104" y="118" width="34" height="34" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="138" y="118" width="34" height="34" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="172" y="118" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="206" y="118" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="70" y="152" width="34" height="34" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="104" y="152" width="34" height="34" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="138" y="152" width="34" height="34" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="172" y="152" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="206" y="152" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="70" y="186" width="34" height="34" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="104" y="186" width="34" height="34" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="138" y="186" width="34" height="34" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="172" y="186" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="206" y="186" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="70" y="220" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="104" y="220" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="138" y="220" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="172" y="220" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="206" y="220" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="70" y="254" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="104" y="254" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="138" y="254" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="172" y="254" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="206" y="254" width="34" height="34" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="155" y="107" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">Wᵢₙ = 5，P = 1</text><path d="M255 202 L350 202" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><text x="302.5" y="193" fill="#176653" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">K=3, S=2</text><rect x="390" y="133" width="52" height="52" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="442" y="133" width="52" height="52" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="494" y="133" width="52" height="52" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="390" y="185" width="52" height="52" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="442" y="185" width="52" height="52" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="494" y="185" width="52" height="52" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="390" y="237" width="52" height="52" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="442" y="237" width="52" height="52" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><rect x="494" y="237" width="52" height="52" rx="0" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="468" y="122" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">Wₒᵤₜ = 3</text><text x="665" y="142" fill="#667f72" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">P：边界外补值</text><text x="665" y="177" fill="#667f72" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">S：窗口移动间隔</text><text x="665" y="212" fill="#667f72" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">末端不足完整窗口时舍去</text><rect x="120" y="319" width="720" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="353" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Wₒᵤₜ = ⌊(Wᵢₙ + 2P − K) / S⌋ + 1 = 3</text></g></svg>
