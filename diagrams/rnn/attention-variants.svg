<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="三种兼容度打分函数"><title>三种兼容度打分函数</title><desc>改变打分方式，后续 Softmax 和加权汇总步骤相同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">三种兼容度打分函数</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">点积、双线性与加性注意力</text><text x="80" y="137" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">点积：e = sᵀh                       相同状态维度</text><text x="80" y="184" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">双线性：e = sᵀWh                 可有不同维度</text><text x="80" y="231" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">加性：e = vᵀ tanh(W_hh + W_ss + b)</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">三个打分函数 → 同样的归一化与加权汇总</text></g></svg>
