<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="人工智能为何成为共同方法"><title>人工智能为何成为共同方法</title><desc>人工智能从可计算的智能问题发展为支持科学发现与工程系统的方法集合。</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.7"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.7"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start"><tspan x="48" dy="0">从智能问题到科学与工程方法</tspan></text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start"><tspan x="48" dy="0">研究目标扩大，但核心仍是可定义、可学习、可评价的任务</tspan></text><rect x="65" y="145" width="200" height="105" rx="8" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.6"/><text x="165" y="176" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="165" dy="0">可计算的问题</tspan></text><text x="165" y="203" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="165" dy="0">表示 · 推理 · 搜索</tspan></text><rect x="380" y="145" width="200" height="105" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="480" y="176" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="480" dy="0">数据驱动学习</tspan></text><text x="480" y="203" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">从样本中估计规律</tspan></text><rect x="695" y="145" width="200" height="105" rx="8" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.6"/><text x="795" y="176" fill="#263f35" font-size="18" font-weight="600" text-anchor="middle"><tspan x="795" dy="0">科学与工程</tspan></text><text x="795" y="203" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle"><tspan x="795" dy="0">预测 · 生成 · 控制</tspan></text><path d="M265 198 L377 198" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><path d="M580 198 L692 198" stroke="#176653" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/><text x="480" y="321" fill="#667f72" font-size="17" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">理论突破、算法设计、数据积累和计算资源共同推动能力提升。</tspan></text></g></svg>
