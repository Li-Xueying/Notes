<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="终止与长度偏置。完成假设单独保存，再比较长度校正分数"><title>终止与长度偏置</title><desc>完成假设单独保存，再比较长度校正分数。结束符出现时间不同；累计对数概率还会天然偏向较短序列。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">终止与长度偏置</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">完成假设单独保存，再比较长度校正分数</text><rect x="55" y="116" width="390" height="188" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="250" y="203" fill="#263f35" font-size="19" font-weight="650" text-anchor="middle" font-family="sans-serif">完成集合</text><text x="250" y="228" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">遇到 &lt;END&gt; 后单独保存</text><rect x="95" y="201" width="310" height="32" rx="16" fill="#176653" stroke="#176653" stroke-width="1.4"/><text x="250" y="222" fill="#ffffff" font-size="12" font-weight="650" text-anchor="middle" font-family="sans-serif">he hit me with a pie &lt;END&gt;</text><rect x="515" y="116" width="390" height="188" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="710" y="203" fill="#263f35" font-size="19" font-weight="650" text-anchor="middle" font-family="sans-serif">继续搜索</text><text x="710" y="228" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">达到长度上限或足够候选</text><text x="555" y="213" fill="#667f72" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">累计 log 概率偏向短序列</text><text x="555" y="244" fill="#667f72" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">比较时应用长度校正</text><rect x="80" y="321" width="800" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="352" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">score_norm(y) = (1/|y|) Σ_i log P(y_i | y_&lt;i, x)</text></g></svg>
