<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">查询反传，历史键保留在队列</title><desc id="desc">动量对比学习（Momentum Contrast，MoCo）用查询编码器生成 q，键编码器生成同图另一增强的正键 k⁺，历史队列键作为负样本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">查询反传，历史键保留在队列</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="62" y="251" width="239" height="67" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="181.5" y="278.5" font-size="18" fill="#263f35" text-anchor="middle">查询编码器 θq</text><text x="181.5" y="304.5" font-size="14" fill="#5d7469" text-anchor="middle">梯度更新</text><rect x="62" y="126" width="239" height="59" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="181.5" y="161.5" font-size="18" fill="#263f35" text-anchor="middle">查询 q</text><path d="M181 251 L181 189" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="570" y="251" width="315" height="67" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="727.5" y="278.5" font-size="18" fill="#263f35" text-anchor="middle">键编码器 θk</text><text x="727.5" y="304.5" font-size="14" fill="#5d7469" text-anchor="middle">停止梯度 / EMA</text><rect x="570" y="126" width="315" height="59" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="727.5" y="161.5" font-size="18" fill="#263f35" text-anchor="middle">正键 k⁺ + 历史负键</text><path d="M726 251 L726 189" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><path d="M302 157 H451 V96" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 157 H511 V96" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="374" y="63" width="213" height="49" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="480.5" y="93.5" font-size="18" fill="#263f35" text-anchor="middle">对比损失</text><path d="M374 86 H36 V283 H60" fill="none" stroke="#ac4f53" stroke-width="2" marker-end="url(#arrow)"/><path d="M301 283 L566 283" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="432" y="274" font-size="15" fill="#263f35" text-anchor="middle">EMA 参数更新</text><rect x="42" y="362" width="876" height="48" rx="4" fill="#f5f9f6" stroke="#d7e5dc"/><text x="480" y="393" font-size="18" fill="#176653" text-anchor="middle">队列键数与当前批量解耦</text></g></svg>
