<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="LSTM 与 GRU。三门双状态与两门单状态"><title>LSTM 与 GRU</title><desc>三门双状态与两门单状态。GRU 合并状态并用更新门、重置门控制信息流。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">LSTM 与 GRU</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">三门双状态与两门单状态</text><rect x="55" y="108" width="400" height="210" rx="6" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.4"/><text x="255" y="206" fill="#263f35" font-size="21" font-weight="650" text-anchor="middle" font-family="sans-serif">LSTM</text><text x="255" y="231" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">c_t + h_t</text><text x="105" y="188" fill="#667f72" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">遗忘门 f_t</text><text x="105" y="218" fill="#667f72" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">输入门 i_t</text><text x="105" y="248" fill="#667f72" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">输出门 o_t</text><text x="105" y="278" fill="#667f72" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">候选细胞 c̃_t</text><rect x="505" y="108" width="400" height="210" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="705" y="206" fill="#263f35" font-size="21" font-weight="650" text-anchor="middle" font-family="sans-serif">GRU</text><text x="705" y="231" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">单一状态 h_t</text><text x="555" y="188" fill="#667f72" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">更新门 z_t</text><text x="555" y="218" fill="#667f72" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">重置门 r_t</text><text x="555" y="248" fill="#667f72" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">候选状态 h̃_t</text><text x="555" y="278" fill="#667f72" font-size="15" font-weight="400" text-anchor="start" font-family="sans-serif">旧状态与候选插值</text><rect x="150" y="331" width="660" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="362" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">两者都用门控管理跨时间的信息流。</text></g></svg>
