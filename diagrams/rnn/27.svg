<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="更新细胞状态。保留项与写入项通过加法合并"><title>更新细胞状态</title><desc>保留项与写入项通过加法合并。这条加性路径是 LSTM 管理长期信息的关键结构。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">更新细胞状态</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">保留项与写入项通过加法合并</text><rect x="62" y="124" width="250" height="78" rx="6" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.4"/><text x="187" y="156" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">旧记忆</text><text x="187" y="181" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">f_t ⊙ c_(t−1)</text><rect x="62" y="240" width="250" height="78" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="187" y="272" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">新内容</text><text x="187" y="297" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">i_t ⊙ c̃_t</text><path d="M312 163 L438 203" fill="none" stroke="#b47936" stroke-width="2.1" marker-end="url(#arrow-amber)"/><path d="M312 279 L438 223" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><circle cx="480" cy="213" r="34" fill="#ffffff" stroke="#176653" stroke-width="2"/><text x="480" y="222" fill="#176653" font-size="28" font-weight="700" text-anchor="middle" font-family="sans-serif">+</text><path d="M514 213 L680 213" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="700" y="174" width="195" height="78" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="797.5" y="206" fill="#263f35" font-size="19" font-weight="650" text-anchor="middle" font-family="sans-serif">新细胞状态</text><text x="797.5" y="231" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">c_t</text><rect x="145" y="322" width="670" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="353" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">c_t = f_t ⊙ c_(t−1) + i_t ⊙ c̃_t</text></g></svg>
