<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">两个全局与多个局部视图</title><desc id="desc">多裁剪（multi-crop）从同图生成两全局与多个局部视图。原 DINO 默认面积比例为全局 0.4–1.0、局部 0.05–0.4，缩放尺寸分别 224×224 与 96×96。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">两个全局与多个局部视图</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="53" y="156" width="191" height="86" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="148.5" y="193" font-size="18" fill="#263f35" text-anchor="middle">同一原图</text><text x="148.5" y="219" font-size="14" fill="#5d7469" text-anchor="middle">多裁剪</text><path d="M245 198 L309 198" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="313" y="112" width="256" height="69" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="441" y="140.5" font-size="18" fill="#263f35" text-anchor="middle">2 个全局视图</text><text x="441" y="166.5" font-size="14" fill="#5d7469" text-anchor="middle">224×224</text><rect x="313" y="252" width="256" height="69" rx="4" fill="#fcf3df" stroke="#a8c2b4"/><text x="441" y="280.5" font-size="18" fill="#263f35" text-anchor="middle">8 个局部视图</text><text x="441" y="306.5" font-size="14" fill="#5d7469" text-anchor="middle">96×96</text><path d="M570 147 L642 147" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="646" y="112" width="264" height="69" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="778" y="140.5" font-size="18" fill="#263f35" text-anchor="middle">教师</text><text x="778" y="166.5" font-size="14" fill="#5d7469" text-anchor="middle">只读 2 全局</text><path d="M570 161 H608 V286 H642" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 286 L642 286" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="646" y="252" width="264" height="69" rx="4" fill="#fcf3df" stroke="#a8c2b4"/><text x="778" y="280.5" font-size="18" fill="#263f35" text-anchor="middle">学生</text><text x="778" y="306.5" font-size="14" fill="#5d7469" text-anchor="middle">读全部 10 视图</text><rect x="42" y="362" width="876" height="48" rx="4" fill="#f5f9f6" stroke="#d7e5dc"/><text x="480" y="393" font-size="18" fill="#176653" text-anchor="middle">面积比例：全局 40%–100%；局部 5%–40%</text></g></svg>
