th="1"/><rect x="757" y="140" width="19" height="19" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><rect x="776" y="140" width="19" height="19" rx="0" fill="#ffffff" stroke="#a8c2b4" stroke-width="1"/><text x="557.5" y="129" fill="#667f72" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">按固定次序展平：像素值仍然保留</text><text x="565" y="220" fill="#b47936" font-size="15" font-weight="400" text-anchor="middle" font-family="sans-serif">相邻行的局部像素分布在不同向量索引</text><text x="565" y="268" fill="#667f72" font-size="15" font-weight="400" text-anchor="middle" font-family="sans-serif">每个输出连接全部输入 → 需要独立的大型权重矩阵</text><rect x="100" y="313" width="760" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="347" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">局部连接限制读取范围；权重共享复用同一检测器。</text></g></svg>
