<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">独立抽取数据、噪声与时间</title><desc id="desc">每轮从数据集中抽 x，从简单噪声分布抽 z，再抽时间 t。基础设置中三者独立，t 在 [0,1] 均匀采样。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">独立抽取数据、噪声与时间</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">训练数据 x</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">从数据集抽样</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">独立噪声 z</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">与 x 同形状</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">时间 t</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">基础设置 U[0,1]</text><rect x="234" y="314" width="492" height="65" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="343" font-size="18" fill="#283b34" text-anchor="middle">三者共同构造 xₜ 与速度监督</text><text x="480" y="368" font-size="14" fill="#63766c" text-anchor="middle">不需要数据集提供真实去噪轨迹</text></g></svg>
