<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="两种相关性打分方式"><title>两种相关性打分方式</title><desc>把两侧输入分别投影，比较 dot-product 与 additive；接下来采用点积。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">两种相关性打分方式</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">点积与加性打分</text><rect x="64" y="120" width="374" height="65" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="251" y="145.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Dot-product</text><text x="251" y="173.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">qᵀk</text><rect x="46" y="237" width="265.3333333333333" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="178.66666666666666" y="276" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">输入 a、b</text><text x="178.66666666666666" y="304" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">分别投影</text><path d="M311.3333333333333 283 L331.3333333333333 283" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="335.3333333333333" y="237" width="265.3333333333333" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="468" y="276" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">q、k</text><text x="468" y="304" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">相同比较维度</text><path d="M600.6666666666666 283 L620.6666666666666 283" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="624.6666666666666" y="237" width="265.3333333333333" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="757.3333333333333" y="276" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">兼容度分数</text><text x="757.3333333333333" y="304" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">尚未归一化</text><rect x="520" y="120" width="374" height="65" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="707" y="145.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">Additive</text><text x="707" y="173.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">uᵀ tanh(Wa a + Wb b)</text></g></svg>
