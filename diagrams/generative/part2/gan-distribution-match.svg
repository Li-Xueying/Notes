<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">理想匹配时 D*=1/2</title><desc id="desc">把最优 D 代回价值函数，可将生成器的目标解释为缩小真实与生成分布的差异。理想全局解是 pG=pdata，此时在共同支撑上 D*=1/2。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">理想匹配时 D*=1/2</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="67" y="133" width="387" height="115" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="260.5" y="162" font-size="18" fill="#283b34" text-anchor="middle">pG = pdata</text><text x="260.5" y="187" font-size="14" fill="#63766c" text-anchor="middle">所有位置的来源比例相同</text><path d="M459 191 L507 191" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="512" y="133" width="387" height="115" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="705.5" y="162" font-size="18" fill="#283b34" text-anchor="middle">D* = 1/2</text><text x="705.5" y="187" font-size="14" fill="#63766c" text-anchor="middle">理想判别器也无法区分</text><rect x="176" y="304" width="608" height="67" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="333" font-size="18" fill="#283b34" text-anchor="middle">批次上分数 1/2 本身不能证明分布匹配</text><text x="480" y="358" font-size="14" fill="#63766c" text-anchor="middle">还要排除判别器能力不足</text></g></svg>
