<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">先预测速度，再向较小 t 移动</title><desc id="desc">生成过程求解 dxt/dt=fθ(xt,t)，从 t=1 向 t=0 积分。均匀 Euler 步长为 −1/T，所以用当前状态减去预测速度的 1/T。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">先预测速度，再向较小 t 移动</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">当前位置 xₜ</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">当前时间 t</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">求 vₜ=fθ(xₜ,t)</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">沿时间增加定义</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">更新 xₜ−vₜ/T</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">向较小时间移动</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">从 1 走到 0，负步长给出更新减号</text></g></svg>
