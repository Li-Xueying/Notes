<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="并行预测多个位置，如何决定长度？"><title>并行预测多个位置，如何决定长度？</title><desc>另设长度预测器，或保留足够输出槽位。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">并行预测多个位置，如何决定长度？</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">另设长度预测器，或保留足够输出槽位</text><text x="80" y="133" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">AR：BOS → w₁ → w₂ → w₃ → END</text><text x="80" y="181" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">NAR：同时预测 w₁、w₂、w₃、…</text><text x="80" y="229" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">长度：单独预测，或准备足够槽位并在 END 后截断</text><rect x="46" y="334" width="868" height="51" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="365" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">AR 依赖前缀；NAR 尝试并行生成多个目标位置</text></g></svg>
