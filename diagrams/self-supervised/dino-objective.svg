<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">跨视图匹配教师原型分布</title><desc id="desc">投影头输出 K 维原型分数，再转成分布。原型没有人工类别名称；两全局加八局部时，两教师各匹配九个学生视图，共 18 项。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">跨视图匹配教师原型分布</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="46" y="139" width="297" height="81" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="194.5" y="173.5" font-size="18" fill="#263f35" text-anchor="middle">教师：2 全局</text><text x="194.5" y="199.5" font-size="14" fill="#5d7469" text-anchor="middle">pt 停止梯度</text><path d="M346 179 L417 179" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="423" y="126" width="480" height="105" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="663" y="172.5" font-size="18" fill="#263f35" text-anchor="middle">每个全局匹配其余 9 学生视图</text><text x="663" y="198.5" font-size="14" fill="#5d7469" text-anchor="middle">2×9 = 18 个交叉熵项</text><rect x="42" y="362" width="876" height="48" rx="4" fill="#f5f9f6" stroke="#d7e5dc"/><text x="480" y="393" font-size="18" fill="#176653" text-anchor="middle">同一视图配对排除；有效项等权平均</text></g></svg>
