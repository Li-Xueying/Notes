<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="MNIST：把组件串成十分类网络"><title>MNIST：把组件串成十分类网络</title><desc>28×28 灰度图，5×5 卷积，2×2 池化，10 类输出</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">MNIST：把组件串成十分类网络</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">28×28 灰度图，5×5 卷积，2×2 池化，10 类输出</text><rect x="40" y="140" width="136.66666666666666" height="105" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="108.33333333333333" y="185.5" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">输入</text><text x="108.33333333333333" y="211.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">1×28×28</text><path d="M176.66666666666666 192.5 L185.66666666666666 192.5" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="188.66666666666666" y="140" width="136.66666666666666" height="105" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="257" y="185.5" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">Conv 1</text><text x="257" y="211.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">10×24×24</text><path d="M325.3333333333333 192.5 L334.3333333333333 192.5" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="337.3333333333333" y="140" width="136.66666666666666" height="105" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="405.66666666666663" y="185.5" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">Pool</text><text x="405.66666666666663" y="211.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">10×12×12</text><path d="M474 192.5 L483 192.5" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="486" y="140" width="136.66666666666666" height="105" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="554.3333333333334" y="185.5" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">Conv 2</text><text x="554.3333333333334" y="211.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">20×8×8</text><path d="M622.6666666666666 192.5 L631.6666666666666 192.5" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="634.6666666666666" y="140" width="136.66666666666666" height="105" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="703" y="185.5" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">Pool</text><text x="703" y="211.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">20×4×4</text><path d="M771.3333333333333 192.5 L780.3333333333333 192.5" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="783.3333333333333" y="140" width="136.66666666666666" height="105" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="851.6666666666666" y="185.5" fill="#263f35" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">Flatten + FC</text><text x="851.6666666666666" y="211.5" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">320 → 10</text><text x="480" y="295" fill="#667f72" font-size="17" font-weight="400" text-anchor="middle" font-family="sans-serif">每个卷积阶段使用 ReLU；两次池化逐步降低空间分辨率。</text><rect x="65" y="323" width="830" height="53" rx="5" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.5"/><text x="480" y="357" fill="#176653" font-size="18" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">两个 5×5 卷积学习特征，最后的全连接层输出类别分数。</text></g></svg>
