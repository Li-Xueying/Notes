<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="神经翻译一起优化整个系统"><title>神经翻译一起优化整个系统</title><desc>统一优化译文概率，减少分立模块与人工特征。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">神经翻译一起优化整个系统</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">流畅、上下文利用与工程简化</text><rect x="48" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="180" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">上下文与流畅度</text><text x="180" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">学习连续表示</text><path d="M312 200 L332 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="336" y="154" width="264" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="468" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">整个系统</text><text x="468" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">端到端优化</text><path d="M600 200 L620 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="756" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">人工工程量</text><text x="756" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">减少模块和特征</text></g></svg>
