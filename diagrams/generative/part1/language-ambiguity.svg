<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">一个诗歌提示，许多可能文本</title><desc id="desc">语言生成把提示作为条件 y，把后续文本作为输出 x。“写一首关于生成模型的押韵短诗”可以对应许多不同答案，模型学习 p(x|y)。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">一个诗歌提示，许多可能文本</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="43" y="136" width="300" height="122" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="193" y="166" font-size="18" fill="#283b34" text-anchor="middle">提示条件 y</text><text x="193" y="191" font-size="14" fill="#63766c" text-anchor="middle">写一首关于生成模型的</text><text x="193" y="214" font-size="14" fill="#63766c" text-anchor="middle">押韵短诗</text><path d="M347 197 L408 197" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="412" y="136" width="502" height="122" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="663" y="166" font-size="18" fill="#283b34" text-anchor="middle">一种可能的输出 x</text><text x="663" y="191" font-size="14" fill="#63766c" text-anchor="middle">它从学到的分布采样；</text><text x="663" y="214" font-size="14" fill="#63766c" text-anchor="middle">每个词依上下文登场。</text><text x="480" y="405" font-size="17" fill="#63766c" text-anchor="middle">相同提示可以对应多个合理文本：建模 p(x|y)</text></g></svg>
