<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">重建与 KL 相加，再反向传播</title><desc id="desc">编码器给 μ=(0.5,−1)、σ=(0.5,2)；解析 KL=1.75。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">重建与 KL 相加，再反向传播</text><path d="M42 63 H918" stroke="#ccdbd2"/><text x="480" y="103" font-size="17" fill="#63766c" text-anchor="middle">二维结构算例：输入与噪声在所有步骤中保持固定</text><rect x="43" y="159" width="150" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="118" y="189" font-size="18" fill="#283b34" text-anchor="middle">输入 x</text><text x="118" y="214" font-size="14" fill="#63766c" text-anchor="middle">(0.6, -0.2)</text><path d="M197 202 L227 202" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="231" y="150" width="238" height="104" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="350" y="180" font-size="18" fill="#283b34" text-anchor="middle">编码分布参数</text><text x="350" y="205" font-size="14" fill="#63766c" text-anchor="middle">μ=(0.5, -1)</text><text x="350" y="228" font-size="14" fill="#63766c" text-anchor="middle">σ=(0.5, 2)</text><rect x="231" y="289" width="238" height="56" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="350" y="323" font-size="18" fill="#283b34" text-anchor="middle">先验 KL = 1.75</text><path d="M350 256 L350 284" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="422" font-size="17" fill="#63766c" text-anchor="middle">先得到分布参数，再将独立噪声变成潜变量</text></g></svg>
