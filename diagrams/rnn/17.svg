<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="RNN 的递推状态。同一参数跨时间反复使用"><title>RNN 的递推状态</title><desc>同一参数跨时间反复使用。隐藏状态把历史摘要和当前输入组合，再传给下一步。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">RNN 的递推状态</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">同一参数跨时间反复使用</text><rect x="90" y="147" width="118" height="82" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="149" y="181" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">h_1</text><text x="149" y="206" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">初始更新</text><rect x="105" y="270" width="88" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="149" y="296" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">x_1</text><path d="M149 270 L149 229" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M208 188 L295 188" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><text x="251.5" y="180" fill="#176653" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">state</text><rect x="295" y="147" width="118" height="82" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="354" y="181" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">h_2</text><text x="354" y="206" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">同一参数 W</text><rect x="310" y="270" width="88" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="354" y="296" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">x_2</text><path d="M354 270 L354 229" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M413 188 L500 188" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><text x="456.5" y="180" fill="#176653" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">state</text><rect x="500" y="147" width="118" height="82" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="559" y="181" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">h_3</text><text x="559" y="206" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">同一参数 W</text><rect x="515" y="270" width="88" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="559" y="296" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">x_3</text><path d="M559 270 L559 229" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M618 188 L705 188" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><text x="661.5" y="180" fill="#176653" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">state</text><rect x="705" y="147" width="118" height="82" rx="6" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.4"/><text x="764" y="181" fill="#263f35" font-size="16" font-weight="650" text-anchor="middle" font-family="sans-serif">h_4</text><text x="764" y="206" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">同一参数 W</text><rect x="720" y="270" width="88" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="764" y="296" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">x_4</text><path d="M764 270 L764 229" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M130 119 L765 119" fill="none" stroke="#b47936" stroke-width="2" stroke-dasharray="5 5"/><text x="448" y="109" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">W_x、W_h 在所有时间步共享</text><rect x="155" y="326" width="650" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="357" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">h_t = tanh(W_x x_t + W_h h_(t−1) + b_h)</text></g></svg>
