<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="条件语言模型。分解 P(y|x)，端到端优化整条路径"><title>条件语言模型</title><desc>分解 P(y|x)，端到端优化整条路径。训练使用平行语料和真实目标序列，推理则依赖模型自身生成的前缀。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">条件语言模型</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">分解 P(y|x)，端到端优化整条路径</text><rect x="55" y="125" width="185" height="160" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="147.5" y="198" fill="#263f35" font-size="20" font-weight="650" text-anchor="middle" font-family="sans-serif">源序列 x</text><text x="147.5" y="223" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">编码条件</text><path d="M240 205 L325 205" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="345" y="155" width="84" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="387" y="181" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">y₁</text><path d="M429 176 L453 176" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="457" y="155" width="84" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="499" y="181" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">y₂</text><path d="M541 176 L565 176" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="569" y="155" width="84" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="611" y="181" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">y₃</text><path d="M653 176 L677 176" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="681" y="155" width="84" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="723" y="181" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">…</text><path d="M765 176 L789 176" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="793" y="155" width="84" height="42" rx="5" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="835" y="181" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">y_T</text><path d="M148 285 C310 335 690 335 835 207" fill="none" stroke="#176653" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="180" y="321" width="600" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="352" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">P(y|x) = Π_t P(y_t | y_&lt;t, x)</text></g></svg>
