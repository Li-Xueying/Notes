<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">两端能推导出更简单的条件均值</title><desc id="desc">在 t=1 时 xt=z 已知，但数据端点仍独立，最优速度为 z−E[x]。在 t=0 时 xt=x 已知，而 E[z]=0，所以最优速度为 −x。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">两端能推导出更简单的条件均值</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="55" y="124" width="406" height="130" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="258" y="153" font-size="18" fill="#283b34" text-anchor="middle">t=1：已知 z</text><text x="258" y="178" font-size="14" fill="#63766c" text-anchor="middle">只需平均未知的数据端点</text><text x="258" y="200" font-size="14" fill="#63766c" text-anchor="middle">f*(z,1)=z−E[x]</text><rect x="501" y="124" width="406" height="130" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="704" y="153" font-size="18" fill="#283b34" text-anchor="middle">t=0：已知 x</text><text x="704" y="178" font-size="14" fill="#63766c" text-anchor="middle">只需平均未知的噪声端点</text><text x="704" y="200" font-size="14" fill="#63766c" text-anchor="middle">f*(x,0)=−x</text><text x="480" y="341" font-size="17" fill="#63766c" text-anchor="middle">端点独立；标准高斯 E[z]=0；最优速度仍含当前状态</text></g></svg>
