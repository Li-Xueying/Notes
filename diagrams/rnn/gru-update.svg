<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="GRU 的四项计算"><title>GRU 的四项计算</title><desc>采用 h_t = (1−z_t)⊙h_(t−1) + z_t⊙h̃_t 的约定，z 越大写入候选越多。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">GRU 的四项计算</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">门 → 候选 → 新状态</text><text x="80" y="137" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">zₜ = σ(W_z[hₜ₋₁;xₜ] + b_z)</text><text x="80" y="184" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">rₜ = σ(W_r[hₜ₋₁;xₜ] + b_r)</text><text x="80" y="231" font-size="18" fill="#263f35" text-anchor="start" font-weight="400">h̃ₜ = tanh(W_c[rₜ ⊙ hₜ₋₁;xₜ] + b_c)</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">hₜ = (1 − zₜ) ⊙ hₜ₋₁ + zₜ ⊙ h̃ₜ</text></g></svg>
