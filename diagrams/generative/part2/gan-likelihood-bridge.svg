<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">生成样本需要显式密度吗</title><desc id="desc">自回归模型把联合分布写成可计算的条件概率乘积；VAE 用潜变量构造生成过程，并最大化对数似然下界。GAN 选择另一条路线：先定义可采样的生成器，再通过对抗学习匹配数据分布。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">生成样本需要显式密度吗</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="172.66666666666666" y="199" font-size="18" fill="#283b34" text-anchor="middle">自回归</text><text x="172.66666666666666" y="224" font-size="14" fill="#63766c" text-anchor="middle">显式条件似然</text><path d="M306.3333333333333 215 L345.3333333333333 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="349.3333333333333" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="199" font-size="18" fill="#283b34" text-anchor="middle">VAE</text><text x="480" y="224" font-size="14" fill="#63766c" text-anchor="middle">变分下界</text><path d="M613.6666666666666 215 L652.6666666666666 215" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.6666666666666" y="170" width="261.3333333333333" height="90" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="787.3333333333333" y="199" font-size="18" fill="#283b34" text-anchor="middle">GAN</text><text x="787.3333333333333" y="224" font-size="14" fill="#63766c" text-anchor="middle">可采样隐式分布</text><text x="480" y="414" font-size="17" fill="#63766c" text-anchor="middle">仍然学习数据分布；改变提供训练信号的方法</text></g></svg>
