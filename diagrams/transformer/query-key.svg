<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="固定 q₁，与各位置的 kᵢ 匹配"><title>固定 q₁，与各位置的 kᵢ 匹配</title><desc>Q 表示查询角色，K 表示被查询角色；分数可以为负，还不是概率。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="39" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">固定 q₁，与各位置的 kᵢ 匹配</text><text x="46" y="65" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">q₁ = Wq a₁；kᵢ = Wk aᵢ</text><rect x="61" y="185" width="133" height="65" rx="4" fill="#fbf0dd" stroke="#a8c2b4"/><text x="127.5" y="210.5" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">q₁</text><text x="127.5" y="238.5" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">Wq a₁</text><rect x="307" y="278" width="112" height="50" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="363" y="309" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">a1</text><path d="M363 278 L363 223" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="307" y="169" width="112" height="54" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="363" y="202" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">k1</text><path d="M195 213 L307 169" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="363" y="139" font-size="16" fill="#263f35" text-anchor="middle" font-weight="400">q₁ᵀk1</text><rect x="459" y="278" width="112" height="50" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="515" y="309" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">a2</text><path d="M515 278 L515 223" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="459" y="169" width="112" height="54" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="515" y="202" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">k2</text><path d="M195 213 L459 169" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="139" font-size="16" fill="#263f35" text-anchor="middle" font-weight="400">q₁ᵀk2</text><rect x="611" y="278" width="112" height="50" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="667" y="309" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">a3</text><path d="M667 278 L667 223" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="611" y="169" width="112" height="54" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="667" y="202" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">k3</text><path d="M195 213 L611 169" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="667" y="139" font-size="16" fill="#263f35" text-anchor="middle" font-weight="400">q₁ᵀk3</text><rect x="763" y="278" width="112" height="50" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="819" y="309" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">a4</text><path d="M819 278 L819 223" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="763" y="169" width="112" height="54" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="819" y="202" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">k4</text><path d="M195 213 L763 169" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="819" y="139" font-size="16" fill="#263f35" text-anchor="middle" font-weight="400">q₁ᵀk4</text></g></svg>
