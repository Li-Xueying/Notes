<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">从数据分布到两条生成路线</title><desc id="desc">监督学习使用输入与目标配对，无监督学习从数据结构建立目标。判别模型预测标签，生成模型描述数据，条件生成模型在指定条件下描述可能输出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">从数据分布到两条生成路线</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="50" y="111" width="406" height="125" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="253" y="141" font-size="18" fill="#283b34" text-anchor="middle">自回归</text><text x="253" y="166" font-size="14" fill="#63766c" text-anchor="middle">条件分布乘积</text><text x="253" y="189" font-size="14" fill="#63766c" text-anchor="middle">按前缀逐项采样</text><rect x="504" y="111" width="406" height="125" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="707" y="141" font-size="18" fill="#283b34" text-anchor="middle">VAE</text><text x="707" y="166" font-size="14" fill="#63766c" text-anchor="middle">潜变量边缘化与 ELBO</text><text x="707" y="189" font-size="14" fill="#63766c" text-anchor="middle">先验采样后解码</text><rect x="143" y="303" width="674" height="71" rx="4" fill="#fff1d7" stroke="#ccdbd2"/><text x="480" y="333" font-size="18" fill="#283b34" text-anchor="middle">继续比较：训练信号怎样来？样本怎样生成？</text><text x="480" y="358" font-size="14" fill="#63766c" text-anchor="middle">Part II：生成对抗网络与扩散模型</text></g></svg>
