<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="两套词向量与 Softmax。中心向量、上下文向量和点积分数"><title>两套词向量与 Softmax</title><desc>中心向量、上下文向量和点积分数。每个词在中心角色和上下文角色中使用不同参数向量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">两套词向量与 Softmax</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">中心向量、上下文向量和点积分数</text><rect x="55" y="118" width="250" height="166" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="180" y="194" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">中心向量表 V</text><text x="180" y="219" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">取 v_c</text><rect x="655" y="118" width="250" height="166" rx="6" fill="#eaf1f4" stroke="#a8c2b4" stroke-width="1.4"/><text x="780" y="194" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">上下文向量表 U</text><text x="780" y="219" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">取 u_o 与全部 u_w</text><path d="M305 201 L430 201" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><text x="367.5" y="193" fill="#176653" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">v_c</text><path d="M655 201 L530 201" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><text x="592.5" y="193" fill="#176653" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">u_o</text><circle cx="480" cy="201" r="42" fill="#fbf0dd" stroke="#b47936" stroke-width="1.5"/><text x="480" y="208" fill="#b47936" font-size="17" font-weight="650" text-anchor="middle" font-family="sans-serif">uₒᵀv꜀</text><rect x="115" y="317" width="730" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="348" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">P(o|c) = exp(uₒᵀv꜀) / Σ_(w∈V) exp(u_wᵀv꜀)</text></g></svg>
