<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">重建与对抗学习各自约束什么？</title><desc id="desc">二值掩码 M=1 表示缺失，输入为 (1−M)⊙x。生成器 F 预测，判别器 D 区分真实与重建；两者更新方向不同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">重建与对抗学习各自约束什么？</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="42" y="127" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="174" y="162" font-size="18" fill="#263f35" text-anchor="middle">掩码上下文</text><text x="174" y="188" font-size="14" fill="#5d7469" text-anchor="middle">(1−M)⊙x</text><path d="M306 168 L328 168" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="127" width="264" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="466" y="162" font-size="18" fill="#263f35" text-anchor="middle">生成器 F</text><text x="466" y="188" font-size="14" fill="#5d7469" text-anchor="middle">重建缺失区</text><path d="M598 168 L620 168" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="626" y="127" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="758" y="162" font-size="18" fill="#263f35" text-anchor="middle">像素重建</text><text x="758" y="188" font-size="14" fill="#5d7469" text-anchor="middle">只比较 M 内</text><rect x="605" y="280" width="280" height="63" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="745" y="305.5" font-size="18" fill="#263f35" text-anchor="middle">判别器 D</text><text x="745" y="331.5" font-size="14" fill="#5d7469" text-anchor="middle">真图 / 重建真假</text><path d="M480 209 V311 H601" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 280 V259 H480 V209" fill="none" stroke="#ac4f53" stroke-width="2" marker-end="url(#arrow)"/><text x="265" y="319" font-size="18" fill="#263f35" text-anchor="middle">F 最小化；D 最大化</text></g></svg>
