<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">先学特征，再适配目标任务</title><desc id="desc">迁移学习（transfer learning）先在源数据学习编码器，再用小目标数据集训练新任务头。编码器把图像转为特征向量，任务头给出类别等输出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">先学特征，再适配目标任务</text><path d="M42 63 H918" stroke="#d7e5dc"/><text x="121" y="119" font-size="19" fill="#263f35" text-anchor="middle">从头训练</text><rect x="42" y="145" width="410" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="247" y="180" font-size="18" fill="#263f35" text-anchor="middle">较多目标标签</text><text x="247" y="206" font-size="14" fill="#5d7469" text-anchor="middle">同时学特征与头</text><path d="M452 186 L474 186" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="145" width="410" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="685" y="180" font-size="18" fill="#263f35" text-anchor="middle">编码器 + 头</text><text x="685" y="206" font-size="14" fill="#5d7469" text-anchor="middle">输出目标类别</text><text x="121" y="275" font-size="19" fill="#263f35" text-anchor="middle">迁移学习</text><rect x="42" y="300" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="174" y="335" font-size="18" fill="#263f35" text-anchor="middle">大源数据</text><text x="174" y="361" font-size="14" fill="#5d7469" text-anchor="middle">预训练编码器</text><path d="M306 341 L328 341" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="300" width="264" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="466" y="335" font-size="18" fill="#263f35" text-anchor="middle">小目标数据</text><text x="466" y="361" font-size="14" fill="#5d7469" text-anchor="middle">换头 / 微调</text><path d="M598 341 L620 341" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="626" y="300" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="758" y="335" font-size="18" fill="#263f35" text-anchor="middle">目标评价</text><text x="758" y="361" font-size="14" fill="#5d7469" text-anchor="middle">k ≪ n</text></g></svg>
