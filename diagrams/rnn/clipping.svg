<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="梯度裁剪：同方向，小步长"><title>梯度裁剪：同方向，小步长</title><desc>保持向量方向，限制更新幅度，用于控制爆炸梯度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">梯度裁剪：同方向，小步长</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">超过阈值时按比例缩小范数</text><path d="M200 280 L700 110" fill="none" stroke="#a75d52" stroke-width="2" marker-end="url(#arrow)"/><path d="M200 280 L450 195" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><text x="706" y="98" font-size="17" fill="#a75d52" text-anchor="middle" font-weight="400">原梯度 g</text><text x="466" y="194" font-size="17" fill="#176653" text-anchor="middle" font-weight="400">裁剪后的 g</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">g_clip = g · min(1, τ / ‖g‖₂)</text></g></svg>
