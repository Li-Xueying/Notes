<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="词频的 3/4 次幂抽样"><title>词频的 3/4 次幂抽样</title><desc>0.9 的 3/4 次幂约为 0.924，0.01 的约为 0.0316；再在整个词表上归一化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.5"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="40" font-size="22" fill="#263f35" text-anchor="start" font-weight="650">词频的 3/4 次幂抽样</text><text x="46" y="66" font-size="13" fill="#667f72" text-anchor="start" font-weight="400">高频仍更常见，低频获得相对更多机会</text><rect x="48" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="180" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">原频率</text><text x="180" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">0.9 / 0.01</text><path d="M312 200 L332 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="336" y="154" width="264" height="92" rx="4" fill="#eaf1f4" stroke="#a8c2b4"/><text x="468" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">取 3/4 次幂</text><text x="468" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">0.924 / 0.0316</text><path d="M600 200 L620 200" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="154" width="264" height="92" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="756" y="193" font-size="17" fill="#263f35" text-anchor="middle" font-weight="650">整个词表归一化</text><text x="756" y="221" font-size="14" fill="#667f72" text-anchor="middle" font-weight="400">频率比 90 → 约 29.2</text><rect x="48" y="323" width="864" height="52" rx="4" fill="#f6faf7" stroke="#d7e5dc"/><text x="480" y="355" font-size="18" fill="#176653" text-anchor="middle" font-weight="400">P_n(w) = f(w)^(3/4) / ∑_v f(v)^(3/4)</text></g></svg>
