<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="CNNs and Image Recognition"><title>CNNs and Image Recognition</title><desc>从局部计算到深层视觉网络</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="43" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">CNNs and Image Recognition</text><text x="48" y="69" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">从局部计算到深层视觉网络</text><rect x="55" y="158" width="272.6666666666667" height="100" rx="7" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="191.33333333333334" y="201" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">卷积神经网络</text><text x="191.33333333333334" y="227" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">局部结构</text><path d="M327.6666666666667 208 L340.6666666666667 208" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="343.6666666666667" y="158" width="272.6666666666667" height="100" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="480" y="201" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">CNN 训练</text><text x="480" y="227" fill="#667f72" font-size="13" font-weight="400" text-anchor="middle" font-family="sans-serif">空间梯度</text><path d="M616.3333333333334 208 L629.3333333333334 208" fill="none" stroke="#176653" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="632.3333333333334" y="158" width="272.6666666666667" height="100" rx="7" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.5"/><text x="768.66666