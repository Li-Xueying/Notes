<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="准备写入内容。输入门选择候选状态"><title>准备写入内容</title><desc>输入门选择候选状态。候选状态与最终细胞状态含义不同，写入前还要经过输入门。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">准备写入内容</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">输入门选择候选状态</text><rect x="75" y="117" width="270" height="76" rx="6" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.4"/><text x="210" y="148" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">输入门 i_t</text><text x="210" y="173" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">写多少</text><rect x="75" y="235" width="270" height="76" rx="6" fill="#eaf1f4" stroke="#a8c2b4" stroke-width="1.4"/><text x="210" y="266" fill="#263f35" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">候选状态 c̃_t</text><text x="210" y="291" fill="#667f72" font-size="12" font-weight="400" text-anchor="middle" font-family="sans-serif">写什么</text><path d="M345 155 L490 198" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M345 273 L490 218" fill="none" stroke="#176653" stroke-width="2.1" marker-end="url(#arrow)"/><circle cx="530" cy="208" r="31" fill="#fbf0dd" stroke="#b47936" stroke-width="1.5"/><text x="530" y="217" fill="#b47936" font-size="27" font-weight="700" text-anchor="middle" font-family="sans-serif">⊙</text><path d="M561 208 L855 208" fill="none" stroke="#b47936" stroke-width="2.1" marker-end="url(#arrow-amber)"/><text x="705" y="188" fill="#b47936" font-size="18" font-weight="650" text-anchor="middle" font-family="sans-serif">i_t ⊙ c̃_t</text><rect x="195" y="321" width="570" height="50" rx="4" fill="#f6faf7" stroke="#d7e5dc" stroke-width="1.4"/><text x="480" y="352" fill="#176653" font-size="17" font-weight="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">i_t = σ(·)       c̃_t = tanh(·)</text></g></svg>
