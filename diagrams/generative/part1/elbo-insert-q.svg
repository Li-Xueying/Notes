<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">第二步：分子分母同乘近似后验</title><desc id="desc">引入 qφ 不需要先假设它已经等于真实后验。只要相关支持和可积条件满足，就能乘同一个非零因子，为下一步分组创造条件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">第二步：分子分母同乘近似后验</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="163" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="171.33333333333334" y="193" font-size="18" fill="#283b34" text-anchor="middle">原始比值</text><text x="171.33333333333334" y="218" font-size="14" fill="#63766c" text-anchor="middle">保留 p(z)</text><path d="M304.6666666666667 206 L346.6666666666667 206" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="350.6666666666667" y="163" width="258.6666666666667" height="86" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="480" y="193" font-size="18" fill="#283b34" text-anchor="middle">乘 qφ / qφ</text><text x="480" y="218" font-size="14" fill="#63766c" text-anchor="middle">值保持不变</text><path d="M613.3333333333334 206 L655.3333333333334 206" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><rect x="659.3333333333334" y="163" width="258.6666666666667" height="86" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="788.6666666666667" y="193" font-size="18" fill="#283b34" text-anchor="middle">准备重新分组</text><text x="788.6666666666667" y="218" font-size="14" fill="#63766c" text-anchor="middle">近似后验进入代数式</text><text x="480" y="405" font-size="17" fill="#63766c" text-anchor="middle">qφ 出现在分子和分母中；此时仍为精确恒等式</text></g></svg>
