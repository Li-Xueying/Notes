<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 0 960 417" role="img" aria-label="对齐为什么复杂。对应关系可以多对一、一对多或多对多"><title>对齐为什么复杂</title><desc>对应关系可以多对一、一对多或多对多。对齐通常没有直接标注，因此在统计模型中作为潜变量学习。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#176653" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b47936" stroke-width="1.6"/></marker></defs><rect width="960" height="417" fill="#fbfdfb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="46" y="41" fill="#263f35" font-size="22" font-weight="650" text-anchor="start" font-family="sans-serif">对齐为什么复杂</text><text x="46" y="66" fill="#667f72" font-size="13" font-weight="400" text-anchor="start" font-family="sans-serif">对应关系可以多对一、一对多或多对多</text><rect x="95" y="112" width="110" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="150" y="138" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">la</text><rect x="245" y="112" width="110" height="42" rx="5" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="300" y="138" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">maison</text><rect x="395" y="112" width="110" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="450" y="138" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">bleue</text><rect x="515" y="264" width="110" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="570" y="290" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">the</text><rect x="665" y="264" width="110" height="42" rx="5" fill="#ffffff" stroke="#a8c2b4" stroke-width="1.2"/><text x="720" y="290" fill="#263f35" font-size="14" font-weight="500" text-anchor="middle" font-family="sans-serif">blue</text><rect x="815" y="264" width="110" height="42" rx="5" fill="#fbf0dd" stroke="#b47936" stroke-width="2"/><text x="870" y="290" fill="#b47936" font-size="14" font-weight="650" text-anchor="middle" font-family="sans-serif">house</text><path d="M150 154 C260 205 690 210 870 264" fill="none" stroke="#176653" stroke-width="2"/><path d="M300 154 C410 195 690 225 870 264" fill="none" stroke="#b47936" stroke-width="2"/><path d="M450 154 C505 198 520 220 570 264" fill="none" stroke="#547a8a" stroke-width="2"/><path d="M450 154 C560 203 650 220 720 264" fill="none" stroke="#547a8a" stroke-width="2"/><text x="480" y="224" fill="#667f72" font-size="15" font-weight="650" text-anchor="middle" font-family="sans-serif">一对多、多对一与词序变化可以同时出现</text></g></svg>
