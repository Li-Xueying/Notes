<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">目标标注有限，怎样学习？</title><desc id="desc">为任务收集带标注数据，选择网络与训练目标，再训练并部署，是常见监督学习路径。数据质量、覆盖范围和学习目标共同影响模型。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#263f35" text-anchor="start">目标标注有限，怎样学习？</text><path d="M42 63 H918" stroke="#d7e5dc"/><rect x="42" y="170" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="174" y="205" font-size="18" fill="#263f35" text-anchor="middle">收集标签</text><text x="174" y="231" font-size="14" fill="#5d7469" text-anchor="middle">任务专属</text><path d="M306 211 L328 211" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="170" width="264" height="82" rx="4" fill="#edf3f8" stroke="#a8c2b4"/><text x="466" y="205" font-size="18" fill="#263f35" text-anchor="middle">设计与训练</text><text x="466" y="231" font-size="14" fill="#5d7469" text-anchor="middle">模型 + 目标</text><path d="M598 211 L620 211" fill="none" stroke="#176653" stroke-width="2" marker-end="url(#arrow)"/><rect x="626" y="170" width="264" height="82" rx="4" fill="#e9f3ee" stroke="#a8c2b4"/><text x="758" y="205" font-size="18" fill="#263f35" text-anchor="middle">部署评价</text><text x="758" y="231" font-size="14" fill="#5d7469" text-anchor="middle">检查泛化</text><rect x="222" y="286" width="516" height="59" rx="4" fill="#fcf3df" stroke="#a8c2b4"/><text x="480" y="321.5" font-size="18" fill="#263f35" text-anchor="middle">目标标注有限：能否复用已有特征？</text></g></svg>
