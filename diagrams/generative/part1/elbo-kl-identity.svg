<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">第五步：把两个比值期望识别为 KL</title><desc id="desc">KL 散度（Kullback–Leibler divergence）定义为对第一分布取对数密度比的期望。在满足支持条件时，它非负，但通常不对称。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="39" font-size="22" fill="#283b34" text-anchor="start">第五步：把两个比值期望识别为 KL</text><path d="M42 63 H918" stroke="#ccdbd2"/><rect x="42" y="145" width="275" height="96" rx="4" fill="#eaf2f8" stroke="#ccdbd2"/><text x="179.5" y="175" font-size="18" fill="#283b34" text-anchor="middle">重建项</text><text x="179.5" y="200" font-size="14" fill="#63766c" text-anchor="middle">Eq[log pθ(x|z)]</text><rect x="342" y="145" width="275" height="96" rx="4" fill="#eaf3ed" stroke="#ccdbd2"/><text x="479.5" y="175" font-size="18" fill="#283b34" text-anchor="middle">先验 KL</text><text x="479.5" y="200" font-size="14" fill="#63766c" text-anchor="middle">KL(qφ(z|x) ∥ p(z))</text><rect x="642" y="145" width="275" height="96" rx="4" fill="#f9e7e3" stroke="#ccdbd2"/><text x="779.5" y="175" font-size="18" fill="#283b34" text-anchor="middle">后验 KL</text><text x="779.5" y="200" font-size="14" fill="#63766c" text-anchor="middle">KL(qφ(z|x) ∥ pθ(z|x))</text><text x="330" y="205" font-size="27" fill="#283b34" text-anchor="middle">−</text><text x="630" y="205" font-size="27" fill="#283b34" text-anchor="middle">+</text><path d="M45 258 V278 H615 V258" fill="none" stroke="#2f7253" stroke-width="2" marker-end="url(#arrow)"/><text x="330" y="316" font-size="21" fill="#2f7253" text-anchor="middle">前两项合起来：ELBO</text><text x="480" y="383" font-size="20" fill="#283b34" text-anchor="middle">log pθ(x) = ELBO + 非负差距</text></g></svg>
